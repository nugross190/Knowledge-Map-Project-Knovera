name: Check site

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate data and rebuild pages
        run: python scripts/build.py
      - name: Check generated TKA items
        run: python scripts/check_generated.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Built pages are committed
        run: |
          # git status, unlike git diff, also lists pages the build added but nobody committed, and pages it removed.
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "::error::docs/ is out of date. Run 'python scripts/build.py' and commit the result."
            git status --short -- docs
            exit 1
          fi
