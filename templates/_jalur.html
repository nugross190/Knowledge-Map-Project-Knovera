<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Lato:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: learning path (pilot). A home view (path, skills, teacher code) and a card player that runs one card at a time:
   prerequisite check and bridges, then per unit kait → media → lihat → bersama → sendiri (mastery) → ringkas, with spaced
   review at the start of a session. Content comes from data/jalur/<id>.json (specs/jalur-spec.md). */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunk:#E9EBF1; --ink:#1A1F33; --muted:#585E73; --line:#D6DAE3;
  --accent:#0A64A8; --accent-soft:#D7EDFB; --warn:#9A3B1F; --warn-soft:#F8E6DF; --ok:#2C6B3F; --ok-soft:#E1F0E5;
  --st0:#9AA1B2; --st1:#D9822B; --st2:#2E8B57; --st3:#1F5E3A;
  --f-label:"Poppins",system-ui,sans-serif; --f-body:"Lato",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
h1,h2,h3{font-family:var(--f-label);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(1.9rem,5vw,2.7rem);font-weight:700}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
a{color:inherit}
sub,sup{line-height:0}
.eyebrow{font-family:var(--f-label);font-weight:600;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lead{max-width:64ch;color:var(--muted);font-size:1.02rem;margin-top:10px}
.mono{font-family:var(--f-mono);font-size:.82em}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.home-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:600;font-size:.9rem;color:var(--muted);text-decoration:none;margin-bottom:14px}
.home-link:hover,.home-link:focus-visible{color:var(--ink);text-decoration:underline;outline:none}
.btn{font-family:var(--f-label);font-weight:600;font-size:.92rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.small{font-size:.82rem;padding:5px 10px}
.btn[disabled]{opacity:.45;cursor:default}
.linklike{all:unset;cursor:pointer;color:var(--muted);text-decoration:underline;font-size:.88rem}
.linklike:focus-visible{outline:2px solid var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
section{margin-top:34px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px;margin-bottom:12px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sec-head p{color:var(--muted);font-size:.92rem}
.panel{background:var(--surface);border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:16px;min-width:0}
.hero{display:grid;gap:12px}
.hero .big{font-family:var(--f-label);font-weight:700;font-size:1.15rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.step .no{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);min-width:2.2em}
.step .ttl{font-family:var(--f-label);font-weight:600;line-height:1.25}
.step .meta{grid-column:2;font-size:.84rem;color:var(--muted)}
.step .bar{grid-column:2;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.step .bar i{display:block;height:100%;background:var(--st2)}
.step .go{grid-row:1 / span 3;grid-column:3}
.step.done{border-color:var(--st2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;gap:6px;align-items:baseline;padding:3px 8px;border-radius:6px;background:var(--sunk);font-size:.84rem;line-height:1.3;text-decoration:none}
.chip .mono{color:var(--accent)}
.st{display:inline-block;font-family:var(--f-label);font-size:.72rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:4px;color:#fff;background:var(--st0);white-space:nowrap}
.st.s1{background:var(--st1)} .st.s2{background:var(--st2)} .st.s3{background:var(--st3)}
.skills{display:grid;gap:8px}
.skill{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:.92rem;border-bottom:1px dashed var(--line);padding-bottom:6px}
.dots{display:flex;gap:3px}
.dots i{width:12px;height:12px;border-radius:3px;background:var(--st0)}
.dots i.s1{background:var(--st1)} .dots i.s2{background:var(--st2)} .dots i.s3{background:var(--st3)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;gap:5px;align-items:center}
input[type="text"],textarea,.fill input,.step-in input{font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
textarea{width:100%;min-height:140px;font-family:var(--f-mono);font-size:.82rem}
.code{font-family:var(--f-mono);font-size:.8rem;word-break:break-all;background:var(--sunk);padding:8px 10px;border-radius:8px}

/* player */
.player{display:flex;flex-direction:column;gap:14px;margin-top:26px}
.p-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.p-step{font-family:var(--f-label);font-weight:700}
.p-kind{font-family:var(--f-label);font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.prog{display:flex;gap:4px;flex-wrap:wrap}
.prog i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--accent)} .prog i.cur{background:var(--ink)}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--ink);padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:1.3rem}
.p-nav{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.story{border-left:5px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:12px 14px;font-size:1.02rem}
.teaser{border:2px dashed var(--accent);border-radius:12px;padding:12px 14px}
.teaser b{font-family:var(--f-label)}
.body p + p{margin-top:8px}
.body ul,.body ol{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.4}
th{font-family:var(--f-label);font-weight:700;text-align:left;background:var(--sunk);padding:7px 10px}
td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
.example{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;padding:10px 14px}
.example h4,.traps h4{font-family:var(--f-label);font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:0 0 4px;color:var(--accent)}
.traps{background:var(--warn-soft);border-radius:8px;padding:10px 14px}
.traps h4{color:var(--warn)}
.revealed li{animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.revealed li{animation:none}}
figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px}
figure svg{width:100%;max-width:560px;height:auto;color:var(--ink)}
figcaption{font-size:.84rem;color:var(--muted);text-align:center}
.widget{border:1.5px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:#FAFBFD}
.widget .w-title{font-family:var(--f-label);font-weight:700;font-size:.92rem}
.widget label{font-size:.9rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.widget input[type="range"]{flex:1;min-width:140px;accent-color:var(--accent)}
.readout{font-family:var(--f-label);font-weight:600;background:var(--sunk);border-radius:8px;padding:8px 10px}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* items */
.q{display:flex;flex-direction:column;gap:10px;min-width:0}
[data-q] + [data-q]{border-top:1.5px dashed var(--line);padding-top:14px}
.stem{max-width:72ch}
.stem p + p{margin-top:6px}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.opts label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;font-size:.96rem}
.opts input{margin-top:5px;accent-color:var(--accent);flex:none}
.opts .lt{font-family:var(--f-label);font-weight:700;flex:none;min-width:1.1em}
.opts label.right{border-color:var(--ok);background:var(--ok-soft)}
.opts label.wrong{border-color:var(--warn);background:var(--warn-soft)}
.fill{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fill input{width:9em}
.step-in{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.step-in .ans{display:flex;gap:6px;align-items:center}
.step-in input{width:7em}
.right input,input.right{border-color:var(--ok);background:var(--ok-soft)}
.wrong input,input.wrong{border-color:var(--warn);background:var(--warn-soft)}
.conf{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.88rem;color:var(--muted)}
.conf button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.feedback{font-family:var(--f-label);font-weight:600;font-size:.95rem}
.feedback.ok{color:var(--ok)} .feedback.no{color:var(--warn)}
.note{font-size:.9rem;background:var(--sunk);border-radius:8px;padding:8px 12px}
.mis{border:2px solid var(--warn);border-radius:10px;padding:10px 12px;background:var(--warn-soft)}
.mis b{font-family:var(--f-label);display:block;margin-bottom:2px}
.hints{display:flex;flex-direction:column;gap:6px}
.hint{background:#FFF6D8;border-radius:8px;padding:8px 12px;font-size:.94rem}
.hint b,.solution b{font-family:var(--f-label);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;display:block}
.solution{background:var(--ok-soft);border-radius:8px;padding:10px 14px}
.solution ol{margin:4px 0 0;padding-left:1.2em}
.twin{background:#EEF1FA;border-radius:8px;padding:10px 14px}
.mastery{display:flex;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
.mastery i{width:14px;height:14px;border-radius:50%;border:2px solid var(--st2)}
.mastery i.on{background:var(--st2)}
.result-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.result-list li{display:flex;gap:8px;align-items:baseline}
.ok-t{color:var(--ok);font-weight:700} .no-t{color:var(--warn);font-weight:700}

/* teacher view */
.gtable td,.gtable th{text-align:center;white-space:nowrap}
.gtable td:first-child,.gtable th:first-child{text-align:left}
.cell{display:inline-block;min-width:2.6em;padding:2px 6px;border-radius:4px;font-family:var(--f-mono);font-size:.78rem}
.ap{font-family:var(--f-mono);font-size:1.6rem;letter-spacing:.06em}
.ap .y{color:var(--accent);font-weight:700} .ap .n{color:var(--st0)} .ap .q{color:var(--st1);text-decoration:underline dotted}
.bignum{font-family:var(--f-mono);font-size:1.5rem;text-align:center;padding:6px 0}
.bignum .cm{color:var(--warn);font-weight:700}
.cand{display:flex;flex-direction:column;gap:6px}
.cand .btn{justify-content:flex-start;text-align:left}
.cand .btn.yes{border-color:var(--ok);background:var(--ok-soft)}
.cand .btn.no{border-color:var(--warn);background:var(--warn-soft)}
details.notes{margin-top:8px}
details.notes summary{cursor:pointer;font-family:var(--f-label);font-weight:600}
@media (max-width:520px){.step{grid-template-columns:auto 1fr}.step .go{grid-row:auto;grid-column:2;justify-self:start}.card{padding:14px}}
</style>
<div class="wrap">
  <a class="home-link" href="index.html">← Beranda</a>
  <header>
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="lead" id="lead"></p>
  </header>
  <main id="app" aria-live="polite"></main>
</div>
<script>
/*__JALUR__*/
// ---------- data and text helpers ----------
const ITEM = Object.fromEntries(J.soal.map(it => [it.id, it]));
const UNIT = Object.fromEntries(J.unit.map(u => [u.id, u]));
const PRE = Object.fromEntries(J.prasyarat.map(p => [p.id, p]));
const STEPS = ["cek", ...J.unit.map(u => u.id), "akhir"];
const SKILLS = [...new Set([...J.unit.flatMap(u => u.sendiri), ...J.akhir.soal])].sort();
const DAY = new URLSearchParams(location.search).has("uji") ? 60e3 : 864e5;  // ?uji: one "day" lasts a minute, for testing reviews
const ULANG = J.ulang_hari || [1, 3, 7, 21];
const LETTERS = "ABCDEFGH";
const ST_NAME = {belum: "Belum", dibantu: "Dibantu", bisa: "Bisa", kuat: "Kuat"};
const ST_NUM = {belum: 0, dibantu: 1, bisa: 2, kuat: 3};
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const SUPS = "⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻ⁿᵐᵃᵇᶜˣʸ", SUPP = "0123456789+−nmabcxy", SUBS = "₀₁₂₃₄₅₆₇₈₉ₖ", SUBP = "0123456789k";
// The text faces lack Unicode superscript and subscript characters, so runs of them become <sup>/<sub>.
function tx(s){
  return String(s).replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁺⁻ⁿᵐᵃᵇᶜˣʸ]+/g, m => "<sup>" + [...m].map(c => SUPP[SUPS.indexOf(c)]).join("") + "</sup>")
    .replace(/[₀₁₂₃₄₅₆₇₈₉ₖ]+/g, m => "<sub>" + [...m].map(c => SUBP[SUBS.indexOf(c)]).join("") + "</sub>");
}
const paras = s => String(s).split("\n").map(p => "<p>" + tx(p) + "</p>").join("");
const nf = x => String(x).replace("-", "−").replace(".", ",");
function blocks(isi){
  return (isi || []).map(b => {
    if(b.p) return "<p>" + tx(b.p) + "</p>";
    if(b.li) return "<ul>" + b.li.map(x => "<li>" + tx(x) + "</li>").join("") + "</ul>";
    if(b.tabel) return '<div class="tbl"><table><thead><tr>' + b.tabel.cols.map(c => "<th>" + tx(c) + "</th>").join("") + "</tr></thead><tbody>" +
      b.tabel.rows.map(r => "<tr>" + r.map(c => "<td>" + tx(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
    if(b.contoh) return '<div class="example"><h4>Contoh</h4><p>' + tx(b.contoh.soal) + "</p><ol>" + b.contoh.langkah.map(x => "<li>" + tx(x) + "</li>").join("") + "</ol></div>";
    if(b.jebakan) return '<div class="traps"><h4>Awas</h4><ul>' + b.jebakan.map(x => "<li>" + tx(x) + "</li>").join("") + "</ul></div>";
    return "";
  }).join("");
}
function topicChips(codes){
  if(!J.map_page || !(codes || []).length) return "";
  return '<div class="chips">' + codes.map(c => '<a class="chip" href="' + J.map_page + "#t-" + c + '"><span class="mono">' + c + "</span><span>" + esc((J.topics || {})[c] || "") + "</span></a>").join("") + "</div>";
}

// ---------- saved progress ----------
const KEY = "jalur-" + J.id;
function blank(){ return {v: 1, nama: "", cek: {}, unit: {}, fam: {}, mis: {}, akhir: {hasil: {}}, sesi: null}; }
function load(){ try { const s = JSON.parse(localStorage.getItem(KEY)); if(s && s.v === 1) return Object.assign(blank(), s); } catch(e) {} return blank(); }
let S = load();
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
function fam(id){ return S.fam[id] || (S.fam[id] = {n: 0, run: 0, seen: [], st: "belum", box: 0, due: null, yw: 0}); }
function nextVariant(id){
  const f = fam(id), n = ITEM[id].varian.length;
  for(let i = 0; i < n; i++) if(!f.seen.includes(i)) return i;
  return f.seen[0];
}
function markSeen(id, i){ const f = fam(id); f.seen = f.seen.filter(x => x !== i).concat(i); }
function mastered(id){
  const f = fam(id);
  if(f.st !== "kuat") f.st = "bisa";
  if(f.box < 1){ f.box = 1; f.due = Date.now() + ULANG[0] * DAY; }
}
function skipped(id){ const f = fam(id); if(f.st === "belum") f.st = "dibantu"; if(!f.box) f.due = Date.now() + DAY; }
function reviewed(id, ok){
  const f = fam(id);
  if(ok){ f.box = Math.min(f.box + 1, ULANG.length); f.st = f.box >= 3 ? "kuat" : "bisa"; f.due = Date.now() + ULANG[f.box - 1] * DAY; }
  else { f.box = 0; f.st = "dibantu"; f.run = 0; f.due = Date.now() + DAY; }
}
function dueList(){
  const now = Date.now();
  return SKILLS.filter(id => S.fam[id] && S.fam[id].due && S.fam[id].due <= now).sort((a, b) => S.fam[a].due - S.fam[b].due).slice(0, 3);
}
function cekDone(){ return J.prasyarat.every(p => S.cek[p.id] && S.cek[p.id].awal); }
function akhirDone(){ return J.akhir.soal.every(id => id in S.akhir.hasil); }
function stepDone(step){ return step === "cek" ? cekDone() : step === "akhir" ? akhirDone() : !!(S.unit[step] && S.unit[step].selesai); }
function nextStep(){ return STEPS.find(s => !stepDone(s)) || null; }
function stepTitle(step){ return step === "cek" ? "Cek prasyarat" : step === "akhir" ? J.akhir.judul : step === "ulang" ? "Ulangan" : "Unit " + step.slice(1) + " · " + UNIT[step].judul; }
function preDigit(pid){
  const c = S.cek[pid];
  if(!c || !c.awal) return 0;
  if(c.awal.every(Boolean)) return 3;
  return c.ulang ? 2 : 1;
}

// ---------- figures ----------
function svgOpen(w, h, label){ return '<svg viewBox="0 0 ' + w + " " + h + '" role="img" aria-label="' + esc(label) + '" font-family="Lato,system-ui,sans-serif">'; }
const TXT = (x, y, s, size, anchor, extra) => '<text x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" font-size="' + (size || 13) + '" text-anchor="' + (anchor || "middle") + '" fill="currentColor"' + (extra || "") + ">" + s + "</text>";
const LINE = (x1, y1, x2, y2, w, color, extra) => '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="' + (color || "currentColor") + '" stroke-width="' + (w || 1) + '"' + (extra || "") + "/>";

function figMistar(p, opt = {}){
  const a = +p.a, b = +p.b;
  const lo = Math.max(0, Math.floor(a / 10) * 10 - 4), hi = Math.ceil(b / 10) * 10 + 4;
  const W = 520, L = 14, R = 14, s = (W - L - R) / (hi - lo), X = mm => L + (mm - lo) * s;
  let g = svgOpen(W, 150, "Mistar: benda dari " + nf(a / 10) + " cm sampai " + nf(b / 10) + " cm");
  g += '<rect x="' + (lo === 0 ? X(0) - 8 : -2) + '" y="62" width="' + (W + 4) + '" height="66" rx="4" fill="#F6E7B8" stroke="currentColor" stroke-width="1.5"/>';
  for(let m = lo; m <= hi; m++){
    const len = m % 10 === 0 ? 24 : m % 5 === 0 ? 16 : 10;
    g += LINE(X(m), 62, X(m), 62 + len, m % 10 === 0 ? 1.8 : 1.2);
    if(m % 10 === 0) g += TXT(X(m), 110, String(m / 10), 20, "middle", ' font-weight="700"');
  }
  g += TXT(W - 8, 122, "cm", 14, "end");
  g += '<rect x="' + X(a) + '" y="26" width="' + (X(b) - X(a)) + '" height="28" rx="6" fill="var(--accent-soft)" stroke="currentColor" stroke-width="1.8"/>';

function figJangka(p, opt = {}){

  const lo = Math.max(-2, Math.floor(x) - 4), hi = lo + 18;
  const W = 520, L = 10, s = (W - 2 * L) / (hi - lo), X = mm => L + (mm - lo) * s;
  const hiK = opt.highlight ? Math.round((x - Math.floor(x)) * 10) : -1;

  g += TXT(10, 32, "cm", 15, "start");
  for(let m = Math.ceil(lo); m <= hi; m++){
    if(m < 0) continue;

    const hit = hiK >= 0 && m === Math.floor(x + 1e-9) + hiK;
    g += LINE(X(m), 92 - len, X(m), 92, hit ? 3.2 : 1.6, hit ? "var(--warn)" : "currentColor");
    if(m % 10 === 0) g += TXT(X(m), 52, String(m / 10), 24, "middle", ' font-weight="700"');

  g += '<rect x="' + v0 + '" y="92" width="' + (v1 - v0) + '" height="74" fill="#FFFFFF" stroke="currentColor" stroke-width="1.5"/>';
  for(let j = 0; j <= 10; j++){

    g += LINE(X(pos), 92, X(pos), 92 + (big ? 28 : 18), hit ? 3.2 : 1.6, hit ? "var(--warn)" : "currentColor");
    if(big) g += TXT(X(pos), 142, String(j), 19, "middle", ' font-weight="700"');

}

function figMikro(p, opt = {}){
  const s0 = +p.s, t = +p.t, x = s0 + t / 100;
  const start = Math.max(0, 5 * Math.floor((s0 - 3) / 5));
  const x0 = 34, k = 40, X = mm => x0 + (mm - start) * k, edge = X(x), tw = 150;
  const W = Math.max(380, edge + tw + 6), top = 18, bot = 182, gap = 13, ref = 100;
  let g = svgOpen(W, 200, "Skala mikrometer sekrup");
  g += '<rect x="-2" y="72" width="' + (edge + 2) + '" height="56" fill="#E8EDF4" stroke="currentColor" stroke-width="1.5"/>';
  g += LINE(0, ref, edge, ref, 2);

    g += LINE(X(m), ref, X(m), ref - 18, 1.8);
    if(m % 5 === 0) g += TXT(X(m), 62, String(m), 22, "middle", ' font-weight="700"');
  }
  for(let m = start + 0.5; m < x - 0.04; m += 1) g += LINE(X(m), ref, X(m), ref + 16, 1.8);
  g += TXT(4, 24, "mm", 14, "start");
  g += '<rect x="' + edge + '" y="' + top + '" width="' + tw + '" height="' + (bot - top) + '" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.6"/>';
  g += LINE(edge + 1.5, top + 2, edge + 1.5, bot - 2, 4, "#C9D2DE");
  for(let d = t - 6; d <= t + 6; d++){
    const y = ref - (d - t) * gap;
    if(y < top + 6 || y > bot - 6) continue;
    const v = ((d % 50) + 50) % 50, big = v % 5 === 0;
    g += LINE(edge, y, edge + (big ? 30 : 18), y, 1.6);

}

function apMarks(raw){
  const s = raw.trim().replace(/\./g, ",");
  if(!/^\d+(,\d+)?$/.test(s)) return null;
  const chars = [...s], hasComma = s.includes(",");
  let seenNon = false;
  const lastNon = Math.max(...chars.map((c, i) => /[1-9]/.test(c) ? i : -1));
  return chars.map((c, i) => {
    if(c === ",") return {c, k: "n"};
    if(/[1-9]/.test(c)){ seenNon = true; return {c, k: "y"}; }
    if(!seenNon) return {c, k: "n"};
    if(i < lastNon || hasComma) return {c, k: "y"};
    return {c, k: "q"};
  });
}
function apCount(raw){
  const m = apMarks(raw);
  if(!m) return null;
  const y = m.filter(d => d.k === "y").length, q = m.filter(d => d.k === "q").length;
  return {min: Math.max(1, y), max: Math.max(1, y + q)};
}

function parseNum(raw){
  let s = String(raw).trim().replace(/\s+/g, "").replace(/−/g, "-").replace(/[a-zA-Zμ²³°/]+$/, "");
  const fr = s.match(/^(-?\d+(?:[.,]\d+)?)\/(\d+(?:[.,]\d+)?)$/);
  if(fr) return {x: parseFloat(fr[1].replace(",", ".")) / parseFloat(fr[2].replace(",", ".")), txt: null};
  if(!/^-?\d*[.,]?\d+$/.test(s)) return {x: NaN, txt: null};
  return {x: parseFloat(s.replace(",", ".")), txt: s.replace("-", "")};
}
function tol(key, given){
  if(given) return given;
  const ks = String(key), dp = ks.includes(".") ? ks.split(".")[1].length : 0;

}
const near = (x, key, t) => Math.abs(x - key) <= t + 1e-9;
function gradeNum(raw, key, t, salah, cekAp){
  const p = parseNum(raw);

  const ok = near(p.x, key, t);
  let mis = null;
  if(!ok) for(const sl of salah || []) if(near(p.x, sl.nilai, t)){ mis = sl.m; break; }
  if(ok && cekAp){
    const c = p.txt ? apCount(p.txt) : null;
    if(!c || c.max !== cekAp || c.min !== cekAp){
      const exact = (salah || []).find(sl => Math.abs(p.x - sl.nilai) < 1e-9);
      return {ok: false, apWrong: true, mis: exact ? exact.m : null};
    }
  }

}

    if(it.format === "pilihan-ganda-kompleks"){ const c = $$("input:checked", el).map(x => +x.value); return c.length ? c : null; }
    const rows = v.opsi.map((_, i) => { const c = $('input[name="a' + uid + i + '"]:checked', el); return c ? c.value === "true" : null; });
    return rows.some(x => x === null) ? null : rows;
  }
  function grade(ans){
    if(it.format === "isian") return gradeNum(ans, v.kunci, tol(v.kunci, v.toleransi), v.salah, v.cek_ap);
    if(it.format === "bertahap"){
      const steps = v.langkah.map((s, i) => gradeNum(ans[i], s.kunci, tol(s.kunci, s.toleransi), s.salah));
      if(steps.some(g => g.invalid)) return {invalid: true};
      return {ok: steps.every(g => g.ok), steps, mis: (steps.find(g => !g.ok && g.mis) || {}).mis || null};
    }
    if(it.format === "pilihan-ganda") return {ok: ans === v.kunci, mis: ans === v.kunci ? null : (v.salah || {})[String(ans)] || null};
    if(it.format === "pilihan-ganda-kompleks"){
      const ok = JSON.stringify([...ans].sort((a, b) => a - b)) === JSON.stringify(v.kunci);
      const wrong = ans.find(i => !v.kunci.includes(i) && (v.salah || {})[String(i)]);
      return {ok, mis: ok ? null : (wrong !== undefined ? v.salah[String(wrong)] : null)};
    }
    const rows = ans.map((b, i) => b === v.kunci[i]);
    return {ok: rows.every(Boolean), rows, mis: null};
  }
  function mark(g, ans){
    $$(".right,.wrong", el).forEach(x => x.classList.remove("right", "wrong"));
    if(it.format === "isian") $("input", el).classList.add(g.ok ? "right" : "wrong");
    else if(it.format === "bertahap") $$(".step-in", el).forEach((row, i) => row.classList.add(g.steps[i].ok ? "right" : "wrong"));
    else if(it.format === "benar-salah") g.rows.forEach((r, i) => { const td = $('input[name="a' + uid + i + '"]:checked', el); if(td) td.closest("td").classList.add(r ? "right" : "wrong"); });
    else {
      [].concat(ans).forEach(i => $('input[value="' + i + '"]', el).closest("label").classList.add([].concat(v.kunci).includes(i) ? "right" : "wrong"));
      if(once && !g.ok) [].concat(v.kunci).forEach(i => $('input[value="' + i + '"]', el).closest("label").classList.add("right"));
    }
  }
  function lock(){ $$("input", el).forEach(i => i.disabled = true); $$("[data-conf]", el).forEach(b => b.disabled = true); $('[data-act="check"]', el).disabled = true; const h = $('[data-act="hint"]', el); if(h) h.disabled = true; }
  function showSolution(){ $(".solution", el).hidden = false; $('[data-act="sol"]', el).hidden = true; }
  function check(){
    if(st.done) return;
    const ans = answer();
    if(ans === null){ fb.className = "feedback no"; fb.textContent = "Isi jawabanmu dulu."; return; }
    if(conf && !st.conf){ fb.className = "feedback no"; fb.textContent = "Pilih dulu seberapa yakin kamu."; return; }
    const g = grade(ans);
    if(g.invalid){ fb.className = "feedback no"; fb.textContent = "Tulis jawaban berupa angka, misalnya 2,37 atau −1/2."; return; }
    st.tries++;
    const fast = Date.now() - st.t0 < 4000;
    st.t0 = Date.now();
    mark(g, ans);
    extra.innerHTML = "";
    if(g.mis){ S.mis[g.mis] = (S.mis[g.mis] || 0) + 1; const m = J.miskonsepsi[g.mis]; extra.insertAdjacentHTML("beforeend", '<div class="mis"><b>' + tx(m.judul) + "</b>" + tx(m.teks) + "</div>"); }
    if(g.ok){
      st.ok = true; st.done = true; fb.className = "feedback ok"; fb.textContent = "Benar.";
      lock(); showSolution();
    } else {
      fb.className = "feedback no";
      fb.textContent = g.apWrong ? "Nilainya sudah benar, tetapi banyak angka pentingnya belum tepat (harus " + v.cek_ap + ")." : once ? "Belum tepat." : "Belum tepat. Perbaiki jawabanmu, atau minta bantuan.";
      if(st.conf === "yakin") extra.insertAdjacentHTML("afterbegin", '<p class="note">Kamu yakin, tetapi jawabannya belum tepat. Itu tanda ada konsep yang perlu diluruskan.</p>');
      else if(fast && !once) extra.insertAdjacentHTML("afterbegin", '<p class="note">Pelan-pelan: baca soalnya sekali lagi sebelum menjawab.</p>');
      if(once){ st.done = true; lock(); showSolution(); }
      else if(st.tries >= 2) $('[data-act="sol"]', el).hidden = false;
    }
    save();
    if(hooks.onCheck) hooks.onCheck(g, st);
  }
  el.addEventListener("click", e => {
    const b = e.target.closest("button"); if(!b || !el.contains(b)) return;
    if(b.dataset.conf){ st.conf = b.dataset.conf; $$("[data-conf]", el).forEach(x => x.setAttribute("aria-pressed", String(x === b))); return; }
    if(b.dataset.act === "check") check();
    if(b.dataset.act === "sol"){ st.helped = true; showSolution(); if(hooks.onHelp) hooks.onHelp(st); }
    if(b.dataset.act === "hint"){
      const n = it.bantuan.length, box = $(".hints", el);
      if(st.level < n) box.insertAdjacentHTML("beforeend", '<div class="hint"><b>Bantuan ' + (st.level + 1) + "</b>" + tx(it.bantuan[st.level]) + "</div>");
      else if(st.level === n && it.varian.length > 1){
        const w = it.varian[(vi + 1) % it.varian.length];
        box.insertAdjacentHTML("beforeend", '<div class="twin"><b class="small">CONTOH KEMBAR (angka lain)</b>' + figsHTML(it, w) + paras(w.soal.replace(/\nJawaban benar lebih dari satu\.$/, "")) + "<ol>" + w.pembahasan.map(x => "<li>" + tx(x) + "</li>").join("") + "</ol></div>");
        st.helped = true; if(hooks.onHelp) hooks.onHelp(st);
      }
      st.level++;
      b.textContent = ladderLabel(st.level);
      if(st.level > n || (st.level === n && it.varian.length < 2)) b.disabled = true;
    }
  });
  el.addEventListener("keydown", e => { if(e.key === "Enter" && e.target.matches("input[type=text]")) check(); });
  return st;
}

let RUN = null;
function stepCards(step){
  if(step === "cek") return [{t: "cek-intro"}, ...J.prasyarat.map(p => ({t: "cek", pid: p.id})), {t: "cek-hasil"}];
  if(step === "akhir") return [{t: "akhir-intro"}, ...J.akhir.soal.map(id => ({t: "akhir", id})), {t: "akhir-hasil"}];
  if(step === "ulang") return [{t: "ulang-intro"}, ...dueList().map(id => ({t: "ulang", id})), {t: "ulang-selesai"}];
  const u = UNIT[step], cards = [];
  for(const pid of u.butuh || []){
    const c = S.cek[pid];
    if(c && c.awal && !c.awal.every(Boolean) && !c.jembatan) cards.push({t: "jembatan", pid}, {t: "ulang-cek", pid});
  }
  cards.push({t: "kait"}, {t: "media"}, {t: "lihat"}, {t: "bersama"});
  u.sendiri.forEach((id, k) => cards.push({t: "sendiri", id, k, n: u.sendiri.length}));
  cards.push({t: "ringkas"});
  return cards.map(c => Object.assign(c, {u: step}));
}
const cardKey = c => c.t + ":" + (c.id || c.pid || "");
function startSession(){ if(!S.sesi || Date.now() - S.sesi.last > 2 * 3600e3) S.sesi = {mulai: Date.now(), last: Date.now(), kartu: 0, diingatkan: false}; save(); }
function open(step, fresh){
  startSession();
  const cards = stepCards(step);
  let i = 0;
  if(!fresh && S.unit[step] && S.unit[step].at && !S.unit[step].selesai){ const k = cards.findIndex(c => cardKey(c) === S.unit[step].at); if(k > 0) i = k; }
  if(step === "akhir" && !fresh){ const k = cards.findIndex(c => c.t === "akhir" && !(c.id in S.akhir.hasil)); if(k > 1) i = k; }
  RUN = {step, cards, i, ready: false};
  history.replaceState(null, "", location.pathname + location.search);
  render();
}
function continueLearning(){
  const due = dueList();
  if(due.length && !(S.sesi && S.sesi.ulangDone && Date.now() - S.sesi.last < 2 * 3600e3)) return open("ulang", true);
  const s = nextStep();
  if(s) open(s); else renderHome("Semua bagian selesai. Kembali besok untuk ulangan.");
}
function setReady(v = true){ RUN.ready = v; const n = $("#next"); if(n) n.disabled = !v; }
function advance(){
  const card = RUN.cards[RUN.i];

  if(UNIT[RUN.step]) S.unit[RUN.step] = Object.assign(S.unit[RUN.step] || {}, {at: cardKey(RUN.cards[Math.min(RUN.i + 1, RUN.cards.length - 1)])});
  if(card.t !== "sesi" && !S.sesi.diingatkan && Date.now() - S.sesi.mulai >= (J.sesi_menit || 15) * 60e3 && RUN.i + 1 < RUN.cards.length){
    S.sesi.diingatkan = true;
    RUN.cards.splice(RUN.i + 1, 0, {t: "sesi"});
  }
  save();
  RUN.i++;
  render();
}

    '<article class="card" id="card"></article><div class="p-nav"><button class="btn" type="button" id="back"' + (RUN.i === 0 ? " disabled" : "") + '>← Kembali</button>' +

  }).join("") + "</ul>" + (weak.length ? "<p>Ulangi unit: " + weak.map(u => esc(stepTitle(u))).join("; ") + ". Soal yang salah sudah masuk jadwal ulangan besok.</p>" : "<p>Semua benar. Soal-soal ini akan kembali beberapa hari lagi untuk ulangan.</p>");
  setReady();
};

// ---------- home ----------
function stepMeta(step){
  if(step === "cek"){
    const done = J.prasyarat.filter(p => S.cek[p.id] && S.cek[p.id].awal).length;
    return {meta: done === J.prasyarat.length ? J.prasyarat.filter(p => preDigit(p.id) === 3).length + " dari " + J.prasyarat.length + " lulus" : done ? done + " dari " + J.prasyarat.length + " dicek" : J.prasyarat.length * 2 + " soal singkat",
      frac: done / J.prasyarat.length};
  }
  if(step === "akhir"){
    const n = J.akhir.soal.length, d = J.akhir.soal.filter(id => id in S.akhir.hasil).length;
    return {meta: d ? J.akhir.soal.filter(id => S.akhir.hasil[id]).length + " benar dari " + d + " dikerjakan" : n + " soal, " + J.akhir.soal.filter(id => ITEM[id].tka).length + " setara TKA", frac: d / n};
  }
  const u = UNIT[step], m = u.sendiri.filter(id => ST_NUM[fam(id).st] >= 2).length;
  const sel = S.unit[step] && S.unit[step].selesai;
  return {meta: (sel ? "Selesai" : S.unit[step] && S.unit[step].at ? "Sedang dikerjakan" : "Belum mulai") + " · dikuasai " + m + " dari " + u.sendiri.length, frac: sel ? Math.max(0.5, m / u.sendiri.length) : 0};
}
function renderHome(message){
  RUN = null;
  if(location.hash === "#guru") return renderGuru();
  const due = dueList(), nxt = nextStep();
  const label = !nxt ? (due.length ? "Mulai ulangan" : "Semua selesai") : (S.sesi || Object.keys(S.cek).length) ? "Lanjutkan: " + stepTitle(nxt) : "Mulai belajar";
  app.innerHTML = (message ? '<p class="note" style="margin-top:18px">' + esc(message) + "</p>" : "") +
    '<section><div class="panel hero"><p class="big">Sesi hari ini · sekitar ' + (J.sesi_menit || 15) + " menit</p>" +
    "<p>" + (due.length ? "<b>" + due.length + " soal</b> menunggu diulang. Pemanasan dulu, lalu lanjut ke kartu berikutnya." : nxt ? "Belajar dalam kartu pendek: lihat contoh, kerjakan bersama, lalu kerjakan sendiri sampai benar-benar bisa." : "Tidak ada ulangan yang jatuh tempo hari ini.") + "</p>" +
    '<div class="row"><button class="btn primary" type="button" id="go"' + (!nxt && !due.length ? " disabled" : "") + ">" + esc(label) + " →</button></div></div></section>" +
    '<section><div class="sec-head"><h2>Jalur</h2><p>Urutan yang disarankan; semua bagian bisa dibuka.</p></div><ol class="steps">' +
    STEPS.map((s, i) => { const m = stepMeta(s); return '<li class="step' + (stepDone(s) ? " done" : "") + '"><span class="no">' + (s === "cek" ? "P" : s === "akhir" ? "★" : s) + '</span><span class="ttl">' + esc(stepTitle(s)) + '</span><span class="meta">' + esc(m.meta) + '</span><span class="bar"><i style="width:' + Math.round(m.frac * 100) + '%"></i></span><button class="btn small go" type="button" data-step="' + s + '">' + (stepDone(s) ? "Ulangi" : "Buka") + "</button></li>"; }).join("") + "</ol></section>" +
    '<section><div class="sec-head"><h2>Kemampuanmu</h2><p>Setiap kotak satu jenis latihan.</p></div><div class="panel skills">' +
    J.unit.map(u => '<div class="skill"><span>' + esc(u.judul) + '</span><span class="dots">' + u.sendiri.map(id => '<i class="s' + ST_NUM[fam(id).st] + '" title="' + ST_NAME[fam(id).st] + '"></i>').join("") + "</span></div>").join("") +
    '<div class="skill"><span>Setara TKA</span><span class="dots">' + J.akhir.soal.filter(id => ITEM[id].tka).map(id => '<i class="s' + ST_NUM[fam(id).st] + '" title="' + ST_NAME[fam(id).st] + '"></i>').join("") + "</span></div>" +
    '<div class="legend">' + Object.keys(ST_NAME).map(k => '<span><span class="st s' + ST_NUM[k] + '">' + ST_NAME[k] + "</span>" + {belum: "belum dicoba", dibantu: "dicoba, belum dikuasai", bisa: "dua kali benar tanpa bantuan", kuat: "lolos dua ulangan berjarak"}[k] + "</span>").join("") + "</div></div></section>" +
    '<section><div class="sec-head"><h2>Kirim progres ke guru</h2></div><div class="panel stack"><p class="small">Tulis namamu, buat kode, lalu kirim teksnya ke guru (misalnya lewat pesan). Kode hanya berisi status latihan, bukan jawabanmu.</p>' +
    '<div class="row"><input type="text" id="nama" maxlength="40" placeholder="Nama" value="' + esc(S.nama || "") + '" aria-label="Nama"><button class="btn" type="button" id="mkcode">Buat kode</button><button class="btn" type="button" id="copy" hidden>Salin</button></div><p class="code" id="code" hidden></p>' +
    '<p class="small"><a href="#guru" id="guruLink">Tampilan guru</a>: tempel kode dari satu kelas untuk melihat tabel dan miskonsepsi yang paling sering.</p></div></section>' +
    '<section><details class="notes"><summary>Catatan untuk guru</summary><div class="stack" style="margin-top:10px">' + (J.catatan || []).map(n => '<div class="panel"><h3>' + esc(n.judul) + '</h3><ul class="body">' + n.items.map(i => "<li>" + tx(i) + "</li>").join("") + "</ul></div>").join("") +
    "</div></details><p style=\"margin-top:14px\"><button class=\"linklike\" type=\"button\" id=\"reset\">Hapus progres di perangkat ini</button></p></section>";
  $("#go").onclick = continueLearning;
  $$("[data-step]").forEach(b => b.onclick = () => open(b.dataset.step, stepDone(b.dataset.step)));
  $("#mkcode").onclick = () => { S.nama = $("#nama").value.trim(); save(); const code = encode(); $("#code").hidden = false; $("#code").textContent = code; $("#copy").hidden = false; };
  $("#copy").onclick = () => { navigator.clipboard && navigator.clipboard.writeText($("#code").textContent).then(() => { $("#copy").textContent = "Tersalin"; }, () => {}); };
  $("#reset").onclick = () => { if(confirm("Hapus semua progres jalur ini di perangkat ini?")){ S = blank(); save(); renderHome("Progres dihapus."); } };
}

// ---------- teacher code ----------
function checksum(s){ let n = 0; for(const ch of s) n = (n * 31 + ch.codePointAt(0)) % 1296; return n.toString(36).padStart(2, "0"); }
function encode(){
  const nama = (S.nama || "Tanpa nama").replace(/[|\n\r]/g, " ").slice(0, 40).trim();
  const st = SKILLS.map(id => ST_NUM[(S.fam[id] || {}).st || "belum"]).join("");
  const pr = J.prasyarat.map(p => preDigit(p.id)).join("");
  const mis = Object.entries(S.mis).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([m, n]) => m + "x" + n).join(",");
  const yw = SKILLS.reduce((a, id) => a + ((S.fam[id] || {}).yw || 0), 0);
  const body = [J.kode + "1", nama, st, pr, mis || "-", yw].join("|");
  return body + "|" + checksum(body);
}
function decode(line){
  const parts = line.trim().split("|");
  if(parts.length !== 7 || parts[0] !== J.kode + "1") return null;
  if(checksum(parts.slice(0, 6).join("|")) !== parts[6]) return {bad: true, nama: parts[1]};
  const st = {}; SKILLS.forEach((id, i) => st[id] = +(parts[2][i] || 0));
  const mis = parts[4] === "-" ? [] : parts[4].split(",").map(x => { const [m, n] = x.split("x"); return [m, +n]; });
  return {nama: parts[1], st, pr: [...parts[3]].map(Number), mis, yw: +parts[5]};
}
function renderGuru(){
  app.innerHTML = '<section><div class="sec-head"><h2>Tampilan guru</h2><p><a href="#" id="back">Kembali ke jalur</a></p></div><div class="panel stack">' +
    '<p class="small">Tempel kode progres siswa, satu baris per siswa. Semua diolah di peramban ini; tidak ada yang dikirim ke mana pun.</p>' +
    '<textarea id="codes" aria-label="Kode progres" placeholder="' + J.kode + '1|Nama|..."></textarea><div class="row"><button class="btn primary" type="button" id="show">Tampilkan</button></div><div id="out" class="stack"></div></div></section>';
  $("#back").onclick = e => { e.preventDefault(); history.replaceState(null, "", location.pathname + location.search); renderHome(); };
  $("#show").onclick = () => {
    const rows = $("#codes").value.split(/\n+/).filter(l => l.trim()).map(decode);
    const good = rows.filter(r => r && !r.bad), bad = rows.filter(r => !r || r.bad);
    if(!good.length){ $("#out").innerHTML = '<p class="note">Tidak ada kode yang terbaca.</p>'; return; }
    const cell = (k, n) => { const f = n ? k / n : 0; return '<span class="cell" style="background:' + (f >= 1 ? "var(--ok-soft)" : f > 0 ? "#FFF0D6" : "var(--sunk)") + '">' + k + "/" + n + "</span>"; };
    const tka = J.akhir.soal.filter(id => ITEM[id].tka);
    const head = "<tr><th>Nama</th><th>Prasyarat</th>" + J.unit.map(u => '<th title="' + esc(u.judul) + '">' + u.id + "</th>").join("") + "<th>TKA</th><th>Yakin salah</th></tr>";
    const body = good.map(r => "<tr><td>" + esc(r.nama) + '</td><td class="mono">' + r.pr.map(d => ["·", "✗", "✓*", "✓"][d]).join(" ") + "</td>" +
      J.unit.map(u => "<td>" + cell(u.sendiri.filter(id => r.st[id] >= 2).length, u.sendiri.length) + "</td>").join("") +
      "<td>" + cell(tka.filter(id => r.st[id] >= 2).length, tka.length) + "</td><td>" + r.yw + "</td></tr>").join("");
    const tot = {};
    good.forEach(r => r.mis.forEach(([m, n]) => { tot[m] = tot[m] || {n: 0, s: 0}; tot[m].n += n; tot[m].s++; }));
    const misList = Object.entries(tot).sort((a, b) => b[1].s - a[1].s || b[1].n - a[1].n).slice(0, 8);
    const preFail = J.prasyarat.map((p, i) => [p.judul, good.filter(r => r.pr[i] === 1).length]).filter(x => x[1]);
    $("#out").innerHTML = "<h3>" + good.length + " siswa" + (bad.length ? ' <span class="small muted">(' + bad.length + " baris tidak terbaca)</span>" : "") + "</h3>" +
      '<div class="tbl"><table class="gtable"><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>" +
      '<p class="small muted">Sel = jenis latihan yang dikuasai (Bisa atau Kuat) dari jumlahnya. Prasyarat: ✓ lulus, ✓* lulus setelah jembatan, ✗ belum lulus, · belum dicek.</p>' +
      (preFail.length ? "<h3>Prasyarat yang belum lulus</h3><ul class=\"body\">" + preFail.map(([j, n]) => "<li>" + esc(j) + ": " + n + " siswa</li>").join("") + "</ul>" : "") +
      "<h3>Miskonsepsi yang paling sering</h3>" + (misList.length ? '<ol class="body">' + misList.map(([m, v]) => "<li><b>" + tx(J.miskonsepsi[m] ? J.miskonsepsi[m].judul : m) + "</b>: " + v.s + " siswa, " + v.n + " kali. " + tx(J.miskonsepsi[m] ? J.miskonsepsi[m].teks : "") + "</li>").join("") + "</ol>" : "<p>Belum ada.</p>");
  };
}
