<style>
/* Layout: generic subject map, same catalogue look as the history map. Domain progress → path strip → map overview → catalogue cards per domain. Content comes from data/maps/<subject>.json. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunk:#E9EBF1; --ink:#1A1F33; --muted:#585E73; --line:#D6DAE3;
  --d1:#2B3A78; --d2:#8A5526; --d3:#2C6B63; --d4:#6E3466; --d5:#5A6420; --d6:#9A3B1F; --d7:#3D5A80;
  --s1:#E4E8F6; --s2:#F3E9DF; --s3:#DFEFEC; --s4:#F1E3EE; --s5:#ECEEDC; --s6:#F8E6DF; --s7:#E2E9F2;
  --mark:#F6DE8D; --warn:#9A3B1F; --warn-soft:#F8E6DF; --ok:#2C6B3F;
  --f-label:"Archivo Narrow","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}

  --bg:#11131A; --surface:#191C26; --sunk:#222634; --ink:#E7E9F0; --muted:#A3A9BC; --line:#2E3345;
  --d1:#A3B1F2; --d2:#E0A974; --d3:#76C7B9; --d4:#D9A0CF; --d5:#C3CC7E; --d6:#F0A58A; --d7:#9DBBE0;
  --s1:#232A47; --s2:#33271C; --s3:#1C3330; --s4:#33202F; --s5:#2A2D1A; --s6:#3A221B; --s7:#1F2A3A;
  --mark:#6D5A1C; --warn:#F0A58A; --warn-soft:#3A221B; --ok:#8FD3A2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131A; --surface:#191C26; --sunk:#222634; --ink:#E7E9F0; --muted:#A3A9BC; --line:#2E3345;
  --d1:#A3B1F2; --d2:#E0A974; --d3:#76C7B9; --d4:#D9A0CF; --d5:#C3CC7E; --d6:#F0A58A; --d7:#9DBBE0;
  --s1:#232A47; --s2:#33271C; --s3:#1C3330; --s4:#33202F; --s5:#2A2D1A; --s6:#3A221B; --s7:#1F2A3A;
  --mark:#6D5A1C; --warn:#F0A58A; --warn-soft:#3A221B; --ok:#8FD3A2; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-label);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.65rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
a{color:inherit}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
sub,sup{line-height:0}
.eyebrow{font-family:var(--f-label);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.82em}
.lead{max-width:66ch;color:var(--muted);font-size:1.05rem;margin-top:12px}
section{margin-top:44px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:16px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.sec-head p{color:var(--muted);font-size:.95rem;max-width:62ch}

.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px;margin-top:22px}
.pg{display:flex;flex-direction:column;gap:5px;text-decoration:none;min-width:0}
.pg b{font-family:var(--f-label);font-size:.92rem;color:var(--c)}
.pg .bar{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden;position:relative}
.pg .bar i{position:absolute;inset:0 auto 0 0;background:var(--c);width:0;transition:width .3s}
.pg .bar::after{content:"";position:absolute;inset:0;border:1.5px solid var(--c);border-radius:2px}
.pg span{font-size:.78rem;color:var(--muted);font-family:var(--f-label)}
.pg:focus-visible{outline:2px solid var(--c);outline-offset:3px}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:0 12px}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:10px 0;outline:none}
.btn{font-family:var(--f-label);font-weight:600;font-size:.92rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#hits{font-size:.9rem;color:var(--muted);font-family:var(--f-label)}
.overall{font-family:var(--f-label);font-size:.95rem;color:var(--muted);margin-top:10px}
.overall b{color:var(--ink);font-variant-numeric:tabular-nums}

.path-wrap{overflow-x:auto;padding-bottom:6px}
.path{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(130px,1fr);min-width:max-content}
.path li{border-top:2px solid var(--ink);padding:0 10px 0 0;position:relative}
.path li::before{content:"";position:absolute;left:0;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.path button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding-top:14px;max-width:16em}
.path button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.path .lb{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.path .nm{font-family:var(--f-label);font-weight:700;font-size:1rem;line-height:1.15}
.path .an{font-size:.8rem;color:var(--muted);line-height:1.35}

.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.mcol{border-top:4px solid var(--c);background:var(--surface);border-radius:0 0 8px 8px;padding:14px;min-width:0}
.mcol h3{color:var(--c);display:flex;justify-content:space-between;gap:8px}
.mcol ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.chip{display:flex;gap:10px;align-items:baseline;text-decoration:none;padding:6px 8px;border-radius:5px;background:var(--soft);font-size:.93rem;line-height:1.35}
.chip:hover{outline:1.5px solid var(--c)}
.chip:focus-visible{outline:2px solid var(--c)}
.chip .mono{color:var(--c);flex:none}
.chip.done{text-decoration:line-through;text-decoration-color:var(--muted);opacity:.72}
.tier{display:inline-block;font-family:var(--f-label);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.t1{background:var(--ink);color:var(--bg)}
.t2{border:1.3px solid var(--ink)}
.t3{border:1.3px dashed var(--muted);color:var(--muted)}
.lj{border:1.3px dotted var(--ink);font-style:italic}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip.off{opacity:.35}
#lanjutNote{font-size:.88rem;color:var(--muted);margin-top:8px;max-width:75ch}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:.88rem;color:var(--muted);align-items:center}

.domain-head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;border-bottom:2px solid var(--c);padding-bottom:8px;margin-bottom:14px}
.domain-head h2{color:var(--c)}
.domain-head .w{font-family:var(--f-mono);font-size:1rem;color:var(--c)}
.domain-head p{color:var(--muted);font-size:.92rem;flex-basis:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0;scroll-margin-top:16px}
.card + .card{margin-top:10px}
.card-head{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.toggle{all:unset;cursor:pointer;flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.toggle:focus-visible{outline:2px solid var(--c);outline-offset:4px;border-radius:4px}
.toggle .code{font-family:var(--f-mono);font-size:.8rem;color:var(--c);padding-top:4px;grid-row:span 3}
.toggle .ttl{font-family:var(--f-label);font-size:1.22rem;font-weight:700;line-height:1.2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.toggle .meta{font-size:.82rem;color:var(--muted);font-family:var(--f-label);display:flex;flex-wrap:wrap;gap:4px 12px}
.toggle .sum{font-size:.95rem;color:var(--muted);max-width:75ch}
.caret{font-family:var(--f-mono);color:var(--muted);transition:transform .2s;display:inline-block}
.card.open .caret{transform:rotate(90deg)}
.done-box{flex:none;display:flex;align-items:center;gap:6px;font-family:var(--f-label);font-size:.85rem;color:var(--muted);cursor:pointer;padding-top:3px;user-select:none}
.done-box input{width:18px;height:18px;accent-color:var(--ok);cursor:pointer}
.card.is-done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.body{padding:2px 16px 18px 16px;border-top:1px dashed var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px 26px}
.blk{min-width:0}
.blk.wide{grid-column:1/-1}
.blk h4{font-family:var(--f-label);font-size:.82rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin:14px 0 6px}
.blk ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}
.blk li{font-size:.95rem;line-height:1.55}
.blk li::marker{color:var(--c)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.4}
th{font-family:var(--f-label);font-weight:700;text-align:left;background:var(--soft);color:var(--ink);padding:7px 10px;white-space:nowrap}
td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
.traps{grid-column:1/-1;background:var(--warn-soft);border-radius:6px;padding:12px 14px}
.traps h4{color:var(--warn);margin-top:0}
.traps li::marker{color:var(--warn)}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.note ul{margin:8px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
footer{margin-top:40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:14px}

@media (max-width:480px){
  .wrap{padding-inline:16px}
  .toggle{grid-template-columns:1fr}
  .toggle .code{grid-row:auto;padding-top:0}
  .card-head{flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.home-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:600;font-size:.9rem;color:var(--muted);text-decoration:none;margin-bottom:14px}
.home-link:hover,.home-link:focus-visible{color:var(--ink);text-decoration:underline;outline:none}
</style>

mah"], ["indit", "angkat", "mios", "pergi"], ["saré", "kulem", "mondok", "tidur"], ["datang", "sumping", "dongkap", "datang"], ["nanya", "naros", "tumaros", "bertanya"]]}}], "traps": ["Kecap hormat keur ka batur (tuang, bumi, angkat) tidak dipakai untuk diri sendiri; untuk diri sendiri dipakai neda, rorompok, mios."]}, {"code": "BSN-02", "title": "Aksara Sunda", "scope": "Swara, ngalagena, rarangkén", "src": "Kelas X", "tier": 1, "sum": "Aksara Sunda Baku terdiri atas aksara swara (vokal), aksara ngalagena (konsonan), rarangkén (penanda bunyi), dan angka.", "blocks": [{"h": "Jenis aksara", "li": ["<b>Aksara swara<\/b> ada 7: a, é, i, o, u, e, eu; berdiri sendiri sebagai suku kata.", "Aksara ngalagena dasar ada 18: ka, ga, nga, ca, ja, nya, ta, da, na, pa, ba, ma, ya, ra, la, wa, sa, ha; ditambah beberapa aksara untuk bunyi serapan.", "Setiap aksara ngalagena berbunyi dasar /a/; bunyinya diubah dengan rarangkén.", "Aksara Sunda Baku dibakukan Pemerintah Provinsi Jawa Barat pada 1990-an dan dilestarikan lewat Perda No. 5 Tahun 2003."]}, {"h": "Rarangkén (13)", "table": {"cols": ["Letak", "Rarangkén", "Fungsi"], "rows": [["Di atas", "panghulu, pamepet, paneuleung, panyecek, panglayar", "i, e, eu, tambah -ng, tambah -r"], ["Di bawah", "panyuku, panyakra, panyiku", "u, sisipan -ra-, sisipan -la-"], ["Sejajar", "paneleng, panolong, pamingkal, pangwisad, pamaéh", "é, o, sisipan -ya-, tambah -h, menghilangkan vokal"]]}}], "traps": ["Panyecek menambah -ng dan pangwisad menambah -h; keduanya sering tertukar.", "Pamaéh mematikan vokal aksara ngalagena, misalnya untuk konsonan di akhir kata."]}, {"code": "BSN-03", "title": "Kecap rundayan dan kalimah", "scope": "Rarangkén kecap, jenis kalimah", "src": "Kelas X–XI", "tier": 2, "sum": "Kata berimbuhan (kecap rundayan) dibentuk dengan rarangkén di depan, tengah, belakang, atau gabungan; kalimat dibedakan menurut fungsi dan susunannya.", "blocks": [{"h": "Rarangkén kecap", "table": {"cols": ["Letak", "Contoh rarangkén", "Contoh kecap"], "rows": [["Hareup (depan)", "ba-, di-, ka-, pa-, sa-, ti-, barang-", "dibaca, sapoé, tigubrag"], ["Tengah (sisipan)", "-ar-, -al-, -um-, -in-", "barudak (jamak), tumiba"], ["Tukang (belakang)", "-an, -eun, -keun, -na", "bacaeun, bawakeun"], ["Barung (gabungan)", "ka-an, pa-an, pang-keun", "kasenian, pangbawakeun"]]}}, {"h": "Kalimah", "li": ["<b>Rarangkén -ar-<\/b> menandai jamak: budak menjadi barudak, murid menjadi marurid.", "Kalimah menurut fungsi: wawaran (berita), pananya (tanya), paréntah (perintah).", "Kalimah basajan (sederhana) dan kalimah majemuk (lebih dari satu klausa)."]}]}, {"code": "BSN-04", "title": "Babasan jeung paribasa", "scope": "Ungkapan dan peribahasa Sunda", "src": "Semua kelas", "tier": 1, "sum": "Babasan adalah ungkapan pendek bermakna kiasan; paribasa adalah kalimat utuh berisi nasihat, perbandingan, atau gambaran watak.", "blocks": [{"h": "Babasan", "table": {"cols": ["Babasan", "Arti"], "rows": [["gedé hulu", "sombong"], ["panjang leungeun", "suka mencuri"], ["hampang birit", "rajin, mudah disuruh"], ["leutik burih", "penakut"]]}}, {"h": "Paribasa", "table": {"cols": ["Paribasa", "Arti"], "rows": [["Cikaracak ninggang batu, laun-laun jadi legok", "Usaha yang terus-menerus akhirnya berhasil"], ["Adat kakurung ku iga", "Kebiasaan buruk sulit diubah"], ["Bengkung ngariung bongkok ngaronyok", "Bersatu dalam suka dan duka"], ["Kawas cai dina daun taleus", "Tidak tetap pendirian"]]}}, {"h": "Bedanya", "li": ["<b>Babasan<\/b> berupa frasa (kecap kantétan); paribasa berupa kalimat."]}], "traps": ["Babasan berbentuk frasa pendek; paribasa berbentuk kalimat utuh."]}]}, {"id": "SAS", "name": "Sastra", "short": "Sastra", "note": "Puisi terikat dan bebas, prosa, sastra lisan, serta drama Sunda.", "topics": [{"code": "SAS-01", "title": "Pupuh", "scope": "17 pupuh, guru wilangan, guru lagu", "src": "Kelas X–XII", "tier": 1, "sum": "Pupuh adalah bentuk puisi terikat (dangding) dengan aturan jumlah suku kata, bunyi akhir, dan watak; ada 17 pupuh.", "blocks": [{"h": "Aturan", "li": ["<b>Guru wilangan<\/b>: jumlah engang (suku kata) dalam satu padalisan (baris).", "Guru lagu: bunyi vokal di akhir padalisan.", "Watek: suasana atau isi yang cocok untuk tiap pupuh.", "Sekar ageung (empat pupuh besar): Kinanti, Sinom, Asmarandana, Dangdanggula (sering disingkat KSAD)."]}, {"h": "Contoh pupuh", "table": {"cols": ["Pupuh", "Guru wilangan dan guru lagu", "Watek"], "rows": [["Kinanti", "8-u, 8-i, 8-a, 8-i, 8-a, 8-i", "Menunggu, prihatin"], ["Sinom", "8-a, 8-i, 8-a, 8-i, 7-i, 8-u, 7-a, 8-i, 12-a", "Gembira"], ["Asmarandana", "8-i, 8-a, 8-é/o, 8-a, 7-a, 8-u, 8-a", "Kasih sayang, birahi"], ["Dangdanggula", "10-i, 10-a, 8-é/o, 7-u, 9-i, 7-a, 6-u, 8-a, 12-i, 7-a", "Agung, tenteram, bahagia"], ["Pucung", "12-u, 6-a, 8-é/o, 12-a", "Nasihat, teka-teki"], ["Durma", "Tujuh padalisan", "Marah, bersemangat"], ["Maskumambang", "Empat padalisan", "Sedih, nelangsa"]]}}], "traps": ["Guru wilangan menghitung suku kata; guru lagu menunjuk vokal akhir. Jangan tertukar.", "Kinanti berwatak menunggu atau prihatin, sedangkan Sinom berwatak gembira."]}, {"code": "SAS-02", "title": "Wawacan jeung guguritan", "scope": "Cerita dan puisi berpupuh", "src": "Kelas XI", "tier": 2, "sum": "Wawacan adalah cerita panjang yang ditulis dalam rangkaian pupuh; guguritan adalah puisi pendek berpupuh tentang satu tema.", "blocks": [{"h": "Ciri", "li": ["<b>Wawacan<\/b>: cerita panjang berbentuk dangding; pupuhnya berganti mengikuti suasana cerita.", "Wawacan dibacakan atau dilagukan dalam tradisi beluk dan mamaos.", "Guguritan: puisi berpupuh yang pendek, biasanya satu atau beberapa pupuh, tentang pengalaman atau perasaan.", "Unsur wawacan sama dengan cerita: tokoh, latar, alur, tema, amanat."]}], "traps": ["Wawacan bercerita panjang; guguritan berupa puisi pendek. Keduanya sama-sama memakai pupuh."]}, {"code": "SAS-03", "title": "Sisindiran jeung sajak", "scope": "Rarakitan, paparikan, wawangsalan, sajak", "src": "Kelas X–XI", "tier": 1, "sum": "Sisindiran adalah puisi lama bersampiran (cangkang) dan isi (eusi); sajak adalah puisi bebas tanpa aturan pupuh.", "blocks": [{"h": "Sisindiran", "table": {"cols": ["Jenis", "Ciri"], "rows": [["Rarakitan", "Kata awal cangkang diulang pada awal eusi"], ["Paparikan", "Bunyi cangkang mirip bunyi eusi (seperti pantun)"], ["Wawangsalan", "Berisi tebakan kata; maksud disembunyikan dalam cangkang"]]}}, {"h": "Sajak", "li": ["<b>Sajak<\/b>: puisi bebas modern; tidak terikat jumlah suku kata dan bunyi akhir.", "Sisindiran berisi silih asih (cinta), piwuruk (nasihat), atau sésébréd (lelucon).", "Puisi buhun (lama) lain: mantra (jangjawokan, asihan) dan pupujian (puji-pujian di masjid)."]}], "traps": ["Pada rarakitan, kata di awal cangkang diulang di awal eusi; pada paparikan yang mirip adalah bunyinya saja."]}, {"code": "SAS-04", "title": "Carpon jeung novel", "scope": "Unsur intrinsik, karya penting", "src": "Kelas XI–XII", "tier": 1, "sum": "Carpon (carita pondok) dan novel adalah prosa modern Sunda yang dianalisis melalui unsur intrinsik dan ekstrinsiknya.", "blocks": [{"h": "Unsur intrinsik", "li": ["Téma, palaku (tokoh) dan watek, galur (alur), latar, sudut pandang, amanat.", "<b>Carpon<\/b> pendek dengan satu peristiwa utama; novel lebih panjang dengan banyak peristiwa dan tokoh."]}, {"h": "Karya penting", "li": ["Baruang ka nu Ngarora karya D.K. Ardiwinata (1914) disebut novel Sunda pertama.", "Rusiah nu Goréng Patut karya Joehana (1928)."]}], "traps": ["Baruang ka nu Ngarora (1914) adalah novel, bukan carpon."]}, {"code": "SAS-05", "title": "Dongéng", "scope": "Fabel, sasakala, mite, legenda", "src": "Kelas X", "tier": 1, "sum": "Dongéng adalah cerita rekaan tradisional yang dibedakan menurut tokoh dan isinya.", "blocks": [{"h": "Jenis dongéng", "table": {"cols": ["Jenis", "Isi", "Contoh"], "rows": [["Fabel", "Tokohnya binatang", "Sakadang Kuya jeung Sakadang Monyét"], ["Sasakala", "Asal-usul tempat atau benda", "Sasakala Gunung Tangkuban Parahu"], ["Mite", "Dewa atau makhluk gaib yang dipercaya", "Nyi Pohaci Sanghyang Sri"], ["Legenda", "Tokoh yang dianggap pernah ada", "Cerita tokoh kerajaan"], ["Parabel", "Berisi pelajaran moral", "Cerita piwuruk"], ["Pikaseurieun", "Lucu", "Si Kabayan"]]}}], "traps": ["Sasakala menjelaskan asal-usul (Tangkuban Parahu); mite tentang dewa atau makhluk gaib (Nyi Pohaci)."]}, {"code": "SAS-06", "title": "Carita pantun", "scope": "Juru pantun, kacapi, rajah", "src": "Kelas XI", "tier": 2, "sum": "Carita pantun adalah cerita lisan panjang tentang raja dan ksatria Sunda yang dibawakan juru pantun dengan iringan kacapi.", "blocks": [{"h": "Ciri", "li": ["<b>Juru pantun<\/b> membawakan cerita semalam suntuk diiringi kacapi.", "Bagian: rajah (pembuka berupa doa), cerita, dan rajah pamungkas (penutup).", "Contoh: Lutung Kasarung, Mundinglaya di Kusumah.", "Carita pantun Sunda berbeda dengan pantun Melayu yang berupa puisi empat baris."]}], "traps": ["Pantun dalam sastra Sunda adalah cerita lisan berirama dengan iringan kacapi, bukan puisi empat baris seperti pantun Melayu."]}, {"code": "SAS-07", "title": "Kawih, kakawihan, jeung tembang", "scope": "Lagu Sunda dan iramanya", "src": "Kelas X–XII", "tier": 2, "sum": "Lagu Sunda dibedakan menjadi tembang yang berirama bebas dan kawih yang berirama tetap; kakawihan adalah lagu permainan anak.", "blocks": [{"h": "Jenis", "li": ["<b>Tembang<\/b> (misalnya tembang Cianjuran) memakai pupuh dan irama bebas (sekar irama merdika).", "Kawih memakai irama tetap (sekar tandak); rumpaka (lirik) kawih tidak terikat pupuh.", "Kakawihan: lagu anak untuk mengiringi kaulinan (permainan), misalnya oray-orayan.", "Rumpaka adalah teks atau lirik lagu Sunda."]}]}, {"code": "SAS-08", "title": "Drama Sunda", "scope": "Unsur drama, gending karesmén", "src": "Kelas XII", "tier": 2, "sum": "Drama Sunda dipentaskan dengan dialog dan petunjuk laku; bentuk khasnya gending karesmén yang dialognya dinyanyikan.", "blocks": [{"h": "Unsur", "li": ["Babak dan adegan, paguneman (dialog), palaku, dan <b>kramagung<\/b> (petunjuk laku untuk pemain).", "Gending karesmén: drama musikal Sunda yang dialognya dinyanyikan dengan iringan gamelan.", "Longsér: teater rakyat Sunda yang memadukan tari, lawak, dan cerita."]}], "traps": ["Kramagung adalah petunjuk laku dalam naskah, bukan dialog."]}]}, {"id": "TKS", "name": "Téks nonsastra", "short": "Téks", "note": "Teks berita, pidato, diskusi, artikel, surat, dan iklan dalam bahasa Sunda.", "topics": [{"code": "TKS-01", "title": "Warta", "scope": "Unsur 5W+1H, struktur berita", "src": "Kelas X", "tier": 1, "sum": "Warta (berita) menyampaikan peristiwa aktual secara faktual dengan unsur naon, saha, iraha, di mana, naha, dan kumaha.", "blocks": [{"h": "Unsur dan struktur", "li": ["<b>Unsur warta<\/b>: naon (apa), saha (siapa), iraha (kapan), di mana (di mana), naha (mengapa), kumaha (bagaimana).", "Struktur: judul, lulugu (teras berita), eusi (tubuh berita), panutup.", "Basa warta lugas, jelas, dan tidak memuat pendapat pribadi penulis.", "Pamaca warta (penyiar) memperhatikan lafal, intonasi, dan kejelasan."]}], "traps": ["Lulugu (teras berita) memuat inti peristiwa dan ditaruh di paragraf pertama."]}, {"code": "TKS-02", "title": "Biantara jeung pangjejer acara", "scope": "Struktur pidato, MC", "src": "Kelas X–XI", "tier": 1, "sum": "Biantara (pidato) dan pangjejer acara (pembawa acara) memakai bahasa hormat yang tertata.", "blocks": [{"h": "Biantara", "li": ["<b>Struktur biantara<\/b>: bubuka (salam, puji syukur, penghormatan), eusi (isi), panutup (kesimpulan, permohonan maaf, salam).", "Metode: impromtu (spontan), maca naskah, ngapalkeun (hafalan), ekstemporan (berdasarkan catatan pokok).", "Panata acara atau pangjejer acara (MC) memandu urutan acara sesuai susunan acara."]}], "traps": ["Metode ekstemporan memakai catatan pokok, bukan membaca naskah lengkap."]}, {"code": "TKS-03", "title": "Sawala jeung artikel", "scope": "Diskusi, peran, artikel", "src": "Kelas XI", "tier": 1, "sum": "Sawala adalah diskusi untuk memecahkan masalah bersama; artikel adalah tulisan berisi pendapat penulis tentang suatu masalah.", "blocks": [{"h": "Peran dalam sawala", "table": {"cols": ["Peran", "Tugas"], "rows": [["Pupuhu", "Memimpin jalannya sawala"], ["Panyatur", "Menyampaikan makalah atau pendapat utama"], ["Notulén", "Mencatat jalannya sawala"], ["Pamilon", "Peserta yang bertanya dan menanggapi"]]}}, {"h": "Artikel", "li": ["<b>Artikel<\/b> berisi pendapat penulis yang didukung fakta, berbeda dengan warta yang hanya melaporkan fakta.", "Struktur artikel: judul, bubuka, eusi, panutup."]}], "traps": ["Pupuhu memimpin sawala; panyatur menyampaikan pendapat utama."]}, {"code": "TKS-04", "title": "Surat jeung iklan", "scope": "Surat resmi, surat pribadi, iklan", "src": "Kelas XII", "tier": 2, "sum": "Surat dan iklan berbahasa Sunda dibedakan menurut tujuan dan ragam bahasanya.", "blocks": [{"h": "Surat", "li": ["Surat resmi (dinas) memakai bahasa hormat yang baku: kop, nomor, titimangsa (tanggal), alamat, salam, eusi, panutup, tanda tangan.", "Surat pribadi memakai bahasa yang sesuai hubungan dengan penerima, bisa loma atau hormat."]}, {"h": "Iklan", "li": ["<b>Iklan<\/b> (wawaran) bertujuan memberi tahu atau membujuk; bahasanya singkat, menarik, dan jelas.", "Iklan layanan masyarakat mengajak berbuat baik; iklan niaga menawarkan barang atau jasa."]}]}]}, {"id": "BUD", "name": "Budaya Sunda", "short": "Budaya", "note": "Kasenian, adat dan kampung adat, permainan anak dan falsafah hidup, serta sejarah kerajaan Sunda.", "topics": [{"code": "BUD-01", "title": "Kasenian Sunda", "scope": "Angklung, wayang golek, jaipongan", "src": "Kelas X–XII", "tier": 2, "sum": "Kesenian khas Sunda meliputi musik bambu, gamelan, wayang, dan tari.", "blocks": [{"h": "Kasenian", "table": {"cols": ["Kasenian", "Keterangan"], "rows": [["Angklung", "Alat musik bambu yang digoyang; diakui UNESCO sebagai Warisan Budaya Takbenda pada 2010"], ["Calung", "Alat musik bambu yang dipukul"], ["Wayang golek", "Wayang boneka kayu dengan dalang"], ["Degung", "Ansambel gamelan Sunda"], ["Kacapi suling", "Musik petikan kacapi dan tiupan suling"], ["Jaipongan", "Tari kreasi yang dikembangkan Gugum Gumbira pada 1970-an"]]}}]}, {"code": "BUD-02", "title": "Upacara adat jeung kampung adat", "scope": "Seren taun, Kampung Naga, Baduy", "src": "Kelas XI–XII", "tier": 2, "sum": "Upacara adat dan kampung adat Sunda menyimpan kearifan lokal tentang alam dan kehidupan bersama.", "blocks": [{"h": "Upacara dan kampung adat", "li": ["<b>Seren taun<\/b>: upacara syukur atas hasil panen padi, misalnya di Cigugur (Kuningan) dan Kasepuhan Ciptagelar.", "Kampung Naga (Tasikmalaya) mempertahankan rumah panggung dan aturan adat.", "Urang Kanekes (Baduy) di Lebak, Banten, memegang pikukuh (aturan adat) yang ketat; dibagi Baduy Dalam dan Baduy Luar.", "Upacara daur hidup: tingkeban (tujuh bulan kehamilan), ngaruwat, dan upacara pernikahan seperti sawér."]}]}, {"code": "BUD-03", "title": "Kaulinan barudak jeung falsafah Sunda", "scope": "Permainan anak, silih asah asih asuh", "src": "Kelas X", "tier": 3, "sum": "Permainan tradisional anak Sunda dan falsafah hidup yang menjadi pegangan masyarakatnya.", "blocks": [{"h": "Kaulinan barudak", "li": ["Contoh: sondah (engklek), oray-orayan, ucing sumput (petak umpet), perepet jengkol, galah asin.", "Kaulinan melatih kerja sama, ketangkasan, dan sportivitas."]}, {"h": "Falsafah", "li": ["<b>Silih asah, silih asih, silih asuh<\/b>: saling mengasah (mencerdaskan), saling mengasihi, saling membimbing.", "Cageur, bageur, bener, pinter: sehat, baik, benar, pintar sebagai cita-cita manusia Sunda."]}]}, {"code": "BUD-04", "title": "Kerajaan Sunda", "scope": "Tarumanagara, Pajajaran, Bubat", "src": "Kelas XI", "tier": 3, "sum": "Ringkasan sejarah kerajaan di tanah Sunda yang sering menjadi latar cerita dan budaya Sunda.", "blocks": [{"h": "Peristiwa", "li": ["Tarumanagara (abad ke-5) dengan raja Purnawarman; Prasasti Ciaruteun di Bogor.", "Kerajaan Sunda (Pajajaran) beribu kota di Pakuan, sekitar Bogor sekarang.", "<b>Prasasti Batutulis<\/b> (1533) dibuat Prabu Surawisesa untuk mengenang ayahnya, Sri Baduga Maharaja, yang dalam tradisi dikenal sebagai Prabu Siliwangi.", "Peristiwa Bubat (1357) melibatkan rombongan Sunda dan Dyah Pitaloka dengan Majapahit."]}, {"h": "Catatan", "li": ["Rincian sejarah kerajaan juga ada di peta Sejarah; di sini hanya sebagai latar budaya."]}]}]}], "notes": [{"title": "Perlu diperhatikan", "items": ["Buku Bahasa Sunda SMA berbeda antarpenerbit dan antardaerah di Jawa Barat; label kelas hanya perkiraan.", "Penjelasan ditulis dalam bahasa Indonesia agar mudah diulang; di kelas, istilah dan jawaban umumnya ditulis dalam bahasa Sunda.", "Pembagian undak-usuk basa disederhanakan menjadi loma dan hormat (keur ka batur, keur ka sorangan) seperti buku sekolah sekarang; buku lama memakai tingkatan yang lebih banyak.", "Watek pupuh dan pola guru wilangan bisa sedikit berbeda antarbuku; cocokkan dengan buku sekolah.", "Jumlah aksara ngalagena tambahan untuk bunyi serapan berbeda antarsumber, sehingga peta ini hanya menyebut 18 aksara dasar."]}, {"title": "Rujukan", "items": ["Perda Jawa Barat No. 5 Tahun 2003 tentang Pemeliharaan Bahasa, Sastra, dan Aksara Daerah; Pergub Jawa Barat No. 69 Tahun 2013 tentang pedoman kurikulum muatan lokal bahasa dan sastra daerah.", "Buku Bahasa Sunda SMA kelas X–XII (beberapa penerbit): pembagian materi umum.", "UNESCO: angklung Indonesia sebagai Warisan Budaya Takbenda (2010)."]}], "bank": "bank-bahasa-sunda.html"};

// The text faces lack most Unicode superscript/subscript digits, so turn runs of them into <sup>/<sub>.
const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺", SUB = "₀₁₂₃₄₅₆₇₈₉", PLAIN = "0123456789-+";
function scripts(s){
  return s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g, m => "<sup>" + [...m].map(c => PLAIN[SUP.indexOf(c)]).join("").replace("-", "−") + "</sup>")
          .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, m => "<sub>" + [...m].map(c => PLAIN[SUB.indexOf(c)]).join("") + "</sub>");
}
(function walk(o){ for(const k in o){ if(typeof o[k] === "string") o[k] = scripts(o[k]); else if(o[k] && typeof o[k] === "object") walk(o[k]); } })(MAP);

function hl(str, re){
  if(!re) return str;
  return str.split(/(<[^>]+>)/g).map(p => p.startsWith("<") ? p : p.replace(re, m => "<mark>" + m + "</mark>")).join("");
}
function plain(t){
  const parts = [t.code, t.title, t.scope, t.src, t.sum, t.lanjut ? "Tingkat Lanjut" : ""];
  t.blocks.forEach(b => { parts.push(b.h); (b.li||[]).forEach(x => parts.push(x)); if(b.table){ parts.push(b.table.cols.join(" ")); b.table.rows.forEach(r => parts.push(r.join(" "))); } });
  (t.traps||[]).forEach(x => parts.push(x));
  return parts.join(" ").replace(/<[^>]+>/g, " ");
}
function bodyHTML(t, re){

  t.blocks.forEach(b => {
    h += '<div class="blk' + (b.wide || (b.table && b.table.cols.length > 2) ? ' wide' : '') + '"><h4>' + hl(b.h, re) + '</h4>';
    if(b.li) h += "<ul>" + b.li.map(x => "<li>" + hl(x, re) + "</li>").join("") + "</ul>";
    if(b.table) h += '<div class="tbl"><table><thead><tr>' + b.table.cols.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>" +
      b.table.rows.map(r => "<tr>" + r.map(c => "<td>" + hl(c, re) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
    h += "</div>";
  });
  if(t.traps && t.traps.length) h += '<div class="traps"><h4>Jebakan soal</h4><ul>' + t.traps.map(x => "<li>" + hl(x, re) + "</li>").join("") + "</ul></div>";
  return h;
}

function render(){
  const total = Object.keys(byCode).length;
  document.title = MAP.title;
  $("eyebrow").textContent = "Peta materi · " + MAP.subject + " · " + MAP.domains.length + " bidang · " + total + " simpul";
  $("title").textContent = MAP.title;
  $("lead").innerHTML = MAP.lead + (MAP.bank ? ' <a href="' + MAP.bank + '">Latih dengan bank soal →</a>' : "");
  $("sourceNote").textContent = MAP.source_note || "";
  $("progress").innerHTML = MAP.domains.map(d => '<a class="pg" href="#d-' + d.id + '" style="--c:' + d.c + '"><b>' + d.short + '</b><div class="bar"><i id="bar-' + d.id + '"></i></div><span id="pg-' + d.id + '"></span></a>').join("");
  if(MAP.path && MAP.path.length){
    $("alur").hidden = false;
    $("h-alur").textContent = MAP.path_title || "Alur belajar";
    $("pathNote").textContent = MAP.path_note || "";
    $("path").innerHTML = MAP.path.map(e => '<li><button type="button" data-code="' + e.to + '"><span class="lb">' + e.label + '</span><span class="nm">' + e.title + '</span><span class="an">' + e.note + '</span></button></li>').join("");
  }
  const map = $("map"), host = $("domains");
  MAP.domains.forEach(d => {
    const col = document.createElement("div");
    col.className = "mcol"; col.style.setProperty("--c", d.c); col.style.setProperty("--soft", d.soft);
    col.innerHTML = '<h3><span>' + d.name + '</span><span class="mono">' + d.topics.length + '</span></h3><ul>' +
      d.topics.map(t => '<li><a class="chip" data-code="' + t.code + '" href="#t-' + t.code + '"><span class="mono">' + t.code + '</span><span>' + t.title + ' ' + tags(t) + '</span></a></li>').join("") + "</ul>";
    map.appendChild(col);
    const sec = document.createElement("section");
    sec.id = "d-" + d.id; sec.style.setProperty("--c", d.c); sec.style.setProperty("--soft", d.soft);
    sec.innerHTML = '<div class="domain-head"><h2>' + d.name + '</h2><span class="w">' + d.topics.length + ' simpul</span><p>' + (d.note || "") + '</p></div>';
    d.topics.forEach(t => {
      const a = document.createElement("article");
      a.className = "card"; a.id = "t-" + t.code; a.dataset.code = t.code;
      a.innerHTML = '<div class="card-head"><button class="toggle" type="button" aria-expanded="false" aria-controls="b-' + t.code + '">' +
        '<span class="code">' + t.code + '</span>' +
        '<span class="ttl"><span class="caret" aria-hidden="true">›</span>' + t.title + ' ' + tags(t) + '</span>' +
        '<span class="meta"><span>' + t.scope + '</span><span>' + t.src + '</span></span>' +
        '<span class="sum">' + t.sum + '</span></button>' +
        '<label class="done-box"><input type="checkbox" id="done-' + t.code + '"> Dikuasai</label></div>' +
        '<div class="body" id="b-' + t.code + '" hidden>' + bodyHTML(t, null) + '</div>';
      sec.appendChild(a);
    });
    host.appendChild(sec);
  });
  if(Object.values(byCode).some(x => x.t.lanjut)){
    $("lanjutKey").hidden = false; $("onlyLanjut").hidden = false;
    if(MAP.lanjut_note){ $("lanjutNote").hidden = false; $("lanjutNote").textContent = MAP.lanjut_note; }
  }
  $("notes").innerHTML = (MAP.notes || []).map(n => '<div class="note"><h3>' + n.title + '</h3><ul>' + n.items.map(i => "<li>" + i + "</li>").join("") + "</ul></div>").join("");
}
function setOpen(card, open){
  card.classList.toggle("open", open);
  card.querySelector(".body").hidden = !open;
  card.querySelector(".toggle").setAttribute("aria-expanded", open ? "true" : "false");
}
function goTo(code){
  const card = $("t-" + code); if(!card) return;
  card.hidden = false; setOpen(card, true);
  card.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
}
function progress(){
  let k = 0, n = 0;
  MAP.domains.forEach(d => {
    const dn = d.topics.filter(t => done.has(t.code)).length;
    k += dn; n += d.topics.length;
    $("bar-" + d.id).style.width = (dn / d.topics.length * 100) + "%";
    $("pg-" + d.id).textContent = dn + " dari " + d.topics.length;
  });
  $("overall").textContent = k + " dari " + n;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("done", done.has(c.dataset.code)));
  document.querySelectorAll(".card").forEach(c => { const on = done.has(c.dataset.code); c.classList.toggle("is-done", on); c.querySelector('input[type="checkbox"]').checked = on; });
}
function search(q){
  q = q.trim();
  const re = q.length >= 2 ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi") : null;
  let hits = 0;
  document.querySelectorAll(".card").forEach(card => {
    const t = byCode[card.dataset.code].t, body = card.querySelector(".body");
    const keep = !onlyLanjut || t.lanjut;
    if(!re){ card.hidden = !keep; body.innerHTML = bodyHTML(t, null); setOpen(card, false); return; }
    const match = keep && new RegExp(re.source, "i").test(plain(t));
    card.hidden = !match; body.innerHTML = bodyHTML(t, match ? re : null); setOpen(card, match);
    if(match) hits++;
  });
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("off", onlyLanjut && !byCode[c.dataset.code].t.lanjut));
  $("hits").textContent = re ? (hits ? hits + " simpul cocok" : "Tidak ada yang cocok. Coba kata lain.") : "";
}

render();
progress();
document.addEventListener("click", e => {
  const tg = e.target.closest(".toggle");
  if(tg){ const card = tg.closest(".card"); setOpen(card, !card.classList.contains("open")); return; }
  const chip = e.target.closest("[data-code]");
  if(chip && (chip.classList.contains("chip") || chip.tagName === "BUTTON")){ e.preventDefault(); goTo(chip.dataset.code); }
});
document.addEventListener("change", e => {
  if(e.target.matches(".done-box input")){
    const code = e.target.closest(".card").dataset.code;
    e.target.checked ? done.add(code) : done.delete(code);
    save(); progress();
  }
});
let timer;
$("q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => search(e.target.value), 150); });
$("openAll").addEventListener("click", () => document.querySelectorAll(".card:not([hidden])").forEach(c => setOpen(c, true)));
$("onlyLanjut").addEventListener("click", e => { onlyLanjut = !onlyLanjut; e.target.setAttribute("aria-pressed", String(onlyLanjut)); search($("q").value); });
$("closeAll").addEventListener("click", () => document.querySelectorAll(".card").forEach(c => setOpen(c, false)));
if(location.hash.startsWith("#t-")) goTo(location.hash.slice(3));
</script>
