<style>
/* Layout: generic subject map, same catalogue look as the history map. Domain progress → path strip → map overview → catalogue cards per domain. Content comes from data/maps/<subject>.json. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunk:#E9EBF1; --ink:#1A1F33; --muted:#585E73; --line:#D6DAE3;
  --d1:#2B3A78; --d2:#8A5526; --d3:#2C6B63; --d4:#6E3466; --d5:#5A6420; --d6:#9A3B1F; --d7:#3D5A80;
  --s1:#E4E8F6; --s2:#F3E9DF; --s3:#DFEFEC; --s4:#F1E3EE; --s5:#ECEEDC; --s6:#F8E6DF; --s7:#E2E9F2;
  --mark:#F6DE8D; --warn:#9A3B1F; --warn-soft:#F8E6DF; --ok:#2C6B3F;
  --f-label:"Archivo Narrow","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131A; --surface:#191C26; --sunk:#222634; --ink:#E7E9F0; --muted:#A3A9BC; --line:#2E3345;
  --d1:#A3B1F2; --d2:#E0A974; --d3:#76C7B9; --d4:#D9A0CF; --d5:#C3CC7E; --d6:#F0A58A; --d7:#9DBBE0;
  --s1:#232A47; --s2:#33271C; --s3:#1C3330; --s4:#33202F; --s5:#2A2D1A; --s6:#3A221B; --s7:#1F2A3A;
  --mark:#6D5A1C; --warn:#F0A58A; --warn-soft:#3A221B; --ok:#8FD3A2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131A; --surface:#191C26; --sunk:#222634; --ink:#E7E9F0; --muted:#A3A9BC; --line:#2E3345;
  --d1:#A3B1F2; --d2:#E0A974; --d3:#76C7B9; --d4:#D9A0CF; --d5:#C3CC7E; --d6:#F0A58A; --d7:#9DBBE0;
  --s1:#232A47; --s2:#33271C; --s3:#1C3330; --s4:#33202F; --s5:#2A2D1A; --s6:#3A221B; --s7:#1F2A3A;
  --mark:#6D5A1C; --warn:#F0A58A; --warn-soft:#3A221B; --ok:#8FD3A2; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-label);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.65rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
a{color:inherit}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
sub,sup{line-height:0}
.eyebrow{font-family:var(--f-label);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.82em}
.lead{max-width:66ch;color:var(--muted);font-size:1.05rem;margin-top:12px}
section{margin-top:44px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:16px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.sec-head p{color:var(--muted);font-size:.95rem;max-width:62ch}

.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px;margin-top:22px}
.pg{display:flex;flex-direction:column;gap:5px;text-decoration:none;min-width:0}
.pg b{font-family:var(--f-label);font-size:.92rem;color:var(--c)}
.pg .bar{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden;position:relative}
.pg .bar i{position:absolute;inset:0 auto 0 0;background:var(--c);width:0;transition:width .3s}
.pg .bar::after{content:"";position:absolute;inset:0;border:1.5px solid var(--c);border-radius:2px}
.pg span{font-size:.78rem;color:var(--muted);font-family:var(--f-label)}
.pg:focus-visible{outline:2px solid var(--c);outline-offset:3px}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:0 12px}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:10px 0;outline:none}
.btn{font-family:var(--f-label);font-weight:600;font-size:.92rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#hits{font-size:.9rem;color:var(--muted);font-family:var(--f-label)}
.overall{font-family:var(--f-label);font-size:.95rem;color:var(--muted);margin-top:10px}
.overall b{color:var(--ink);font-variant-numeric:tabular-nums}

.path-wrap{overflow-x:auto;padding-bottom:6px}
.path{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(130px,1fr);min-width:max-content}
.path li{border-top:2px solid var(--ink);padding:0 10px 0 0;position:relative}
.path li::before{content:"";position:absolute;left:0;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.path button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding-top:14px;max-width:16em}
.path button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.path .lb{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.path .nm{font-family:var(--f-label);font-weight:700;font-size:1rem;line-height:1.15}
.path .an{font-size:.8rem;color:var(--muted);line-height:1.35}

.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.mcol{border-top:4px solid var(--c);background:var(--surface);border-radius:0 0 8px 8px;padding:14px;min-width:0}
.mcol h3{color:var(--c);display:flex;justify-content:space-between;gap:8px}
.mcol ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.chip{display:flex;gap:10px;align-items:baseline;text-decoration:none;padding:6px 8px;border-radius:5px;background:var(--soft);font-size:.93rem;line-height:1.35}
.chip:hover{outline:1.5px solid var(--c)}
.chip:focus-visible{outline:2px solid var(--c)}
.chip .mono{color:var(--c);flex:none}
.chip.done{text-decoration:line-through;text-decoration-color:var(--muted);opacity:.72}
.tier{display:inline-block;font-family:var(--f-label);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.t1{background:var(--ink);color:var(--bg)}
.t2{border:1.3px solid var(--ink)}
.t3{border:1.3px dashed var(--muted);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:.88rem;color:var(--muted);align-items:center}

.domain-head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;border-bottom:2px solid var(--c);padding-bottom:8px;margin-bottom:14px}
.domain-head h2{color:var(--c)}
.domain-head .w{font-family:var(--f-mono);font-size:1rem;color:var(--c)}
.domain-head p{color:var(--muted);font-size:.92rem;flex-basis:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0;scroll-margin-top:16px}
.card + .card{margin-top:10px}
.card-head{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.toggle{all:unset;cursor:pointer;flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.toggle:focus-visible{outline:2px solid var(--c);outline-offset:4px;border-radius:4px}
.toggle .code{font-family:var(--f-mono);font-size:.8rem;color:var(--c);padding-top:4px;grid-row:span 3}
.toggle .ttl{font-family:var(--f-label);font-size:1.22rem;font-weight:700;line-height:1.2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.toggle .meta{font-size:.82rem;color:var(--muted);font-family:var(--f-label);display:flex;flex-wrap:wrap;gap:4px 12px}
.toggle .sum{font-size:.95rem;color:var(--muted);max-width:75ch}
.caret{font-family:var(--f-mono);color:var(--muted);transition:transform .2s;display:inline-block}
.card.open .caret{transform:rotate(90deg)}
.done-box{flex:none;display:flex;align-items:center;gap:6px;font-family:var(--f-label);font-size:.85rem;color:var(--muted);cursor:pointer;padding-top:3px;user-select:none}
.done-box input{width:18px;height:18px;accent-color:var(--ok);cursor:pointer}
.card.is-done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.body{padding:2px 16px 18px 16px;border-top:1px dashed var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px 26px}
.blk{min-width:0}
.blk.wide{grid-column:1/-1}
.blk h4{font-family:var(--f-label);font-size:.82rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin:14px 0 6px}
.blk ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}
.blk li{font-size:.95rem;line-height:1.55}
.blk li::marker{color:var(--c)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.4}
th{font-family:var(--f-label);font-weight:700;text-align:left;background:var(--soft);color:var(--ink);padding:7px 10px;white-space:nowrap}
td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
.traps{grid-column:1/-1;background:var(--warn-soft);border-radius:6px;padding:12px 14px}
.traps h4{color:var(--warn);margin-top:0}
.traps li::marker{color:var(--warn)}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.note ul{margin:8px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
footer{margin-top:40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:14px}

@media (max-width:480px){
  .wrap{padding-inline:16px}
  .toggle{grid-template-columns:1fr}
  .toggle .code{grid-row:auto;padding-top:0}
  .card-head{flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.home-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:600;font-size:.9rem;color:var(--muted);text-decoration:none;margin-bottom:14px}
.home-link:hover,.home-link:focus-visible{color:var(--ink);text-decoration:underline;outline:none}
</style>

 "title": "EYD Edisi V", "note": "Kapital, di-, pun", "to": "KEB-03"}], "domains": [{"id": "MBC", "name": "Membaca dan memahami teks", "short": "Membaca", "note": "Keterampilan membaca yang diuji TKA: gagasan, makna kata, hubungan, penalaran, dan data.", "topics": [{"code": "MBC-01", "title": "Gagasan pokok dan informasi", "scope": "Pokok, pendukung, tersurat, tersirat", "src": "Semua kelas", "tier": 1, "sum": "Menemukan gagasan pokok dan gagasan pendukung, membedakan informasi tersurat dan tersirat, serta merangkum isi teks.", "blocks": [{"h": "Gagasan", "li": ["<b>Gagasan pokok<\/b>: inti paragraf; biasanya ada di kalimat utama.", "Gagasan pendukung (penjelas): contoh, data, alasan, atau rincian yang menjelaskan gagasan pokok.", "Paragraf deduktif: kalimat utama di awal; induktif: di akhir; campuran: di awal dan akhir; deskriptif/naratif: tersebar."]}, {"h": "Informasi", "li": ["Tersurat: tertulis langsung di teks. Tersirat: disimpulkan dari isi teks tanpa ditulis langsung.", "Jawaban harus dapat ditunjukkan dari kalimat di teks, bukan dari pengetahuan umum.", "Waspadai pilihan yang melebih-lebihkan isi teks (\"selalu\", \"harus\", \"tidak pernah\")."]}, {"h": "Merangkum", "li": ["Ringkasan mempertahankan urutan dan sudut pandang penulis; ikhtisar boleh mengubah urutan.", "Urutan peristiwa ditentukan oleh kejadian dalam cerita, bukan urutan penyebutannya di teks."]}], "traps": ["Gagasan pendukung bukan pengulangan gagasan pokok; pilihan yang hanya menyatakan ulang gagasan pokok bukan gagasan penjelas.", "Pernyataan yang benar menurut pengetahuan umum tetapi tidak ada di teks bukan jawaban yang tepat."]}, {"code": "MBC-02", "title": "Makna kata dalam konteks", "scope": "Konteks, relasi makna, serapan", "src": "Semua kelas", "tier": 1, "sum": "Menentukan makna kata dan istilah dari konteks, jenis makna dan relasi makna, serta kata serapan.", "blocks": [{"h": "Makna", "li": ["Denotasi: makna sebenarnya; <b>konotasi<\/b>: makna tambahan atau kiasan (positif atau negatif).", "Makna kata ditentukan oleh kalimat tempatnya muncul; satu kata bisa berbeda makna di teks lain.", "Istilah: kata dengan makna khusus di bidang tertentu (inflasi, fotosintesis)."]}, {"h": "Relasi makna", "table": {"cols": ["Relasi", "Contoh"], "rows": [["Sinonim", "pandai – cerdas"], ["Antonim", "naik – turun"], ["Homonim", "bisa (racun) – bisa (dapat)"], ["Homofon", "bank – bang"], ["Homograf", "apel (buah) – apel (upacara)"], ["Polisemi", "kepala (anggota tubuh, pemimpin, bagian atas)"], ["Hiponim", "mawar, melati adalah hiponim dari bunga"]]}}, {"h": "Kata serapan", "li": ["Adopsi (diambil utuh: internet), adaptasi (disesuaikan ejaannya: <i>strategy<\/i> → strategi), penerjemahan (<i>download<\/i> → unduh)."]}], "traps": ["Homograf sama tulisan tetapi berbeda lafal atau makna; homofon sama bunyi tetapi berbeda tulisan.", "Polisemi adalah satu kata dengan beberapa makna yang masih berhubungan; homonim maknanya tidak berhubungan."]}, {"code": "MBC-03", "title": "Hubungan antarbagian dan simpulan", "scope": "Sebab-akibat, prediksi, simpulan", "src": "Semua kelas", "tier": 1, "sum": "Mengenali hubungan sebab-akibat dan pertentangan antarbagian teks, menarik simpulan, dan memprediksi kelanjutan atau akibat.", "blocks": [{"h": "Hubungan", "li": ["Sebab-akibat: ditandai karena, sebab, sehingga, akibatnya, oleh karena itu.", "Pertentangan: tetapi, namun, sebaliknya, meskipun.", "Perbandingan antarteks: cari kesamaan dan perbedaan pada topik, sudut pandang, data, dan simpulan."]}, {"h": "Simpulan dan prediksi", "li": ["Simpulan harus didukung seluruh teks, bukan satu kalimat saja, dan tidak melampaui data.", "Prediksi berangkat dari watak tokoh, sebab yang sudah ada, dan pola dalam teks.", "Nilai dan pesan diambil dari tindakan tokoh dan akibatnya, bukan dari judul saja."]}], "traps": ["Simpulan yang lebih luas daripada isi teks (generalisasi berlebihan) bukan simpulan yang tepat."]}, {"code": "MBC-04", "title": "Fakta, opini, dan penalaran", "scope": "Fakta, opini, deduksi, induksi, sesat nalar", "src": "Kelas X–XII", "tier": 1, "sum": "Membedakan fakta dan opini, mengenali penalaran deduktif dan induktif, silogisme, serta kesalahan nalar dalam argumen.", "blocks": [{"h": "Fakta dan opini", "li": ["<b>Fakta<\/b>: dapat dibuktikan, sering memuat data, tempat, waktu.", "Opini: pendapat atau penilaian; ditandai kata seperti menurut saya, sebaiknya, seharusnya, tampaknya, paling.", "Opini dapat kuat jika didukung data dan sumber yang kredibel."]}, {"h": "Penalaran", "table": {"cols": ["Jenis", "Arah", "Bentuk"], "rows": [["Deduktif", "Umum → khusus", "Silogisme: premis mayor, premis minor, simpulan; entimem (silogisme singkat)"], ["Induktif", "Khusus → umum", "Generalisasi, analogi, sebab-akibat"]]}}, {"h": "Silogisme dan sesat nalar", "li": ["Contoh: Semua siswa wajib berseragam (mayor). Rani siswa (minor). Jadi, Rani wajib berseragam.", "Generalisasi tergesa-gesa: menyimpulkan dari terlalu sedikit contoh.", "Sebab salah (post hoc): menganggap yang terjadi lebih dulu pasti penyebab.", "Menyerang pribadi (ad hominem): menolak pendapat karena orangnya, bukan argumennya."]}], "traps": ["Pernyataan berisi angka belum tentu fakta; \"ini prestasi terbaik sepanjang masa\" tetap opini.", "Dalam silogisme, simpulan hanya sah jika kedua premis benar dan istilah tengahnya dipakai dengan benar."]}, {"code": "MBC-05", "title": "Membaca data dan teks gabungan", "scope": "Tabel, grafik, infografik", "src": "Kelas X–XII", "tier": 1, "sum": "Menafsirkan tabel, grafik, dan infografik dalam teks, mencocokkan pernyataan dengan data, dan menyimpulkan dari dua teks atau lebih.", "blocks": [{"h": "Langkah", "li": ["Baca judul, satuan, dan keterangan sumbu atau kolom sebelum membaca angka.", "Bandingkan dengan teliti: naik atau turun, terbesar atau terkecil, selisih, persentase.", "Pernyataan benar hanya jika data mendukungnya secara langsung.", "Jangan menarik kesimpulan sebab-akibat dari data yang hanya menunjukkan hubungan."]}, {"h": "Teks gabungan", "li": ["Wacana 1 dan Wacana 2 bisa saling melengkapi, menguatkan, atau bertentangan.", "Tandai sudut pandang dan data tiap teks sebelum membandingkan."]}], "traps": ["Persentase dan jumlah berbeda: persentase naik belum tentu jumlahnya naik jika totalnya turun."]}]}, {"id": "NON", "name": "Teks nonfiksi", "short": "Nonfiksi", "note": "Struktur dan ciri kebahasaan teks nonfiksi dan teks fungsional.", "topics": [{"code": "NON-01", "title": "Teks laporan hasil observasi", "scope": "Struktur, kebahasaan", "src": "Kelas X", "tier": 1, "sum": "Teks yang memaparkan hasil pengamatan secara objektif dan umum, dengan struktur dan ciri kebahasaannya.", "blocks": [{"h": "Struktur dan kebahasaan", "li": ["Struktur: <b>pernyataan umum<\/b> (definisi dan klasifikasi), deskripsi bagian atau aspek, simpulan atau manfaat (opsional).", "Kebahasaan: kata benda umum, istilah teknis, kata kerja relasional (adalah, merupakan), kalimat definisi, objektif tanpa opini.", "Berbeda dari teks deskripsi: laporan membahas hal umum satu kelas benda; deskripsi menggambarkan satu objek khusus."]}], "traps": ["Laporan hasil observasi bersifat objektif; kalimat bernada penilaian pribadi tidak termasuk ciri teks ini."]}, {"code": "NON-02", "title": "Teks eksposisi", "scope": "Tesis, argumen, penegasan", "src": "Kelas X", "tier": 1, "sum": "Teks yang memaparkan pendapat penulis disertai fakta dan data, dengan struktur tesis, argumentasi, dan penegasan ulang.", "blocks": [{"h": "Struktur dan kebahasaan", "li": ["Struktur: <b>tesis<\/b> (pendapat), rangkaian argumen (fakta, data, contoh), penegasan ulang.", "Kebahasaan: istilah teknis, kata kerja mental (berpendapat, menduga), konjungsi kausal dan temporal, data atau kutipan ahli.", "Artikel opini dan editorial memakai struktur yang mirip: pernyataan pendapat, argumentasi, penegasan ulang."]}], "traps": ["Penegasan ulang menegaskan kembali tesis, bukan menambahkan argumen baru."]}, {"code": "NON-03", "title": "Negosiasi dan debat", "scope": "Struktur negosiasi, unsur debat", "src": "Kelas X", "tier": 2, "sum": "Struktur teks negosiasi untuk mencapai kesepakatan dan unsur debat untuk mempertahankan pendapat tentang sebuah mosi.", "blocks": [{"h": "Negosiasi", "li": ["Struktur: orientasi, pengajuan, penawaran, persetujuan, penutup.", "Kebahasaan: kalimat persuasif, kalimat bersyarat (jika … maka), bahasa santun."]}, {"h": "Debat", "li": ["Unsur: <b>mosi<\/b> (topik), tim afirmasi (setuju), tim oposisi (menolak), tim netral, moderator, juri.", "Argumen yang baik: pernyataan, alasan, bukti, dan sanggahan terhadap argumen lawan."]}]}, {"code": "NON-04", "title": "Teks prosedur dan eksplanasi", "scope": "Langkah, sebab-akibat", "src": "Kelas XI", "tier": 1, "sum": "Teks prosedur yang berisi langkah melakukan sesuatu dan teks eksplanasi yang menerangkan proses terjadinya fenomena.", "blocks": [{"h": "Perbandingan", "table": {"cols": ["Aspek", "Prosedur", "Eksplanasi"], "rows": [["Tujuan", "Memandu melakukan sesuatu", "Menjelaskan proses terjadinya fenomena"], ["Struktur", "Tujuan, langkah-langkah, penutup", "Identifikasi fenomena, rangkaian kejadian (sebab-akibat), ulasan"], ["Kebahasaan", "Kalimat perintah, kata kerja material, konjungsi temporal (lalu, kemudian)", "Konjungsi kausal (karena, sehingga) dan kronologis, istilah ilmiah, kalimat pasif"]]}}], "traps": ["Teks eksplanasi menjelaskan mengapa dan bagaimana sesuatu terjadi; teks prosedur menjelaskan cara membuat atau melakukan sesuatu."]}, {"code": "NON-05", "title": "Karya ilmiah dan resensi", "scope": "Sistematika, unsur resensi", "src": "Kelas XI", "tier": 2, "sum": "Sistematika karya ilmiah dan ciri bahasanya, serta unsur resensi buku atau film.", "blocks": [{"h": "Karya ilmiah", "li": ["Sistematika: pendahuluan (latar belakang, rumusan masalah, tujuan), kajian teori, metode, hasil dan pembahasan, simpulan dan saran, daftar pustaka.", "Bahasa: baku, objektif, lugas, memakai istilah, mencantumkan sumber kutipan."]}, {"h": "Resensi", "li": ["Unsur: identitas buku, sinopsis atau ikhtisar, kelebihan, kekurangan, penilaian dan rekomendasi.", "Penilaian harus berdasar isi karya, bukan selera pribadi saja."]}]}, {"code": "NON-06", "title": "Surat lamaran pekerjaan", "scope": "Bagian surat, bahasa", "src": "Kelas XII", "tier": 2, "sum": "Bagian-bagian surat lamaran pekerjaan dan kaidah bahasanya.", "blocks": [{"h": "Bagian dan kaidah", "li": ["Bagian: tempat dan tanggal, lampiran, perihal, alamat tujuan, salam pembuka, pembuka (sumber informasi lowongan), isi (identitas dan kualifikasi), penutup, salam penutup, tanda tangan dan nama.", "Bahasa: baku, santun, ringkas, dan meyakinkan; ejaan yang benar.", "Daftar riwayat hidup (CV) dilampirkan bersama surat lamaran."]}]}, {"code": "NON-07", "title": "Kritik, esai, dan artikel opini", "scope": "Ciri, perbedaan", "src": "Kelas XII", "tier": 2, "sum": "Perbedaan kritik, esai, dan artikel opini, serta cara menilai argumen dalam ketiganya.", "blocks": [{"h": "Perbandingan", "table": {"cols": ["Jenis", "Isi", "Sifat"], "rows": [["Kritik", "Penilaian atas karya (sastra, seni) dengan dasar dan bukti", "Objektif, menimbang kelebihan dan kekurangan"], ["Esai", "Pandangan pribadi penulis tentang suatu topik", "Subjektif, bebas, reflektif"], ["Artikel opini/editorial", "Pendapat tentang isu aktual; editorial mewakili sikap redaksi media", "Argumentatif, didukung fakta"]]}}]}]}, {"id": "SAS", "name": "Teks sastra", "short": "Sastra", "note": "Prosa, hikayat, puisi, drama, anekdot, dan novel sejarah.", "topics": [{"code": "SAS-01", "title": "Unsur intrinsik dan ekstrinsik prosa", "scope": "Cerpen, novel", "src": "Kelas X–XII", "tier": 1, "sum": "Unsur intrinsik (tema, tokoh, alur, latar, sudut pandang, amanat, gaya bahasa) dan ekstrinsik cerpen dan novel.", "blocks": [{"h": "Unsur intrinsik", "table": {"cols": ["Unsur", "Keterangan"], "rows": [["Tema", "Gagasan dasar cerita"], ["Tokoh dan penokohan", "Pelaku dan wataknya; ditunjukkan langsung (analitik) atau lewat tindakan, dialog, pikiran (dramatik)"], ["Alur", "Rangkaian peristiwa: maju, mundur (sorot balik), campuran"], ["Latar", "Tempat, waktu, suasana"], ["Sudut pandang", "Orang pertama (aku) atau orang ketiga (dia, nama tokoh)"], ["Amanat", "Pesan pengarang kepada pembaca"]]}}, {"h": "Struktur dan unsur ekstrinsik", "li": ["Struktur cerpen: abstrak, orientasi, komplikasi, evaluasi, resolusi, koda.", "Unsur ekstrinsik: latar belakang pengarang, nilai (moral, sosial, budaya, agama), keadaan masyarakat saat karya ditulis."]}], "traps": ["Penokohan dramatik menunjukkan watak lewat tindakan atau dialog, bukan lewat penjelasan langsung pengarang.", "Latar suasana (sedih, tegang) termasuk latar, bukan tema."]}, {"code": "SAS-02", "title": "Hikayat dan cerita rakyat", "scope": "Ciri, struktur, nilai", "src": "Kelas X", "tier": 1, "sum": "Ciri hikayat sebagai prosa lama, strukturnya, nilai-nilai di dalamnya, dan perbandingannya dengan cerpen.", "blocks": [{"h": "Ciri hikayat", "li": ["<b>Kemustahilan<\/b> (peristiwa tidak masuk akal), kesaktian tokoh, anonim, istanasentris, statis, memakai kata arkais (hatta, syahdan, sebermula).", "Struktur: abstraksi, orientasi, komplikasi, evaluasi, resolusi, koda.", "Nilai: agama, moral, budaya, sosial, pendidikan."]}, {"h": "Dibandingkan cerpen", "li": ["Hikayat: lisan lalu tertulis, anonim, tokoh raja dan bangsawan, kemustahilan.", "Cerpen: modern, pengarang diketahui, tokoh orang biasa, peristiwa masuk akal."]}], "traps": ["Kata syahdan dan hatta adalah penanda hikayat (kata arkais), bukan nama tokoh."]}, {"code": "SAS-03", "title": "Puisi", "scope": "Unsur fisik dan batin, majas, citraan", "src": "Kelas X", "tier": 1, "sum": "Unsur fisik dan batin puisi, jenis majas dan citraan, serta rima dalam puisi lama dan baru.", "blocks": [{"h": "Unsur", "li": ["Fisik: diksi, imaji (citraan), kata konkret, majas, rima, tipografi.", "Batin: tema, rasa, nada, amanat.", "Citraan: penglihatan, pendengaran, perabaan, penciuman, pengecapan, gerak."]}, {"h": "Majas", "table": {"cols": ["Majas", "Contoh"], "rows": [["Personifikasi", "Angin berbisik di telingaku"], ["Metafora", "Dia kutu buku"], ["Simile (perumpamaan)", "Wajahnya bagai bulan purnama"], ["Hiperbola", "Tangisnya membanjiri seluruh kota"], ["Litotes", "Mampirlah ke gubuk kami"], ["Ironi", "Rapi sekali kamarmu, sampai sampah menumpuk"], ["Metonimia", "Ayah mengendarai Honda"], ["Sinekdoke", "Pars pro toto: batang hidungnya tidak tampak; totum pro parte: Indonesia juara"]]}}, {"h": "Puisi lama", "li": ["Pantun: sampiran dan isi, rima a-b-a-b; syair: semua baris isi, rima a-a-a-a; gurindam: dua baris, rima a-a."]}], "traps": ["Simile memakai kata pembanding (seperti, bagai, laksana); metafora tidak.", "Litotes merendahkan diri; ironi menyindir dengan pernyataan yang berlawanan."]}, {"code": "SAS-04", "title": "Drama", "scope": "Unsur dan struktur", "src": "Kelas XI", "tier": 2, "sum": "Unsur drama, struktur pementasan, dan perbedaan naskah drama dengan prosa.", "blocks": [{"h": "Unsur dan struktur", "li": ["Unsur: tema, tokoh (protagonis, antagonis, tritagonis), dialog, alur, latar, petunjuk lakuan (dalam kurung), amanat.", "Struktur: prolog, dialog (orientasi, komplikasi, resolusi), epilog.", "Pementasan melibatkan sutradara, aktor, penata panggung, dan penonton."]}]}, {"code": "SAS-05", "title": "Teks anekdot", "scope": "Struktur, humor, kritik", "src": "Kelas X", "tier": 2, "sum": "Cerita singkat lucu yang berisi sindiran atau kritik terhadap layanan publik atau perilaku, dengan strukturnya.", "blocks": [{"h": "Struktur dan ciri", "li": ["Struktur: abstraksi, orientasi, krisis, reaksi, koda.", "Ciri: lucu, mengandung sindiran atau kritik, sering tentang tokoh publik atau layanan umum.", "Kebahasaan: kalimat retoris, konjungsi temporal, kalimat langsung."]}]}, {"code": "SAS-06", "title": "Novel dan cerita sejarah", "scope": "Fakta sejarah, imajinasi", "src": "Kelas XII", "tier": 3, "sum": "Novel atau cerita sejarah memadukan fakta sejarah dengan imajinasi pengarang; cara membedakannya dan menilai nilai di dalamnya.", "blocks": [{"h": "Ciri", "li": ["Latar waktu dan tempat sejarah nyata; tokoh bisa nyata atau rekaan.", "Struktur: orientasi, pengungkapan peristiwa, menuju konflik, puncak konflik, penyelesaian, koda.", "Contoh: Bumi Manusia (Pramoedya Ananta Toer), berlatar akhir abad ke-19 sampai awal abad ke-20."]}]}]}, {"id": "KEB", "name": "Kaidah kebahasaan", "short": "Kebahasaan", "note": "Kata dan imbuhan, kalimat efektif, ejaan, dan paragraf.", "topics": [{"code": "KEB-01", "title": "Kata baku dan pembentukan kata", "scope": "Imbuhan, kata baku, kata ulang", "src": "Semua kelas", "tier": 1, "sum": "Kata baku dan tidak baku, aturan imbuhan meN- dan peN-, serta kata ulang dan gabungan kata.", "blocks": [{"h": "Kata baku", "table": {"cols": ["Baku", "Tidak baku"], "rows": [["apotek", "apotik"], ["praktik", "praktek"], ["risiko", "resiko"], ["analisis", "analisa"], ["jadwal", "jadual"], ["izin", "ijin"], ["objek", "obyek"], ["karier", "karir"]]}}, {"h": "Imbuhan", "li": ["<b>meN- + k, p, t, s<\/b> di awal kata dasar: fonem luluh (kirim → mengirim, pukul → memukul, tulis → menulis, sapu → menyapu).", "Kata dasar berawalan gugus konsonan tidak luluh: mengkritik, memproduksi, mentraktir.", "Imbuhan yang sama dapat bermakna berbeda: ber- dapat berarti memakai (berbaju), mempunyai (beranak), melakukan (bersepeda)."]}, {"h": "Kata ulang dan gabungan kata", "li": ["Kata ulang ditulis dengan tanda hubung: anak-anak, sayur-mayur.", "Gabungan kata ditulis terpisah: kerja sama, tanggung jawab; disambung bila mendapat awalan dan akhiran sekaligus: dikerjasamakan, pertanggungjawaban."]}], "traps": ["Bentuk baku adalah mengkritik, bukan mengritik; gugus konsonan di awal kata tidak luluh.", "\"Kerja sama\" ditulis terpisah; \"bekerja sama\" juga terpisah karena hanya mendapat awalan."]}, {"code": "KEB-02", "title": "Kalimat efektif dan konjungsi", "scope": "Syarat efektif, jenis konjungsi", "src": "Semua kelas", "tier": 1, "sum": "Syarat kalimat efektif, kalimat tunggal dan majemuk, serta pemakaian konjungsi intrakalimat dan antarkalimat.", "blocks": [{"h": "Syarat kalimat efektif", "li": ["Kesepadanan: subjek dan predikat jelas; subjek tidak diawali preposisi (\"Di dalam rapat itu membahas …\" tidak efektif).", "<b>Kehematan<\/b>: tanpa kata mubazir (\"para siswa-siswa\", \"sangat … sekali\", \"agar supaya\", \"naik ke atas\").", "Keparalelan bentuk (pemeriksaan, pengukuran, pencatatan), kecermatan, kelogisan, kepaduan."]}, {"h": "Konjungsi", "table": {"cols": ["Jenis", "Contoh"], "rows": [["Koordinatif (setara)", "dan, atau, tetapi"], ["Subordinatif (bertingkat)", "karena, jika, ketika, sehingga, meskipun"], ["Korelatif", "baik … maupun, tidak hanya … tetapi juga"], ["Antarkalimat", "Oleh karena itu, Namun, Selain itu, Akan tetapi"]]}}, {"h": "Kalimat majemuk", "li": ["Setara: klausa sederajat (dan, tetapi). Bertingkat: ada induk dan anak kalimat (karena, ketika).", "Kalimat pasif: subjek dikenai pekerjaan (di-, ter-); sering dipakai dalam teks ilmiah dan eksplanasi."]}], "traps": ["\"Namun\" adalah konjungsi antarkalimat, diletakkan di awal kalimat dan diikuti koma; di dalam kalimat dipakai \"tetapi\".", "Kalimat yang diawali \"Bagi\", \"Di\", atau \"Dalam\" sering kehilangan subjek."]}, {"code": "KEB-03", "title": "Ejaan dan tanda baca (EYD Edisi V)", "scope": "Kapital, di-, pun, tanda baca", "src": "Semua kelas", "tier": 1, "sum": "Kaidah ejaan menurut EYD Edisi V (2022): huruf kapital, penulisan kata depan dan imbuhan, partikel, angka, dan tanda baca.", "blocks": [{"h": "Penulisan kata", "li": ["Kata depan <b>di<\/b> dan ke ditulis terpisah (di rumah, ke pasar); awalan di- ditulis serangkai (ditulis, dibaca).", "Partikel pun ditulis terpisah (apa pun, satu kali pun), kecuali dalam kata padu: meskipun, walaupun, adapun, bagaimanapun, sekalipun (berarti meskipun).", "Partikel -lah, -kah, -tah ditulis serangkai; partikel per (tiap) ditulis terpisah.", "Angka di awal kalimat ditulis dengan huruf."]}, {"h": "Huruf kapital dan tanda baca", "li": ["Kapital untuk awal kalimat, nama orang, nama geografi (Sungai Musi), nama lembaga, gelar yang diikuti nama.", "Nama arah mata angin tidak berkapital kecuali menjadi bagian nama geografi: berjalan ke selatan, tetapi Kalimantan Selatan.", "Koma dipakai sebelum tetapi, melainkan, dan sedangkan; setelah ungkapan penghubung antarkalimat di awal kalimat.", "EYD Edisi V ditetapkan Badan Pengembangan dan Pembinaan Bahasa pada 2022, menggantikan PUEBI (2015)."]}], "traps": ["\"Di\" sebagai kata depan menunjukkan tempat atau waktu dan ditulis terpisah; jika diganti \"ke\" atau \"dari\" masih bermakna, berarti kata depan.", "\"Meskipun\" ditulis serangkai, tetapi \"apa pun\" dan \"siapa pun\" ditulis terpisah."]}, {"code": "KEB-04", "title": "Paragraf, kohesi, dan koherensi", "scope": "Kalimat utama, kepaduan", "src": "Semua kelas", "tier": 2, "sum": "Unsur paragraf, letak kalimat utama, alat kohesi, dan koherensi antarkalimat.", "blocks": [{"h": "Paragraf", "li": ["Paragraf yang baik memiliki satu gagasan pokok (kesatuan), kohesi, dan koherensi.", "Kohesi (kepaduan bentuk): pronomina (ia, mereka, hal itu), repetisi, sinonim, konjungsi.", "Koherensi (kepaduan makna): kalimat-kalimat berhubungan logis dan berurutan.", "Kalimat sumbang: kalimat yang tidak mendukung gagasan pokok paragraf."]}]}]}], "notes": [{"title": "Perlu diperhatikan", "items": ["Urutan dan judul bab Bahasa Indonesia Kurikulum Merdeka berbeda antarbuku; label kelas tiap simpul adalah perkiraan.", "Kaidah ejaan mengikuti EYD Edisi V (2022). Buku yang lebih lama memakai PUEBI; sebagian kecil aturan berbeda.", "Struktur teks (misalnya bagian anekdot atau hikayat) ditulis sedikit berbeda antarbuku; ikuti istilah buku sekolah.", "Soal TKA selalu berbasis teks: jawaban harus dapat ditunjukkan dari teks, bukan dari pengetahuan umum."]}, {"title": "Rujukan", "items": ["Buku teks Bahasa Indonesia Kurikulum Merdeka kelas X–XII (Kemendikbudristek). Daftar bab dicocokkan lewat ringkasan Ruangguru, Mamikos, dan silabus sekolah karena PDF resmi tidak dapat dibuka dari lingkungan kerja.", "Tipe soal TKA 2025 Bahasa Indonesia (specs/tka-templates/bahasa-indonesia.md).", "Pedoman Umum Ejaan Bahasa Indonesia Edisi V (Badan Pengembangan dan Pembinaan Bahasa, 2022) dan KBBI untuk bentuk baku."]}]};
const TIER = {1:["t1","Inti"],2:["t2","Penting"],3:["t3","Pelengkap"]};
const KEY = "peta-" + MAP.id + "-v1";
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch(e) {} }
const $ = id => document.getElementById(id);
// The text faces lack most Unicode superscript/subscript digits, so turn runs of them into <sup>/<sub>.
const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺", SUB = "₀₁₂₃₄₅₆₇₈₉", PLAIN = "0123456789-+";
function scripts(s){
  return s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g, m => "<sup>" + [...m].map(c => PLAIN[SUP.indexOf(c)]).join("").replace("-", "−") + "</sup>")
          .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, m => "<sub>" + [...m].map(c => PLAIN[SUB.indexOf(c)]).join("") + "</sub>");
}
(function walk(o){ for(const k in o){ if(typeof o[k] === "string") o[k] = scripts(o[k]); else if(o[k] && typeof o[k] === "object") walk(o[k]); } })(MAP);
const byCode = {};
MAP.domains.forEach((d,i) => { d.c = "var(--d" + (i % 7 + 1) + ")"; d.soft = "var(--s" + (i % 7 + 1) + ")"; d.topics.forEach(t => byCode[t.code] = {t, d}); });

function hl(str, re){
  if(!re) return str;
  return str.split(/(<[^>]+>)/g).map(p => p.startsWith("<") ? p : p.replace(re, m => "<mark>" + m + "</mark>")).join("");
}
function plain(t){
  const parts = [t.code, t.title, t.scope, t.src, t.sum];
  t.blocks.forEach(b => { parts.push(b.h); (b.li||[]).forEach(x => parts.push(x)); if(b.table){ parts.push(b.table.cols.join(" ")); b.table.rows.forEach(r => parts.push(r.join(" "))); } });
  (t.traps||[]).forEach(x => parts.push(x));
  return parts.join(" ").replace(/<[^>]+>/g, " ");
}
function bodyHTML(t, re){
  let h = "";
  t.blocks.forEach(b => {
    h += '<div class="blk' + (b.wide || (b.table && b.table.cols.length > 2) ? ' wide' : '') + '"><h4>' + hl(b.h, re) + '</h4>';
    if(b.li) h += "<ul>" + b.li.map(x => "<li>" + hl(x, re) + "</li>").join("") + "</ul>";
    if(b.table) h += '<div class="tbl"><table><thead><tr>' + b.table.cols.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>" +
      b.table.rows.map(r => "<tr>" + r.map(c => "<td>" + hl(c, re) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
    h += "</div>";
  });
  if(t.traps && t.traps.length) h += '<div class="traps"><h4>Jebakan soal</h4><ul>' + t.traps.map(x => "<li>" + hl(x, re) + "</li>").join("") + "</ul></div>";
  return h;
}

function render(){
  const total = Object.keys(byCode).length;
  document.title = MAP.title;
  $("eyebrow").textContent = "Peta materi · " + MAP.subject + " · " + MAP.domains.length + " bidang · " + total + " simpul";
  $("title").textContent = MAP.title;
  $("lead").innerHTML = MAP.lead;
  $("sourceNote").textContent = MAP.source_note || "";
  $("progress").innerHTML = MAP.domains.map(d => '<a class="pg" href="#d-' + d.id + '" style="--c:' + d.c + '"><b>' + d.short + '</b><div class="bar"><i id="bar-' + d.id + '"></i></div><span id="pg-' + d.id + '"></span></a>').join("");
  if(MAP.path && MAP.path.length){
    $("alur").hidden = false;
    $("h-alur").textContent = MAP.path_title || "Alur belajar";
    $("pathNote").textContent = MAP.path_note || "";
    $("path").innerHTML = MAP.path.map(e => '<li><button type="button" data-code="' + e.to + '"><span class="lb">' + e.label + '</span><span class="nm">' + e.title + '</span><span class="an">' + e.note + '</span></button></li>').join("");
  }
  const map = $("map"), host = $("domains");
  MAP.domains.forEach(d => {
    const col = document.createElement("div");
    col.className = "mcol"; col.style.setProperty("--c", d.c); col.style.setProperty("--soft", d.soft);
    col.innerHTML = '<h3><span>' + d.name + '</span><span class="mono">' + d.topics.length + '</span></h3><ul>' +
      d.topics.map(t => '<li><a class="chip" data-code="' + t.code + '" href="#t-' + t.code + '"><span class="mono">' + t.code + '</span><span>' + t.title + ' <span class="tier ' + TIER[t.tier][0] + '">' + TIER[t.tier][1] + '</span></span></a></li>').join("") + "</ul>";
    map.appendChild(col);
    const sec = document.createElement("section");
    sec.id = "d-" + d.id; sec.style.setProperty("--c", d.c); sec.style.setProperty("--soft", d.soft);
    sec.innerHTML = '<div class="domain-head"><h2>' + d.name + '</h2><span class="w">' + d.topics.length + ' simpul</span><p>' + (d.note || "") + '</p></div>';
    d.topics.forEach(t => {
      const a = document.createElement("article");
      a.className = "card"; a.id = "t-" + t.code; a.dataset.code = t.code;
      a.innerHTML = '<div class="card-head"><button class="toggle" type="button" aria-expanded="false" aria-controls="b-' + t.code + '">' +
        '<span class="code">' + t.code + '</span>' +
        '<span class="ttl"><span class="caret" aria-hidden="true">›</span>' + t.title + ' <span class="tier ' + TIER[t.tier][0] + '">' + TIER[t.tier][1] + '</span></span>' +
        '<span class="meta"><span>' + t.scope + '</span><span>' + t.src + '</span></span>' +
        '<span class="sum">' + t.sum + '</span></button>' +
        '<label class="done-box"><input type="checkbox" id="done-' + t.code + '"> Dikuasai</label></div>' +
        '<div class="body" id="b-' + t.code + '" hidden>' + bodyHTML(t, null) + '</div>';
      sec.appendChild(a);
    });
    host.appendChild(sec);
  });
  $("notes").innerHTML = (MAP.notes || []).map(n => '<div class="note"><h3>' + n.title + '</h3><ul>' + n.items.map(i => "<li>" + i + "</li>").join("") + "</ul></div>").join("");
}
function setOpen(card, open){
  card.classList.toggle("open", open);
  card.querySelector(".body").hidden = !open;
  card.querySelector(".toggle").setAttribute("aria-expanded", open ? "true" : "false");
}
function goTo(code){
  const card = $("t-" + code); if(!card) return;
  card.hidden = false; setOpen(card, true);
  card.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
}
function progress(){
  let k = 0, n = 0;
  MAP.domains.forEach(d => {
    const dn = d.topics.filter(t => done.has(t.code)).length;
    k += dn; n += d.topics.length;
    $("bar-" + d.id).style.width = (dn / d.topics.length * 100) + "%";
    $("pg-" + d.id).textContent = dn + " dari " + d.topics.length;
  });
  $("overall").textContent = k + " dari " + n;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("done", done.has(c.dataset.code)));
  document.querySelectorAll(".card").forEach(c => { const on = done.has(c.dataset.code); c.classList.toggle("is-done", on); c.querySelector('input[type="checkbox"]').checked = on; });
}
function search(q){
  q = q.trim();
  const re = q.length >= 2 ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi") : null;
  let hits = 0;
  document.querySelectorAll(".card").forEach(card => {
    const t = byCode[card.dataset.code].t, body = card.querySelector(".body");
    if(!re){ card.hidden = false; body.innerHTML = bodyHTML(t, null); setOpen(card, false); return; }
    const match = new RegExp(re.source, "i").test(plain(t));
    card.hidden = !match; body.innerHTML = bodyHTML(t, match ? re : null); setOpen(card, match);
    if(match) hits++;
  });
  $("hits").textContent = re ? (hits ? hits + " simpul cocok" : "Tidak ada yang cocok. Coba kata lain.") : "";
}

render();
progress();
document.addEventListener("click", e => {
  const tg = e.target.closest(".toggle");
  if(tg){ const card = tg.closest(".card"); setOpen(card, !card.classList.contains("open")); return; }
  const chip = e.target.closest("[data-code]");
  if(chip && (chip.classList.contains("chip") || chip.tagName === "BUTTON")){ e.preventDefault(); goTo(chip.dataset.code); }
});
document.addEventListener("change", e => {
  if(e.target.matches(".done-box input")){
    const code = e.target.closest(".card").dataset.code;
    e.target.checked ? done.add(code) : done.delete(code);
    save(); progress();
  }
});
let timer;
$("q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => search(e.target.value), 150); });
$("openAll").addEventListener("click", () => document.querySelectorAll(".card:not([hidden])").forEach(c => setOpen(c, true)));
$("closeAll").addEventListener("click", () => document.querySelectorAll(".card").forEach(c => setOpen(c, false)));
if(location.hash.startsWith("#t-")) goTo(location.hash.slice(3));
</script>
