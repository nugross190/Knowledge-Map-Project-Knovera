<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Halaman Tidak Ditemukan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Lato:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one centred notice. GitHub Pages serves this for any missing address, at any depth, so links are absolute. */
:root{--bg:#F3F4F7;--surface:#FFFFFF;--ink:#1A1F33;--muted:#585E73;--line:#D6DAE3;
  --f-label:"Poppins",system-ui,sans-serif;--f-body:"Lato",system-ui,sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:620px;margin:0 auto;padding-inline:20px;padding-block:72px 64px}
.code{font-family:var(--f-mono);color:var(--muted);font-size:.9rem}
h1{font-family:var(--f-label);font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.15;margin:8px 0 12px;text-wrap:balance}
p{margin:0 0 12px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.links a{font-family:var(--f-label);font-weight:700;text-decoration:none;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:9px 14px}
.links a:hover,.links a:focus-visible{border-color:var(--ink);outline:none}
.links a.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:480px){.wrap{padding-inline:16px;padding-block:48px}}
/* Shared light theme, added by scripts/build.py at the end of every page's first <style> block, so it
   overrides the page's own tokens and components. Look: pale blue page with soft blobs, bold Poppins headings,
   white cards with a thick dark outline and an offset shadow, yellow primary buttons, blue for selected states. */
:root{
  --bg:#F4F8FD; --surface:#FFFFFF; --sunk:#E6EFF8; --ink:#15161A; --muted:#4F5664; --line:#CBD6E3;
  --stroke:#15161A; --blue:#2FA4E7; --blue-ink:#0A64A8; --blue-soft:#D7EDFB; --yellow:#FFD23F; --yellow-soft:#FFF3C4;
  --d1:#0A64A8; --d2:#B4560C; --d3:#17775D; --d4:#8E3593; --d5:#5E6B0E; --d6:#B8322A; --d7:#3E48A8;
  --s1:#E0EFFA; --s2:#FCEBDA; --s3:#DCF2EA; --s4:#F4E3F5; --s5:#EDF1D5; --s6:#FBE3E0; --s7:#E3E6F8;
  --mark:#FFE27A; --warn:#B8322A; --warn-soft:#FDECEA; --ok:#17803F;
  --f-label:"Poppins",system-ui,sans-serif; --f-body:"Lato",system-ui,sans-serif;
  --shadow:4px 4px 0 var(--stroke); --shadow-sm:3px 3px 0 var(--stroke); --radius:16px;
  color-scheme:light;
}
body{
  background:
    radial-gradient(520px 380px at 100% 0,var(--blue-soft),transparent 70%),
    radial-gradient(420px 320px at 0 340px,var(--yellow-soft),transparent 70%),
    var(--bg);
  background-repeat:no-repeat;
  min-height:100vh;
}
html{background:var(--bg)}
h1,h2,h3{font-family:var(--f-label);letter-spacing:-.015em}
h1{font-weight:800}
h2{font-weight:700}
.eyebrow{font-family:var(--f-label);font-weight:600;letter-spacing:.08em;color:var(--blue-ink)}
a{text-underline-offset:3px}
::selection{background:var(--yellow)}

/* Buttons and pressed states */
.btn,.linkbtn{border:2px solid var(--stroke);border-radius:12px;box-shadow:var(--shadow-sm);background:var(--surface);color:var(--ink);
  font-family:var(--f-label);font-weight:600;transition:transform .12s,box-shadow .12s}
.btn:hover:not([disabled]):not(:disabled){border-color:var(--stroke);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--stroke)}
.btn:active:not([disabled]):not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--stroke)}
.btn.primary{background:var(--yellow);border-color:var(--stroke);color:var(--ink)}
.btn.ok{background:#DDF5E5;border-color:var(--stroke);color:#0E5A2B}
.btn.bad{background:#FDE3E0;border-color:var(--stroke);color:#8E1F18}
.btn[aria-pressed="true"]{background:var(--blue-ink);color:#fff}
.btn[disabled],.btn:disabled{box-shadow:none;opacity:.5}
.seg{border:2px solid var(--stroke);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm);background:var(--surface)}
.seg button{border-radius:0;font-family:var(--f-label);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--blue-ink);color:#fff}
.tab,.stage-tab{border:2px solid var(--stroke);border-radius:12px;background:var(--surface);font-family:var(--f-label)}
.tab[aria-selected="true"],.stage-tab[aria-selected="true"]{background:var(--blue-soft);color:var(--ink);box-shadow:var(--shadow-sm)}

/* Inputs */
.search,select,input[type="search"],input[type="text"],input[type="number"]{border:2px solid var(--stroke);border-radius:12px;background:var(--surface)}
.search{box-shadow:var(--shadow-sm)}
.search input{border:0}

/* Cards and panels */
.card,.mcol,.qcard,.stat,.team,.stage,.step,.item,details.lesson,.empty,.weak,.result,.warning{
  border:2px solid var(--stroke);border-radius:var(--radius);box-shadow:var(--shadow);background:var(--surface)}
.card{box-shadow:var(--shadow-sm)}
.card + .card{margin-top:12px}
.mcol{border-top:7px solid var(--c)}
.card.is-done{border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.item.ok{border-color:var(--ok);box-shadow:3px 3px 0 var(--ok)}
.team.turn{background:var(--yellow-soft)}
.chip{border-radius:10px}
.tier{border-radius:999px}
.t1{background:var(--ink);color:#fff}
.tbl{border-radius:12px}
.traps{border-radius:12px;border:2px dashed var(--warn)}
.sec-head{border-bottom:3px solid var(--stroke)}
.pg .bar,.bar{border-radius:999px}
.pg .bar::after{border-radius:999px}

/* Back link to the home page: a small outlined pill */
.home-link{border:2px solid var(--stroke);border-radius:999px;background:var(--surface);color:var(--ink);padding:5px 14px;box-shadow:2px 2px 0 var(--stroke);font-family:var(--f-label)}
.home-link:hover,.home-link:focus-visible{background:var(--yellow);color:var(--ink);text-decoration:none}
.links a{border:2px solid var(--stroke);border-radius:12px;box-shadow:var(--shadow-sm);background:var(--surface);color:var(--ink)}
.links a.primary{background:var(--yellow);border-color:var(--stroke);color:var(--ink)}
footer{border-top:2px solid var(--stroke)}
</style>
