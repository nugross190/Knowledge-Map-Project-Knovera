<style>
/* Layout: generic subject map, same catalogue look as the history map. Domain progress → path strip → map overview → catalogue cards per domain. Content comes from data/maps/<subject>.json. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunk:#E9EBF1; --ink:#1A1F33; --muted:#585E73; --line:#D6DAE3;
  --d1:#2B3A78; --d2:#8A5526; --d3:#2C6B63; --d4:#6E3466; --d5:#5A6420; --d6:#9A3B1F; --d7:#3D5A80;
  --s1:#E4E8F6; --s2:#F3E9DF; --s3:#DFEFEC; --s4:#F1E3EE; --s5:#ECEEDC; --s6:#F8E6DF; --s7:#E2E9F2;
  --mark:#F6DE8D; --warn:#9A3B1F; --warn-soft:#F8E6DF; --ok:#2C6B3F;
  --f-label:"Archivo Narrow","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131A; --surface:#191C26; --sunk:#222634; --ink:#E7E9F0; --muted:#A3A9BC; --line:#2E3345;
  --d1:#A3B1F2; --d2:#E0A974; --d3:#76C7B9; --d4:#D9A0CF; --d5:#C3CC7E; --d6:#F0A58A; --d7:#9DBBE0;
  --s1:#232A47; --s2:#33271C; --s3:#1C3330; --s4:#33202F; --s5:#2A2D1A; --s6:#3A221B; --s7:#1F2A3A;
  --mark:#6D5A1C; --warn:#F0A58A; --warn-soft:#3A221B; --ok:#8FD3A2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131A; --surface:#191C26; --sunk:#222634; --ink:#E7E9F0; --muted:#A3A9BC; --line:#2E3345;
  --d1:#A3B1F2; --d2:#E0A974; --d3:#76C7B9; --d4:#D9A0CF; --d5:#C3CC7E; --d6:#F0A58A; --d7:#9DBBE0;
  --s1:#232A47; --s2:#33271C; --s3:#1C3330; --s4:#33202F; --s5:#2A2D1A; --s6:#3A221B; --s7:#1F2A3A;
  --mark:#6D5A1C; --warn:#F0A58A; --warn-soft:#3A221B; --ok:#8FD3A2; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-label);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.65rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
a{color:inherit}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
sub,sup{line-height:0}
.eyebrow{font-family:var(--f-label);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.82em}
.lead{max-width:66ch;color:var(--muted);font-size:1.05rem;margin-top:12px}
section{margin-top:44px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:16px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.sec-head p{color:var(--muted);font-size:.95rem;max-width:62ch}

.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px;margin-top:22px}
.pg{display:flex;flex-direction:column;gap:5px;text-decoration:none;min-width:0}
.pg b{font-family:var(--f-label);font-size:.92rem;color:var(--c)}
.pg .bar{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden;position:relative}
.pg .bar i{position:absolute;inset:0 auto 0 0;background:var(--c);width:0;transition:width .3s}
.pg .bar::after{content:"";position:absolute;inset:0;border:1.5px solid var(--c);border-radius:2px}
.pg span{font-size:.78rem;color:var(--muted);font-family:var(--f-label)}
.pg:focus-visible{outline:2px solid var(--c);outline-offset:3px}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:0 12px}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:10px 0;outline:none}
.btn{font-family:var(--f-label);font-weight:600;font-size:.92rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#hits{font-size:.9rem;color:var(--muted);font-family:var(--f-label)}
.overall{font-family:var(--f-label);font-size:.95rem;color:var(--muted);margin-top:10px}
.overall b{color:var(--ink);font-variant-numeric:tabular-nums}

.path-wrap{overflow-x:auto;padding-bottom:6px}
.path{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(130px,1fr);min-width:max-content}
.path li{border-top:2px solid var(--ink);padding:0 10px 0 0;position:relative}
.path li::before{content:"";position:absolute;left:0;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.path button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding-top:14px;max-width:16em}
.path button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.path .lb{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.path .nm{font-family:var(--f-label);font-weight:700;font-size:1rem;line-height:1.15}
.path .an{font-size:.8rem;color:var(--muted);line-height:1.35}

.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.mcol{border-top:4px solid var(--c);background:var(--surface);border-radius:0 0 8px 8px;padding:14px;min-width:0}
.mcol h3{color:var(--c);display:flex;justify-content:space-between;gap:8px}
.mcol ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.chip{display:flex;gap:10px;align-items:baseline;text-decoration:none;padding:6px 8px;border-radius:5px;background:var(--soft);font-size:.93rem;line-height:1.35}
.chip:hover{outline:1.5px solid var(--c)}
.chip:focus-visible{outline:2px solid var(--c)}
.chip .mono{color:var(--c);flex:none}
.chip.done{text-decoration:line-through;text-decoration-color:var(--muted);opacity:.72}
.tier{display:inline-block;font-family:var(--f-label);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.t1{background:var(--ink);color:var(--bg)}
.t2{border:1.3px solid var(--ink)}
.t3{border:1.3px dashed var(--muted);color:var(--muted)}
.lj{border:1.3px dotted var(--ink);font-style:italic}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip.off{opacity:.35}
#lanjutNote{font-size:.88rem;color:var(--muted);margin-top:8px;max-width:75ch}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:.88rem;color:var(--muted);align-items:center}

.domain-head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;border-bottom:2px solid var(--c);padding-bottom:8px;margin-bottom:14px}
.domain-head h2{color:var(--c)}
.domain-head .w{font-family:var(--f-mono);font-size:1rem;color:var(--c)}
.domain-head p{color:var(--muted);font-size:.92rem;flex-basis:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0;scroll-margin-top:16px}
.card + .card{margin-top:10px}
.card-head{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.toggle{all:unset;cursor:pointer;flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.toggle:focus-visible{outline:2px solid var(--c);outline-offset:4px;border-radius:4px}
.toggle .code{font-family:var(--f-mono);font-size:.8rem;color:var(--c);padding-top:4px;grid-row:span 3}
.toggle .ttl{font-family:var(--f-label);font-size:1.22rem;font-weight:700;line-height:1.2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.toggle .meta{font-size:.82rem;color:var(--muted);font-family:var(--f-label);display:flex;flex-wrap:wrap;gap:4px 12px}
.toggle .sum{font-size:.95rem;color:var(--muted);max-width:75ch}
.caret{font-family:var(--f-mono);color:var(--muted);transition:transform .2s;display:inline-block}
.card.open .caret{transform:rotate(90deg)}
.done-box{flex:none;display:flex;align-items:center;gap:6px;font-family:var(--f-label);font-size:.85rem;color:var(--muted);cursor:pointer;padding-top:3px;user-select:none}
.done-box input{width:18px;height:18px;accent-color:var(--ok);cursor:pointer}
.card.is-done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.body{padding:2px 16px 18px 16px;border-top:1px dashed var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px 26px}
.blk{min-width:0}
.blk.wide{grid-column:1/-1}
.blk h4{font-family:var(--f-label);font-size:.82rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin:14px 0 6px}
.blk ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}
.blk li{font-size:.95rem;line-height:1.55}
.blk li::marker{color:var(--c)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.4}
th{font-family:var(--f-label);font-weight:700;text-align:left;background:var(--soft);color:var(--ink);padding:7px 10px;white-space:nowrap}
td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
.traps{grid-column:1/-1;background:var(--warn-soft);border-radius:6px;padding:12px 14px}
.traps h4{color:var(--warn);margin-top:0}
.traps li::marker{color:var(--warn)}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.note ul{margin:8px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
footer{margin-top:40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:14px}

@media (max-width:480px){
  .wrap{padding-inline:16px}
  .toggle{grid-template-columns:1fr}
  .toggle .code{grid-row:auto;padding-top:0}
  .card-head{flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.home-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:600;font-size:.9rem;color:var(--muted);text-decoration:none;margin-bottom:14px}
.home-link:hover,.home-link:focus-visible{color:var(--ink);text-decoration:underline;outline:none}
</style>

<script>
const MAP = {"id": "pjok", "subject": "Pendidikan Jasmani, Olahraga, dan Kesehatan", "title": "Peta Materi PJOK SMA", "lead": "Seluruh materi PJOK SMA, dari permainan bola dan atletik sampai kebugaran dan kesehatan, disusun sebagai satu peta. Setiap simpul memuat teknik dasar, ukuran dan aturan pokok, serta jebakan soal yang sering muncul. Centang “Dikuasai” di tiap simpul; kemajuan tersimpan di peramban ini saja.", "blurb": "Permainan bola besar dan kecil, atletik, senam, gerak berirama, pencak silat, renang, kebugaran jasmani, cedera, gizi, dan bahaya narkoba.", "source_note": "Domain mengikuti unit buku PJOK Kurikulum Merdeka kelas X (bola basket, sepak bola, bola tangan, bola voli, bulu tangkis, atletik, senam, gerak berirama) ditambah aktivitas air, kebugaran, dan kesehatan yang dipelajari sepanjang kelas X–XII. Ukuran lapangan dan aturan mengikuti federasi internasional; aturan bisa berubah, dan buku sekolah kadang memakai versi lama.", "domains": [{"id": "PBB", "name": "Permainan bola besar", "short": "Bola besar", "note": "Teknik dasar, aturan pokok, dan ukuran lapangan sepak bola, bola voli, bola basket, dan bola tangan.", "topics": [{"code": "PBB-01", "title": "Sepak bola", "scope": "Teknik dasar, aturan, offside", "src": "Kelas X–XII", "tier": 1, "sum": "Permainan dua regu berisi sebelas pemain yang berusaha memasukkan bola ke gawang lawan terutama dengan kaki.", "blocks": [{"h": "Teknik dasar", "li": ["Menendang dengan kaki bagian dalam untuk umpan pendek yang akurat; punggung kaki untuk tendangan keras dan jauh.", "Menghentikan (mengontrol) bola dengan kaki, paha, atau dada; menggiring; menyundul dengan dahi.", "<b>Lemparan ke dalam<\/b>: bola dilempar dengan dua tangan dari belakang kepala, kedua kaki tetap menyentuh tanah."]}, {"h": "Ukuran dan aturan", "table": {"cols": ["Unsur", "Ketentuan"], "rows": [["Pemain", "11 per regu, termasuk penjaga gawang"], ["Waktu", "2 × 45 menit"], ["Gawang", "Lebar 7,32 m, tinggi 2,44 m"], ["Titik penalti", "11 m dari garis gawang"], ["Lapangan internasional", "Panjang 100–110 m, lebar 64–75 m"]]}}, {"h": "Offside", "li": ["Pemain dalam posisi offside bila berada di setengah lapangan lawan dan lebih dekat ke garis gawang lawan daripada bola dan pemain lawan kedua terakhir saat bola dimainkan rekannya.", "Tidak ada offside langsung dari tendangan gawang, lemparan ke dalam, dan tendangan sudut."]}], "traps": ["Pemain lawan kedua terakhir biasanya bek terakhir, karena lawan terakhir umumnya penjaga gawang.", "Berada di posisi offside belum pelanggaran; pelanggaran terjadi bila pemain itu ikut aktif bermain."]}, {"code": "PBB-02", "title": "Bola voli", "scope": "Teknik dasar, rotasi, sistem skor", "src": "Kelas X–XII", "tier": 1, "sum": "Permainan dua regu berisi enam pemain yang memantulkan bola melewati net, dengan sistem rally point.", "blocks": [{"h": "Teknik dasar", "li": ["Servis bawah, servis atas (termasuk float dan jumping).", "<b>Passing bawah<\/b> dengan kedua lengan dirapatkan, untuk menerima servis dan bola rendah; passing atas dengan jari untuk mengumpan.", "Smash (spike) untuk menyerang; bendungan (blok) di depan net untuk menahan serangan."]}, {"h": "Aturan pokok", "table": {"cols": ["Unsur", "Ketentuan"], "rows": [["Pemain", "6 per regu di lapangan"], ["Lapangan", "18 m × 9 m; garis serang 3 m dari net"], ["Tinggi net", "Putra 2,43 m, putri 2,24 m"], ["Sentuhan", "Paling banyak 3 kali per regu, tidak termasuk blok"], ["Skor", "Set 1–4 sampai 25, set penentu sampai 15, selisih minimal 2; menang 3 set"]]}}, {"h": "Rotasi dan libero", "li": ["Regu yang merebut hak servis berputar searah jarum jam.", "Libero adalah pemain bertahan berkaus berbeda yang tidak boleh melakukan servis, smash di atas net, atau blok."]}], "traps": ["Rotasi searah jarum jam dilakukan saat regu merebut servis dari lawan, bukan setiap kali mendapat poin.", "Sentuhan blok tidak dihitung sebagai salah satu dari tiga sentuhan."]}, {"code": "PBB-03", "title": "Bola basket", "scope": "Teknik dasar, aturan waktu, skor", "src": "Kelas X–XII", "tier": 1, "sum": "Permainan dua regu berisi lima pemain yang memasukkan bola ke keranjang lawan dengan tangan.", "blocks": [{"h": "Teknik dasar", "li": ["Operan: dada (chest pass), pantulan (bounce pass), atas kepala (overhead pass).", "Menggiring (dribble) dengan satu tangan; pivot berputar dengan satu kaki tetap.", "<b>Lay up<\/b>: tembakan dekat keranjang setelah dua langkah; jump shot dan free throw untuk menembak dari jauh."]}, {"h": "Aturan FIBA", "table": {"cols": ["Unsur", "Ketentuan"], "rows": [["Pemain", "5 per regu di lapangan"], ["Waktu", "4 × 10 menit"], ["Lapangan", "28 m × 15 m"], ["Tinggi ring", "3,05 m"], ["Nilai tembakan", "Lemparan bebas 1, di dalam garis 3 angka 2, di luar garis 3 angka (6,75 m) 3"], ["Batas waktu", "3 detik di daerah terlarang, 8 detik melewati tengah, 24 detik untuk menembak"]]}}, {"h": "Pelanggaran", "li": ["Traveling: berjalan atau berlari sambil memegang bola tanpa menggiring.", "Double dribble: menggiring lagi setelah berhenti menggiring, atau menggiring dengan dua tangan sekaligus.", "Pemain yang melakukan 5 pelanggaran pribadi harus keluar."]}], "traps": ["Aturan FIBA memakai 4 × 10 menit; 4 × 12 menit adalah aturan liga NBA."]}, {"code": "PBB-04", "title": "Bola tangan", "scope": "Teknik dasar, aturan pokok", "src": "Kelas X", "tier": 2, "sum": "Permainan dua regu berisi tujuh pemain yang mengoper dan melempar bola dengan tangan ke gawang lawan.", "blocks": [{"h": "Teknik dasar", "li": ["Mengoper, menangkap, menggiring dengan memantulkan bola, dan menembak ke gawang, termasuk tembakan sambil melompat."]}, {"h": "Aturan pokok", "table": {"cols": ["Unsur", "Ketentuan"], "rows": [["Pemain", "7 per regu (6 pemain lapangan dan 1 penjaga gawang)"], ["Waktu", "2 × 30 menit"], ["Lapangan", "40 m × 20 m; garis daerah gawang 6 m"], ["Gawang", "Lebar 3 m, tinggi 2 m"], ["Memegang bola", "Paling lama 3 detik dan paling banyak 3 langkah"], ["Hukuman berat", "Lemparan 7 m"]]}}]}]}, {"id": "PBK", "name": "Permainan bola kecil", "short": "Bola kecil", "note": "Teknik dasar dan aturan pokok bulu tangkis dan tenis meja.", "topics": [{"code": "PBK-01", "title": "Bulu tangkis", "scope": "Pegangan, pukulan, skor", "src": "Kelas X–XII", "tier": 1, "sum": "Permainan raket yang memukul kok melewati net, dimainkan tunggal atau ganda dengan sistem rally point 21.", "blocks": [{"h": "Teknik dasar", "li": ["Pegangan: forehand (seperti berjabat tangan) dan backhand.", "Pukulan: lob (tinggi ke belakang), dropshot (jatuh dekat net), <b>smash<\/b> (menukik keras), netting, drive (mendatar).", "Servis pendek sering dipakai di ganda; servis panjang di tunggal."]}, {"h": "Aturan pokok", "table": {"cols": ["Unsur", "Ketentuan"], "rows": [["Skor", "Gim sampai 21, selisih 2; pada 29–29 poin ke-30 menentukan; menang 2 gim"], ["Lapangan", "13,40 m × 6,10 m (ganda); lebar tunggal 5,18 m"], ["Tinggi net", "1,55 m di tiang, 1,524 m di tengah"], ["Servis", "Diagonal; seluruh kok di bawah 1,15 m dari lantai saat dipukul (aturan BWF sejak 2018)"]]}}], "traps": ["Pada tunggal, lapangan servis lebih panjang dan lebih sempit; pada ganda, lebih pendek dan lebih lebar.", "Gim berakhir paling lambat pada poin ke-30, bukan berlanjut tanpa batas."]}, {"code": "PBK-02", "title": "Tenis meja", "scope": "Pegangan, servis, skor", "src": "Kelas X–XII", "tier": 2, "sum": "Permainan memukul bola kecil di atas meja yang dibagi net, dengan gim sampai 11 poin.", "blocks": [{"h": "Teknik dasar", "li": ["Pegangan shakehand (seperti berjabat tangan) dan penhold (seperti memegang pena).", "Pukulan: push, drive, chop, dan smash; servis forehand dan backhand.", "<b>Servis<\/b>: bola dilambungkan hampir tegak lurus dari telapak tangan terbuka setinggi minimal 16 cm, lalu dipukul memantul dulu di meja sendiri."]}, {"h": "Aturan pokok", "table": {"cols": ["Unsur", "Ketentuan"], "rows": [["Skor", "Gim sampai 11, selisih 2"], ["Pergantian servis", "Setiap 2 poin; setiap 1 poin bila skor 10–10"], ["Meja", "274 cm × 152,5 cm, tinggi 76 cm"], ["Net", "Tinggi 15,25 cm"], ["Bola", "Diameter 40 mm"]]}}]}]}, {"id": "ATL", "name": "Atletik", "short": "Atletik", "note": "Nomor lari, lompat, dan lempar beserta teknik dan peraturannya.", "topics": [{"code": "ATL-01", "title": "Lari", "scope": "Jarak pendek, menengah, jauh, estafet", "src": "Kelas X–XII", "tier": 1, "sum": "Nomor lari dibedakan menurut jarak dan jenis startnya, ditambah lari estafet yang menuntut teknik pergantian tongkat.", "blocks": [{"h": "Nomor lari", "table": {"cols": ["Jenis", "Jarak", "Start"], "rows": [["Jarak pendek (sprint)", "100, 200, 400 m", "Start jongkok"], ["Jarak menengah", "800, 1.500 m", "Start berdiri"], ["Jarak jauh", "5.000, 10.000 m, maraton 42,195 km", "Start berdiri"], ["Estafet", "4 × 100 m, 4 × 400 m", "Pelari pertama start jongkok"]]}}, {"h": "Teknik", "li": ["Aba-aba start jongkok: bersedia, siap, lalu bunyi pistol atau ya.", "Variasi start jongkok: pendek (bunch), menengah (medium), panjang (elongated), menurut jarak lutut ke kaki depan.", "Estafet 4 × 100 m memakai penerimaan tanpa melihat (nonvisual); 4 × 400 m dengan melihat (visual).", "<b>Pemberian tongkat<\/b>: dari bawah ke atas (upsweep) atau dari atas ke bawah (downsweep), di dalam zona pergantian."]}], "traps": ["Pelari estafet yang memberi tongkat di luar zona pergantian didiskualifikasi, walau kedua pelari cepat."]}, {"code": "ATL-02", "title": "Lompat", "scope": "Lompat jauh, tinggi, jangkit", "src": "Kelas X–XII", "tier": 1, "sum": "Nomor lompat diukur dari jarak atau tinggi lompatan, dengan rangkaian awalan, tumpuan, melayang, dan mendarat.", "blocks": [{"h": "Lompat jauh", "li": ["Tahap: awalan, tolakan di papan tumpu, sikap melayang, mendarat.", "Gaya melayang: jongkok (tuck), menggantung (hang style), berjalan di udara (walking in the air).", "Jarak diukur dari batas papan tumpu ke bekas pendaratan terdekat dengan papan tumpu."]}, {"h": "Lompat tinggi dan jangkit", "li": ["Gaya lompat tinggi: gunting, guling sisi (western roll), guling perut (straddle), dan flop (Fosbury flop) yang melewati mistar dengan punggung.", "<b>Lompat jangkit<\/b> (triple jump): jingkat (hop), langkah (step), lompat (jump); jingkat mendarat dengan kaki yang sama dengan kaki tolakan."]}], "traps": ["Lompat jauh diukur dari batas papan tumpu, bukan dari tempat kaki benar-benar menolak."]}, {"code": "ATL-03", "title": "Lempar", "scope": "Tolak peluru, lembing, cakram", "src": "Kelas X–XII", "tier": 2, "sum": "Nomor lempar mencakup tolak peluru, lempar lembing, dan lempar cakram, masing-masing dengan alat dan teknik khusus.", "blocks": [{"h": "Tolak peluru", "li": ["<b>Peluru ditolak (didorong) dari bahu<\/b>, bukan dilempar; dilakukan dalam lingkaran berdiameter 2,135 m.", "Gaya menyamping (ortodoks) dan membelakangi (O'Brien).", "Berat peluru senior: putra 7,26 kg, putri 4 kg."]}, {"h": "Alat lempar senior", "table": {"cols": ["Nomor", "Putra", "Putri"], "rows": [["Lembing", "800 g", "600 g"], ["Cakram", "2 kg", "1 kg"], ["Peluru", "7,26 kg", "4 kg"]]}}], "traps": ["Tolak peluru adalah gerakan mendorong; peluru yang dilempar seperti melempar bola dinyatakan tidak sah."]}]}, {"id": "SEN", "name": "Senam, gerak berirama, dan bela diri", "short": "Senam", "note": "Senam lantai, aktivitas gerak berirama, dan pencak silat.", "topics": [{"code": "SEN-01", "title": "Senam lantai", "scope": "Guling, meroda, kayang, handstand", "src": "Kelas X–XII", "tier": 1, "sum": "Senam lantai dilakukan di atas matras tanpa alat bantu, dengan gerakan guling, keseimbangan, dan tumpuan tangan.", "blocks": [{"h": "Gerakan", "li": ["Guling depan (roll depan) dan guling belakang dengan dagu dirapatkan ke dada.", "<b>Meroda<\/b> (radschlag/cartwheel): berguling ke samping bertumpu pada kedua tangan bergantian.", "Kayang: tubuh melenting ke belakang membentuk busur, bertumpu pada tangan dan kaki.", "Handstand (berdiri dengan tangan), sikap lilin, guling lenting (neck kip)."]}, {"h": "Keselamatan", "li": ["Pemanasan dulu, pakai matras, dan minta bantuan teman (spotter) saat belajar gerakan baru."]}], "traps": ["Pada guling depan, tengkuk yang menyentuh matras, bukan ubun-ubun kepala."]}, {"code": "SEN-02", "title": "Aktivitas gerak berirama", "scope": "Senam aerobik, irama, hitungan", "src": "Kelas X–XII", "tier": 2, "sum": "Gerak berirama memadukan langkah dan ayunan lengan dengan iringan musik, seperti senam aerobik dan senam kreasi.", "blocks": [{"h": "Unsur", "li": ["Kelenturan, kesinambungan gerak, dan ketepatan dengan irama; hitungan umumnya 2 × 8.", "Langkah dasar: langkah biasa, langkah rapat, langkah keseimbangan, langkah depan, langkah samping.", "<b>Aerobik low impact<\/b>: satu kaki selalu menapak lantai; high impact ada gerakan melompat."]}, {"h": "Rangkaian", "li": ["Pemanasan, inti, pendinginan; intensitas naik perlahan lalu turun perlahan."]}]}, {"code": "SEN-03", "title": "Pencak silat", "scope": "Aspek, teknik dasar, sejarah", "src": "Kelas X–XII", "tier": 3, "sum": "Bela diri asli Indonesia yang memadukan aspek mental spiritual, seni budaya, bela diri, dan olahraga.", "blocks": [{"h": "Konsep", "li": ["Empat aspek: mental spiritual, seni budaya, bela diri, olahraga.", "Ikatan Pencak Silat Indonesia (IPSI) didirikan 18 Mei 1948 di Surakarta.", "<b>Tradisi pencak silat<\/b> ditetapkan UNESCO sebagai Warisan Budaya Takbenda pada 12 Desember 2019."]}, {"h": "Teknik dasar", "li": ["Kuda-kuda, sikap pasang, pola langkah, pukulan, tendangan (depan, samping, sabit), tangkisan, elakan."]}]}]}, {"id": "AIR", "name": "Aktivitas air", "short": "Renang", "note": "Gaya renang dan keselamatan di air.", "topics": [{"code": "AIR-01", "title": "Gaya renang", "scope": "Bebas, dada, punggung, kupu-kupu", "src": "Kelas X–XII", "tier": 1, "sum": "Empat gaya renang resmi beserta gerakan kaki, lengan, pernapasan, dan urutannya dalam nomor gaya ganti.", "blocks": [{"h": "Gaya", "table": {"cols": ["Gaya", "Ciri"], "rows": [["Bebas (crawl)", "Tubuh telungkup, kaki naik turun bergantian, napas dengan menoleh ke samping"], ["Dada (katak)", "Kaki menendang seperti katak, lengan menyapu ke samping"], ["Punggung", "Tubuh telentang; start dari dalam air"], ["Kupu-kupu", "Kedua lengan diayun bersamaan, kaki seperti ekor lumba-lumba"]]}}, {"h": "Gaya ganti", "li": ["<b>Gaya ganti perorangan<\/b>: kupu-kupu, punggung, dada, bebas.", "Gaya ganti estafet: punggung, dada, kupu-kupu, bebas (gaya punggung pertama karena startnya dari dalam air).", "Kolam ukuran olimpiade panjangnya 50 m."]}], "traps": ["Urutan gaya ganti perorangan dan estafet berbeda; jangan menukar keduanya."]}, {"code": "AIR-02", "title": "Keselamatan dan pertolongan di air", "scope": "Pertolongan, RJP", "src": "Kelas X–XII", "tier": 2, "sum": "Cara menolong orang yang tenggelam dengan aman dan memberi bantuan hidup dasar.", "blocks": [{"h": "Menolong", "li": ["Utamakan pertolongan dari darat: raih (dengan tongkat atau galah), lempar (pelampung atau tali), dayung (perahu); berenang menolong adalah pilihan terakhir.", "Panggil bantuan dan jangan berenang di area tanpa pengawas."]}, {"h": "Bantuan hidup dasar", "li": ["Periksa respons dan napas, panggil bantuan, lalu lakukan resusitasi jantung paru (RJP).", "<b>RJP dewasa<\/b>: 30 kompresi dada lalu 2 napas bantuan; kedalaman 5–6 cm, kecepatan 100–120 kali per menit."]}]}]}, {"id": "KBG", "name": "Kebugaran jasmani", "short": "Kebugaran", "note": "Komponen kebugaran, prinsip latihan, dan cara mengukurnya.", "topics": [{"code": "KBG-01", "title": "Komponen kebugaran jasmani", "scope": "Komponen kesehatan dan keterampilan", "src": "Kelas X–XII", "tier": 1, "sum": "Kebugaran jasmani adalah kemampuan melakukan kegiatan sehari-hari tanpa kelelahan berarti; komponennya terkait kesehatan dan keterampilan.", "blocks": [{"h": "Komponen", "table": {"cols": ["Kelompok", "Komponen", "Contoh latihan"], "rows": [["Kesehatan", "Daya tahan jantung-paru", "Lari jarak jauh, bersepeda"], ["Kesehatan", "Kekuatan dan daya tahan otot", "Push up, sit up, back up, pull up"], ["Kesehatan", "Kelenturan", "Sit and reach, peregangan"], ["Kesehatan", "Komposisi tubuh", "Diukur dengan IMT"], ["Keterampilan", "Kecepatan", "Lari cepat 30–60 m"], ["Keterampilan", "Kelincahan", "Lari bolak-balik (shuttle run), zig-zag"], ["Keterampilan", "Keseimbangan, koordinasi, daya ledak (power), waktu reaksi", "Berdiri satu kaki, lompat tegak"]]}}, {"h": "Indeks massa tubuh", "li": ["<b>IMT = berat badan (kg) ÷ tinggi badan² (m²)<\/b>; contoh 60 kg dan 1,60 m: IMT ≈ 23,4."]}], "traps": ["Kelincahan adalah kemampuan mengubah arah dengan cepat; kecepatan adalah menempuh jarak dalam waktu sesingkat-singkatnya.", "Daya ledak (power) menggabungkan kekuatan dan kecepatan, misalnya lompat tegak."]}, {"code": "KBG-02", "title": "Prinsip latihan", "scope": "FITT, beban lebih, denyut nadi", "src": "Kelas X–XII", "tier": 1, "sum": "Latihan kebugaran yang baik mengikuti prinsip beban lebih, progresif, spesifik, individual, dan teratur, dengan takaran FITT.", "blocks": [{"h": "Prinsip", "li": ["Beban lebih (overload): beban sedikit di atas kemampuan saat ini, dinaikkan bertahap (progresif).", "Spesifik: latihan sesuai komponen yang ingin ditingkatkan; individual: sesuai kondisi tiap orang.", "Reversibel: hasil latihan menurun bila latihan berhenti.", "Setiap sesi terdiri atas pemanasan, latihan inti, dan pendinginan."]}, {"h": "Takaran latihan", "li": ["<b>FITT<\/b>: frequency (frekuensi), intensity (intensitas), time (durasi), type (jenis).", "Denyut nadi maksimal (DNM) diperkirakan 220 − usia; umur 16 tahun: 204 kali per menit.", "Zona latihan aerobik umumnya sekitar 60–85% DNM; batas persisnya berbeda antarbuku."]}], "traps": ["220 − usia adalah perkiraan denyut nadi maksimal, bukan target saat berlatih."]}, {"code": "KBG-03", "title": "Tes kebugaran jasmani", "scope": "TKJI, lari 12 menit, MFT", "src": "Kelas X–XII", "tier": 2, "sum": "Kebugaran diukur dengan rangkaian tes baku seperti TKJI, atau tes daya tahan seperti lari 12 menit dan multistage fitness test.", "blocks": [{"h": "TKJI usia 16–19 tahun", "table": {"cols": ["Butir tes", "Mengukur"], "rows": [["Lari 60 m", "Kecepatan"], ["Gantung angkat tubuh 60 detik (putra), gantung siku tekuk (putri)", "Kekuatan dan daya tahan otot lengan dan bahu"], ["Baring duduk 60 detik", "Kekuatan dan daya tahan otot perut"], ["Loncat tegak", "Daya ledak otot tungkai"], ["Lari 1.200 m (putra), 1.000 m (putri)", "Daya tahan jantung-paru"]]}}, {"h": "Tes lain", "li": ["Lari 12 menit (tes Cooper) dan multistage fitness test (bleep test) mengukur daya tahan jantung-paru (VO₂ maks)."]}]}]}, {"id": "KES", "name": "Kesehatan", "short": "Kesehatan", "note": "Cedera olahraga dan P3K, gizi dan pola hidup sehat, bahaya narkoba, serta penyakit menular.", "topics": [{"code": "KES-01", "title": "Cedera olahraga dan P3K", "scope": "Jenis cedera, RICE", "src": "Kelas X–XII", "tier": 1, "sum": "Mengenali cedera yang sering terjadi saat berolahraga dan memberi pertolongan pertama yang tepat.", "blocks": [{"h": "Jenis cedera", "table": {"cols": ["Cedera", "Keterangan"], "rows": [["Sprain (keseleo)", "Ligamen sendi teregang atau robek"], ["Strain", "Otot atau tendon teregang atau robek"], ["Memar", "Pembuluh darah kecil pecah akibat benturan"], ["Kram", "Otot berkontraksi terus tanpa kendali"], ["Dislokasi", "Tulang bergeser dari sendinya"], ["Patah tulang (fraktur)", "Tulang retak atau patah; pasang bidai, jangan diluruskan paksa"]]}}, {"h": "Penanganan", "li": ["<b>RICE<\/b>: rest (istirahatkan), ice (kompres dingin), compression (balut tekan), elevation (tinggikan bagian yang cedera).", "Jangan memijat atau mengompres panas cedera baru, karena dapat menambah bengkak."]}], "traps": ["Sprain mengenai ligamen; strain mengenai otot atau tendon.", "Cedera baru dikompres dingin, bukan panas."]}, {"code": "KES-02", "title": "Gizi dan pola hidup sehat", "scope": "Gizi seimbang, Isi Piringku, istirahat", "src": "Kelas X–XII", "tier": 2, "sum": "Pola hidup sehat menggabungkan gizi seimbang, aktivitas fisik teratur, istirahat cukup, dan kebersihan diri.", "blocks": [{"h": "Gizi", "li": ["Zat gizi makro: karbohidrat, protein, lemak; mikro: vitamin dan mineral; ditambah air.", "<b>Isi Piringku<\/b> (Kemenkes): setengah piring sayur dan buah, setengah lagi makanan pokok dan lauk-pauk.", "Batasi gula, garam, dan lemak; minum air putih yang cukup."]}, {"h": "Kebiasaan", "li": ["Aktivitas fisik teratur, tidur cukup, cuci tangan, dan tidak merokok."]}]}, {"code": "KES-03", "title": "Bahaya narkoba, rokok, dan alkohol", "scope": "NAPZA, golongan, dampak", "src": "Kelas X–XII", "tier": 1, "sum": "NAPZA (narkotika, psikotropika, dan zat adiktif) merusak kesehatan fisik dan mental serta menimbulkan ketergantungan.", "blocks": [{"h": "Penggolongan", "li": ["<b>Narkotika<\/b> diatur UU No. 35 Tahun 2009: golongan I (heroin, kokain, ganja, metamfetamin atau sabu), golongan II (morfin, petidin), golongan III (kodein).", "Golongan I hanya untuk penelitian, tidak untuk pengobatan; golongan III paling ringan potensi ketergantungannya.", "Psikotropika diatur UU No. 5 Tahun 1997; zat adiktif lain termasuk nikotin (rokok), alkohol, dan inhalan (lem)."]}, {"h": "Dampak dan pencegahan", "li": ["Dampak: kerusakan otak, jantung, paru, dan hati; gangguan mental; masalah hukum dan sosial; penularan HIV lewat jarum suntik bersama.", "Pencegahan: menolak tegas, memilih pergaulan sehat, kegiatan positif, dan mencari bantuan konselor atau layanan rehabilitasi."]}], "traps": ["Sabu (metamfetamin) termasuk narkotika golongan I menurut UU No. 35 Tahun 2009, bukan psikotropika."]}, {"code": "KES-04", "title": "Penyakit menular dan pergaulan sehat", "scope": "HIV/AIDS, penularan, pencegahan", "src": "Kelas XI–XII", "tier": 2, "sum": "Penyakit menular seperti HIV/AIDS dapat dicegah dengan memahami cara penularannya dan menjaga pergaulan yang sehat.", "blocks": [{"h": "HIV/AIDS", "li": ["<b>HIV<\/b> adalah virus yang menyerang kekebalan tubuh; AIDS adalah kumpulan gejala pada tahap lanjut infeksi HIV.", "Menular lewat darah, cairan kelamin, dan air susu ibu, misalnya jarum suntik bergantian dan hubungan seksual tanpa pelindung.", "Tidak menular lewat jabat tangan, berpelukan, berbagi alat makan, berenang bersama, atau gigitan nyamuk."]}, {"h": "Pergaulan sehat", "li": ["Menghargai diri dan orang lain, menolak tekanan teman sebaya, dan mencari informasi dari tenaga kesehatan.", "Orang dengan HIV berhak mendapat perlakuan yang sama; stigma menghambat orang memeriksakan diri."]}]}]}], "notes": [{"title": "Perlu diperhatikan", "items": ["Aturan servis bulu tangkis: buku lama menyebut kok dipukul di bawah pinggang (aturan lama BWF: di bawah tulang rusuk terbawah); sejak 2018 BWF memakai batas tinggi tetap 1,15 m dari lantai.", "Zona pergantian estafet 4 × 100 m: buku lama menyebut zona 20 m ditambah daerah percepatan 10 m; sejak 2018 World Athletics (dulu IAAF) menggabungkannya menjadi satu zona 30 m. Ikuti buku sekolah saat ujian.", "Batas IMT berbeda: WHO memakai normal 18,5–24,9, sedangkan pedoman Kemenkes memakai normal 18,5–25,0 dengan kategori gemuk 25,1–27,0.", "Ukuran lapangan sepak bola memakai rentang untuk pertandingan internasional; aturan IFAB membolehkan rentang yang lebih lebar untuk pertandingan lain.", "Zona latihan aerobik dan butir TKJI berbeda sedikit antarbuku; cocokkan dengan buku sekolah."]}, {"title": "Rujukan", "items": ["Buku PJOK SMA kelas X Kurikulum Merdeka (Kemendikbudristek): daftar unit dari ringkasan sekunder; PDF resminya tidak dapat dibuka dari lingkungan kerja ini.", "Peraturan permainan IFAB (sepak bola), FIVB (bola voli), FIBA (bola basket), IHF (bola tangan), BWF (bulu tangkis), ITTF (tenis meja), dan World Athletics.", "UU No. 35 Tahun 2009 tentang Narkotika; UU No. 5 Tahun 1997 tentang Psikotropika; pedoman Isi Piringku Kemenkes; pedoman RJP American Heart Association."]}], "bank": "bank-pjok.html"};
const TIER = {1:["t1","Inti"],2:["t2","Penting"],3:["t3","Pelengkap"]};
const tags = t => '<span class="tier ' + TIER[t.tier][0] + '">' + TIER[t.tier][1] + '</span>' + (t.lanjut ? ' <span class="tier lj">Lanjut</span>' : '');
let onlyLanjut = false;
const KEY = "peta-" + MAP.id + "-v1";
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch(e) {} }
const $ = id => document.getElementById(id);
// The text faces lack most Unicode superscript/subscript digits, so turn runs of them into <sup>/<sub>.
const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺", SUB = "₀₁₂₃₄₅₆₇₈₉", PLAIN = "0123456789-+";
function scripts(s){
  return s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g, m => "<sup>" + [...m].map(c => PLAIN[SUP.indexOf(c)]).join("").replace("-", "−") + "</sup>")
          .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, m => "<sub>" + [...m].map(c => PLAIN[SUB.indexOf(c)]).join("") + "</sub>");
}
(function walk(o){ for(const k in o){ if(typeof o[k] === "string") o[k] = scripts(o[k]); else if(o[k] && typeof o[k] === "object") walk(o[k]); } })(MAP);
const byCode = {};
MAP.domains.forEach((d,i) => { d.c = "var(--d" + (i % 7 + 1) + ")"; d.soft = "var(--s" + (i % 7 + 1) + ")"; d.topics.forEach(t => byCode[t.code] = {t, d}); });

function hl(str, re){
  if(!re) return str;
  return str.split(/(<[^>]+>)/g).map(p => p.startsWith("<") ? p : p.replace(re, m => "<mark>" + m + "</mark>")).join("");
}
function plain(t){
  const parts = [t.code, t.title, t.scope, t.src, t.sum, t.lanjut ? "Tingkat Lanjut" : ""];
  t.blocks.forEach(b => { parts.push(b.h); (b.li||[]).forEach(x => parts.push(x)); if(b.table){ parts.push(b.table.cols.join(" ")); b.table.rows.forEach(r => parts.push(r.join(" "))); } });
  (t.traps||[]).forEach(x => parts.push(x));
  return parts.join(" ").replace(/<[^>]+>/g, " ");
}
function bodyHTML(t, re){
  let h = "";
  t.blocks.forEach(b => {
    h += '<div class="blk' + (b.wide || (b.table && b.table.cols.length > 2) ? ' wide' : '') + '"><h4>' + hl(b.h, re) + '</h4>';
    if(b.li) h += "<ul>" + b.li.map(x => "<li>" + hl(x, re) + "</li>").join("") + "</ul>";
    if(b.table) h += '<div class="tbl"><table><thead><tr>' + b.table.cols.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>" +
      b.table.rows.map(r => "<tr>" + r.map(c => "<td>" + hl(c, re) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
    h += "</div>";
  });
  if(t.traps && t.traps.length) h += '<div class="traps"><h4>Jebakan soal</h4><ul>' + t.traps.map(x => "<li>" + hl(x, re) + "</li>").join("") + "</ul></div>";
  return h;
}

function render(){
  const total = Object.keys(byCode).length;
  document.title = MAP.title;
  $("eyebrow").textContent = "Peta materi · " + MAP.subject + " · " + MAP.domains.length + " bidang · " + total + " simpul";
  $("title").textContent = MAP.title;
  $("lead").innerHTML = MAP.lead + (MAP.bank ? ' <a href="' + MAP.bank + '">Latih dengan bank soal →</a>' : "");
  $("sourceNote").textContent = MAP.source_note || "";
  $("progress").innerHTML = MAP.domains.map(d => '<a class="pg" href="#d-' + d.id + '" style="--c:' + d.c + '"><b>' + d.short + '</b><div class="bar"><i id="bar-' + d.id + '"></i></div><span id="pg-' + d.id + '"></span></a>').join("");
  if(MAP.path && MAP.path.length){
    $("alur").hidden = false;
    $("h-alur").textContent = MAP.path_title || "Alur belajar";
    $("pathNote").textContent = MAP.path_note || "";
    $("path").innerHTML = MAP.path.map(e => '<li><button type="button" data-code="' + e.to + '"><span class="lb">' + e.label + '</span><span class="nm">' + e.title + '</span><span class="an">' + e.note + '</span></button></li>').join("");
  }
  const map = $("map"), host = $("domains");
  MAP.domains.forEach(d => {
    const col = document.createElement("div");
    col.className = "mcol"; col.style.setProperty("--c", d.c); col.style.setProperty("--soft", d.soft);
    col.innerHTML = '<h3><span>' + d.name + '</span><span class="mono">' + d.topics.length + '</span></h3><ul>' +
      d.topics.map(t => '<li><a class="chip" data-code="' + t.code + '" href="#t-' + t.code + '"><span class="mono">' + t.code + '</span><span>' + t.title + ' ' + tags(t) + '</span></a></li>').join("") + "</ul>";
    map.appendChild(col);
    const sec = document.createElement("section");
    sec.id = "d-" + d.id; sec.style.setProperty("--c", d.c); sec.style.setProperty("--soft", d.soft);
    sec.innerHTML = '<div class="domain-head"><h2>' + d.name + '</h2><span class="w">' + d.topics.length + ' simpul</span><p>' + (d.note || "") + '</p></div>';
    d.topics.forEach(t => {
      const a = document.createElement("article");
      a.className = "card"; a.id = "t-" + t.code; a.dataset.code = t.code;
      a.innerHTML = '<div class="card-head"><button class="toggle" type="button" aria-expanded="false" aria-controls="b-' + t.code + '">' +
        '<span class="code">' + t.code + '</span>' +
        '<span class="ttl"><span class="caret" aria-hidden="true">›</span>' + t.title + ' ' + tags(t) + '</span>' +
        '<span class="meta"><span>' + t.scope + '</span><span>' + t.src + '</span></span>' +
        '<span class="sum">' + t.sum + '</span></button>' +
        '<label class="done-box"><input type="checkbox" id="done-' + t.code + '"> Dikuasai</label></div>' +
        '<div class="body" id="b-' + t.code + '" hidden>' + bodyHTML(t, null) + '</div>';
      sec.appendChild(a);
    });
    host.appendChild(sec);
  });
  if(Object.values(byCode).some(x => x.t.lanjut)){
    $("lanjutKey").hidden = false; $("onlyLanjut").hidden = false;
    if(MAP.lanjut_note){ $("lanjutNote").hidden = false; $("lanjutNote").textContent = MAP.lanjut_note; }
  }
  $("notes").innerHTML = (MAP.notes || []).map(n => '<div class="note"><h3>' + n.title + '</h3><ul>' + n.items.map(i => "<li>" + i + "</li>").join("") + "</ul></div>").join("");
}
function setOpen(card, open){
  card.classList.toggle("open", open);
  card.querySelector(".body").hidden = !open;
  card.querySelector(".toggle").setAttribute("aria-expanded", open ? "true" : "false");
}
function goTo(code){
  const card = $("t-" + code); if(!card) return;
  card.hidden = false; setOpen(card, true);
  card.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
}
function progress(){
  let k = 0, n = 0;
  MAP.domains.forEach(d => {
    const dn = d.topics.filter(t => done.has(t.code)).length;
    k += dn; n += d.topics.length;
    $("bar-" + d.id).style.width = (dn / d.topics.length * 100) + "%";
    $("pg-" + d.id).textContent = dn + " dari " + d.topics.length;
  });
  $("overall").textContent = k + " dari " + n;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("done", done.has(c.dataset.code)));
  document.querySelectorAll(".card").forEach(c => { const on = done.has(c.dataset.code); c.classList.toggle("is-done", on); c.querySelector('input[type="checkbox"]').checked = on; });
}
function search(q){
  q = q.trim();
  const re = q.length >= 2 ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi") : null;
  let hits = 0;
  document.querySelectorAll(".card").forEach(card => {
    const t = byCode[card.dataset.code].t, body = card.querySelector(".body");
    const keep = !onlyLanjut || t.lanjut;
    if(!re){ card.hidden = !keep; body.innerHTML = bodyHTML(t, null); setOpen(card, false); return; }
    const match = keep && new RegExp(re.source, "i").test(plain(t));
    card.hidden = !match; body.innerHTML = bodyHTML(t, match ? re : null); setOpen(card, match);
    if(match) hits++;
  });
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("off", onlyLanjut && !byCode[c.dataset.code].t.lanjut));
  $("hits").textContent = re ? (hits ? hits + " simpul cocok" : "Tidak ada yang cocok. Coba kata lain.") : "";
}

render();
progress();
document.addEventListener("click", e => {
  const tg = e.target.closest(".toggle");
  if(tg){ const card = tg.closest(".card"); setOpen(card, !card.classList.contains("open")); return; }
  const chip = e.target.closest("[data-code]");
  if(chip && (chip.classList.contains("chip") || chip.tagName === "BUTTON")){ e.preventDefault(); goTo(chip.dataset.code); }
});
document.addEventListener("change", e => {
  if(e.target.matches(".done-box input")){
    const code = e.target.closest(".card").dataset.code;
    e.target.checked ? done.add(code) : done.delete(code);
    save(); progress();
  }
});
let timer;
$("q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => search(e.target.value), 150); });
$("openAll").addEventListener("click", () => document.querySelectorAll(".card:not([hidden])").forEach(c => setOpen(c, true)));
$("onlyLanjut").addEventListener("click", e => { onlyLanjut = !onlyLanjut; e.target.setAttribute("aria-pressed", String(onlyLanjut)); search($("q").value); });
$("closeAll").addEventListener("click", () => document.querySelectorAll(".card").forEach(c => setOpen(c, false)));
if(location.hash.startsWith("#t-")) goTo(location.hash.slice(3));
</script>
