<style>
/* Layout: generic subject map, same catalogue look as the history map. Domain progress → path strip → map overview → catalogue cards per domain. Content comes from data/maps/<subject>.json. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunk:#E9EBF1; --ink:#1A1F33; --muted:#585E73; --line:#D6DAE3;
  --d1:#2B3A78; --d2:#8A5526; --d3:#2C6B63; --d4:#6E3466; --d5:#5A6420; --d6:#9A3B1F; --d7:#3D5A80;
  --s1:#E4E8F6; --s2:#F3E9DF; --s3:#DFEFEC; --s4:#F1E3EE; --s5:#ECEEDC; --s6:#F8E6DF; --s7:#E2E9F2;
  --mark:#F6DE8D; --warn:#9A3B1F; --warn-soft:#F8E6DF; --ok:#2C6B3F;
  --f-label:"Archivo Narrow","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131A; --surface:#191C26; --sunk:#222634; --ink:#E7E9F0; --muted:#A3A9BC; --line:#2E3345;
  --d1:#A3B1F2; --d2:#E0A974; --d3:#76C7B9; --d4:#D9A0CF; --d5:#C3CC7E; --d6:#F0A58A; --d7:#9DBBE0;
  --s1:#232A47; --s2:#33271C; --s3:#1C3330; --s4:#33202F; --s5:#2A2D1A; --s6:#3A221B; --s7:#1F2A3A;
  --mark:#6D5A1C; --warn:#F0A58A; --warn-soft:#3A221B; --ok:#8FD3A2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131A; --surface:#191C26; --sunk:#222634; --ink:#E7E9F0; --muted:#A3A9BC; --line:#2E3345;
  --d1:#A3B1F2; --d2:#E0A974; --d3:#76C7B9; --d4:#D9A0CF; --d5:#C3CC7E; --d6:#F0A58A; --d7:#9DBBE0;
  --s1:#232A47; --s2:#33271C; --s3:#1C3330; --s4:#33202F; --s5:#2A2D1A; --s6:#3A221B; --s7:#1F2A3A;
  --mark:#6D5A1C; --warn:#F0A58A; --warn-soft:#3A221B; --ok:#8FD3A2; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-label);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.65rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
a{color:inherit}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
sub,sup{line-height:0}
.eyebrow{font-family:var(--f-label);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.82em}
.lead{max-width:66ch;color:var(--muted);font-size:1.05rem;margin-top:12px}
section{margin-top:44px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:16px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.sec-head p{color:var(--muted);font-size:.95rem;max-width:62ch}

.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px;margin-top:22px}
.pg{display:flex;flex-direction:column;gap:5px;text-decoration:none;min-width:0}
.pg b{font-family:var(--f-label);font-size:.92rem;color:var(--c)}
.pg .bar{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden;position:relative}
.pg .bar i{position:absolute;inset:0 auto 0 0;background:var(--c);width:0;transition:width .3s}
.pg .bar::after{content:"";position:absolute;inset:0;border:1.5px solid var(--c);border-radius:2px}
.pg span{font-size:.78rem;color:var(--muted);font-family:var(--f-label)}
.pg:focus-visible{outline:2px solid var(--c);outline-offset:3px}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:0 12px}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:10px 0;outline:none}
.btn{font-family:var(--f-label);font-weight:600;font-size:.92rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#hits{font-size:.9rem;color:var(--muted);font-family:var(--f-label)}
.overall{font-family:var(--f-label);font-size:.95rem;color:var(--muted);margin-top:10px}
.overall b{color:var(--ink);font-variant-numeric:tabular-nums}

.path-wrap{overflow-x:auto;padding-bottom:6px}
.path{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(130px,1fr);min-width:max-content}
.path li{border-top:2px solid var(--ink);padding:0 10px 0 0;position:relative}
.path li::before{content:"";position:absolute;left:0;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.path button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding-top:14px;max-width:16em}
.path button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.path .lb{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.path .nm{font-family:var(--f-label);font-weight:700;font-size:1rem;line-height:1.15}
.path .an{font-size:.8rem;color:var(--muted);line-height:1.35}

.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.mcol{border-top:4px solid var(--c);background:var(--surface);border-radius:0 0 8px 8px;padding:14px;min-width:0}
.mcol h3{color:var(--c);display:flex;justify-content:space-between;gap:8px}
.mcol ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.chip{display:flex;gap:10px;align-items:baseline;text-decoration:none;padding:6px 8px;border-radius:5px;background:var(--soft);font-size:.93rem;line-height:1.35}
.chip:hover{outline:1.5px solid var(--c)}
.chip:focus-visible{outline:2px solid var(--c)}
.chip .mono{color:var(--c);flex:none}
.chip.done{text-decoration:line-through;text-decoration-color:var(--muted);opacity:.72}
.tier{display:inline-block;font-family:var(--f-label);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.t1{background:var(--ink);color:var(--bg)}
.t2{border:1.3px solid var(--ink)}
.t3{border:1.3px dashed var(--muted);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:.88rem;color:var(--muted);align-items:center}

.domain-head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;border-bottom:2px solid var(--c);padding-bottom:8px;margin-bottom:14px}
.domain-head h2{color:var(--c)}
.domain-head .w{font-family:var(--f-mono);font-size:1rem;color:var(--c)}
.domain-head p{color:var(--muted);font-size:.92rem;flex-basis:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0;scroll-margin-top:16px}
.card + .card{margin-top:10px}
.card-head{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.toggle{all:unset;cursor:pointer;flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.toggle:focus-visible{outline:2px solid var(--c);outline-offset:4px;border-radius:4px}
.toggle .code{font-family:var(--f-mono);font-size:.8rem;color:var(--c);padding-top:4px;grid-row:span 3}
.toggle .ttl{font-family:var(--f-label);font-size:1.22rem;font-weight:700;line-height:1.2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.toggle .meta{font-size:.82rem;color:var(--muted);font-family:var(--f-label);display:flex;flex-wrap:wrap;gap:4px 12px}
.toggle .sum{font-size:.95rem;color:var(--muted);max-width:75ch}
.caret{font-family:var(--f-mono);color:var(--muted);transition:transform .2s;display:inline-block}
.card.open .caret{transform:rotate(90deg)}
.done-box{flex:none;display:flex;align-items:center;gap:6px;font-family:var(--f-label);font-size:.85rem;color:var(--muted);cursor:pointer;padding-top:3px;user-select:none}
.done-box input{width:18px;height:18px;accent-color:var(--ok);cursor:pointer}
.card.is-done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.body{padding:2px 16px 18px 16px;border-top:1px dashed var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px 26px}
.blk{min-width:0}
.blk.wide{grid-column:1/-1}
.blk h4{font-family:var(--f-label);font-size:.82rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin:14px 0 6px}
.blk ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}
.blk li{font-size:.95rem;line-height:1.55}
.blk li::marker{color:var(--c)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.4}
th{font-family:var(--f-label);font-weight:700;text-align:left;background:var(--soft);color:var(--ink);padding:7px 10px;white-space:nowrap}
td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
.traps{grid-column:1/-1;background:var(--warn-soft);border-radius:6px;padding:12px 14px}
.traps h4{color:var(--warn);margin-top:0}
.traps li::marker{color:var(--warn)}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.note ul{margin:8px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
footer{margin-top:40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:14px}

@media (max-width:480px){
  .wrap{padding-inline:16px}
  .toggle{grid-template-columns:1fr}
  .toggle .code{grid-row:auto;padding-top:0}
  .card-head{flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.home-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:600;font-size:.9rem;color:var(--muted);text-decoration:none;margin-bottom:14px}
.home-link:hover,.home-link:focus-visible{color:var(--ink);text-decoration:underline;outline:none}
</style>

ai pemulihan", "to": "BEN-02"}, {"label": "Wilayah", "title": "Wilayah dan interaksi", "note": "Gravitasi, titik henti", "to": "WIL-01"}], "domains": [{"id": "DAS", "name": "Dasar geografi dan alat spasial", "short": "Dasar", "note": "Konsep, pendekatan, peta, penginderaan jauh, SIG, dan penelitian geografi.", "topics": [{"code": "DAS-01", "title": "Konsep dasar geografi", "scope": "Objek, pendekatan, prinsip, konsep esensial", "src": "Kelas X", "tier": 1, "sum": "Objek kajian geografi, tiga pendekatan, empat prinsip, dan sepuluh konsep esensial beserta contoh penerapannya.", "blocks": [{"h": "Objek dan pendekatan", "li": ["Objek material: geosfer (litosfer, atmosfer, hidrosfer, biosfer, antroposfer, pedosfer); objek formal: cara pandang keruangan, kelingkungan, kewilayahan.", "Pendekatan: <b>keruangan<\/b> (persebaran dan lokasi), kelingkungan/ekologi (interaksi manusia–lingkungan), kompleks wilayah (gabungan keduanya)."]}, {"h": "Prinsip geografi", "table": {"cols": ["Prinsip", "Isi"], "rows": [["Persebaran", "Gejala tersebar tidak merata di permukaan bumi"], ["Interelasi", "Hubungan antargejala di suatu ruang"], ["Deskripsi", "Menjelaskan gejala lebih jauh dengan data, peta, diagram"], ["Korologi", "Gabungan ketiganya: persebaran, interelasi, dan deskripsi dalam satu ruang"]]}}, {"h": "Konsep esensial", "table": {"cols": ["Konsep", "Contoh"], "rows": [["Lokasi (absolut dan relatif)", "Koordinat; dekat pelabuhan"], ["Jarak dan keterjangkauan", "Desa terpencil sulit dijangkau kendaraan"], ["Pola dan morfologi", "Permukiman memanjang mengikuti jalan atau sungai"], ["Aglomerasi", "Industri mengelompok di kawasan industri"], ["Nilai kegunaan", "Pantai bernilai bagi wisatawan dan nelayan secara berbeda"], ["Interaksi interdependensi", "Desa memasok pangan, kota memasok barang industri"], ["Diferensiasi area", "Dataran tinggi menanam sayur, dataran rendah padi"], ["Keterkaitan keruangan", "Hutan gundul di hulu, banjir di hilir"]]}}], "traps": ["Lokasi absolut memakai garis lintang dan bujur; lokasi relatif bergantung pada daerah sekitarnya.", "Aglomerasi adalah pengelompokan, sedangkan pola adalah bentuk sebaran (memanjang, memusat, tersebar)."]}, {"code": "DAS-02", "title": "Peta dan pemetaan", "scope": "Komponen, skala, proyeksi", "src": "Kelas X", "tier": 1, "sum": "Komponen peta, jenis skala dan cara menghitung jarak sebenarnya, jenis peta, serta proyeksi peta.", "blocks": [{"h": "Komponen dan jenis", "li": ["Komponen: judul, skala, legenda, orientasi (arah utara), simbol, sumber, tahun pembuatan, inset, garis astronomis, proyeksi.", "Peta umum (topografi, korografi) dan peta tematik (curah hujan, kepadatan penduduk).", "Simbol titik, garis, dan area; simbol kualitatif dan kuantitatif."]}, {"h": "Skala", "li": ["Skala numerik (1 : 50.000), skala garis (batang), skala verbal (1 cm = 0,5 km).", "<b>Jarak sebenarnya = jarak di peta × penyebut skala<\/b>.", "Contoh: 4 cm pada peta 1 : 250.000 = 1.000.000 cm = 10 km.", "Skala besar (penyebut kecil, misalnya 1 : 5.000) lebih rinci untuk wilayah sempit."]}, {"h": "Proyeksi", "table": {"cols": ["Bidang proyeksi", "Ciri", "Cocok untuk"], "rows": [["Bidang datar (azimutal)", "Benar di titik singgung", "Daerah kutub"], ["Silinder (Mercator)", "Garis lintang dan bujur tegak lurus; daerah lintang tinggi tampak membesar", "Daerah khatulistiwa, navigasi"], ["Kerucut", "Benar di sepanjang garis singgung", "Daerah lintang tengah"]]}}], "traps": ["Skala 1 : 5.000 lebih besar daripada 1 : 50.000; makin kecil penyebut, makin besar skala.", "Ubah satuan dulu sebelum menjawab: 1 km = 100.000 cm."]}, {"code": "DAS-03", "title": "Penginderaan jauh", "scope": "Komponen, citra, interpretasi", "src": "Kelas X", "tier": 1, "sum": "Cara memperoleh informasi tanpa menyentuh objek: komponen sistem, jenis citra, unsur interpretasi, dan pemanfaatannya.", "blocks": [{"h": "Komponen", "li": ["Sumber tenaga (matahari pada sistem pasif, tenaga buatan seperti radar pada sistem aktif), atmosfer, interaksi dengan objek, sensor, wahana, perolehan data, pengguna.", "Wahana: satelit (Landsat, SPOT), pesawat udara, dan pesawat nirawak (drone).", "Citra foto (kamera) dan citra nonfoto (penyiam/scanner, radar)."]}, {"h": "Unsur interpretasi citra", "table": {"cols": ["Unsur", "Contoh"], "rows": [["Rona dan warna", "Air jernih gelap; awan cerah"], ["Bentuk dan ukuran", "Stadion berbentuk oval; rumah lebih kecil dari pabrik"], ["Tekstur", "Hutan kasar, sawah halus"], ["Pola", "Perkebunan teratur; permukiman berjajar sepanjang jalan"], ["Bayangan", "Membantu mengenali menara atau cerobong"], ["Situs dan asosiasi", "Tambak di tepi pantai; stasiun bersama rel kereta"]]}}, {"h": "Skala citra", "li": ["Skala foto udara = f : H (panjang fokus kamera : tinggi terbang di atas permukaan), dalam satuan yang sama.", "Contoh: f = 15 cm, H = 3.000 m = 300.000 cm, skala 1 : 20.000."]}], "traps": ["Radar termasuk sistem aktif karena memancarkan tenaganya sendiri, sehingga dapat merekam pada malam hari dan menembus awan.", "Rona adalah tingkat kecerahan pada citra hitam-putih; warna dipakai pada citra berwarna."]}, {"code": "DAS-04", "title": "Sistem informasi geografis", "scope": "Komponen, data, analisis", "src": "Kelas X", "tier": 1, "sum": "SIG mengolah data bereferensi geografis: komponennya, jenis data spasial, tahap kerja, dan analisis seperti tumpang susun dan buffer.", "blocks": [{"h": "Komponen dan data", "li": ["Komponen: perangkat keras, perangkat lunak, data, manusia (brainware), dan metode.", "Data spasial: <b>vektor<\/b> (titik, garis, poligon) dan raster (piksel/sel); data atribut berupa tabel keterangan.", "Subsistem: masukan data, penyimpanan dan manipulasi, analisis, keluaran."]}, {"h": "Analisis", "li": ["Tumpang susun (overlay): menggabungkan beberapa peta tematik, misalnya kesesuaian lahan dari peta lereng, tanah, dan curah hujan.", "Buffer: membuat zona dengan jarak tertentu dari objek, misalnya sempadan sungai 50 m.", "Query: memilih data berdasarkan syarat atribut; analisis jaringan untuk rute terpendek."]}], "traps": ["Buffer membuat zona di sekitar objek; overlay menggabungkan beberapa lapisan peta."]}, {"code": "DAS-05", "title": "Penelitian geografi", "scope": "Langkah, sampel, data", "src": "Kelas X", "tier": 3, "sum": "Langkah penelitian geografi, jenis data dan cara pengumpulannya, serta teknik pengambilan sampel wilayah.", "blocks": [{"h": "Langkah dan data", "li": ["Langkah: merumuskan masalah, tujuan, kajian pustaka, hipotesis, mengumpulkan data, mengolah dan menganalisis, menyimpulkan.", "Data primer (observasi lapangan, wawancara, kuesioner) dan sekunder (BPS, peta, citra).", "Sampel wilayah: acak, sistematis, bertingkat (stratified), atau berdasarkan tujuan (purposive)."]}]}]}, {"id": "GEO", "name": "Dinamika geosfer", "short": "Geosfer", "note": "Gejala litosfer, pedosfer, atmosfer, dan hidrosfer serta dampaknya bagi kehidupan.", "topics": [{"code": "GEO-01", "title": "Litosfer", "scope": "Batuan, tenaga endogen dan eksogen", "src": "Kelas X", "tier": 1, "sum": "Batuan penyusun litosfer, tenaga endogen (tektonisme, vulkanisme, seisme) dan eksogen (pelapukan, erosi, sedimentasi), serta bentuk muka bumi hasilnya.", "blocks": [{"h": "Batuan", "table": {"cols": ["Jenis", "Terbentuk dari", "Contoh"], "rows": [["Beku", "Pembekuan magma", "Granit, basalt, obsidian"], ["Sedimen", "Endapan hasil pelapukan dan erosi", "Batu pasir, batu kapur, konglomerat"], ["Metamorf", "Perubahan batuan karena suhu dan tekanan tinggi", "Marmer (dari batu kapur), batu sabak"]]}}, {"h": "Tenaga endogen", "li": ["Tektonisme: orogenesa (pembentukan pegunungan, cepat, wilayah sempit) dan epirogenesa (lambat, wilayah luas); hasilnya lipatan dan patahan (horst, graben).", "Vulkanisme: intrusi magma (batolit, lakolit, sill, gang/dike, diatrema) dan ekstrusi; gunung strato, perisai, maar.", "Seisme: gempa tektonik, vulkanik, runtuhan; hiposentrum di dalam bumi, episentrum di permukaan tepat di atasnya.", "Gelombang gempa: primer (P, paling cepat), sekunder (S), dan permukaan (L)."]}, {"h": "Tenaga eksogen", "li": ["Pelapukan fisik (mekanis), kimia, dan biologis.", "Erosi oleh air (ablasi), angin (deflasi/korasi), gletser (eksarasi), gelombang laut (abrasi).", "Sedimentasi menghasilkan delta, gumuk pasir, tanggul alam, dan endapan lainnya."]}, {"h": "Rumus Laska", "li": ["<b>Δ = ((S − P) − 1′) × 1.000 km<\/b>; S − P dalam menit (selisih datangnya gelombang S dan P).", "Contoh: selisih 3 menit 20 detik, Δ = (3′20″ − 1′) × 1.000 km = 2′20″ × 1.000 km ≈ 2.333 km."]}], "traps": ["Episentrum ada di permukaan bumi; hiposentrum (fokus) ada di dalam bumi.", "Abrasi adalah pengikisan oleh gelombang laut, sedangkan ablasi pengikisan oleh air mengalir."]}, {"code": "GEO-02", "title": "Pedosfer", "scope": "Pembentukan, profil, jenis tanah", "src": "Kelas X", "tier": 2, "sum": "Faktor pembentuk tanah, profil tanah, jenis tanah di Indonesia, serta erosi tanah dan konservasinya.", "blocks": [{"h": "Pembentukan dan profil", "li": ["Faktor pembentuk: bahan induk, iklim, organisme, topografi, waktu.", "Profil tanah: horizon O (organik), A (topsoil), B (subsoil), C (bahan induk lapuk), R (batuan induk)."]}, {"h": "Jenis tanah", "table": {"cols": ["Tanah", "Asal dan sifat"], "rows": [["Aluvial", "Endapan sungai; subur, banyak di dataran rendah"], ["Andosol (vulkanis)", "Abu gunung api; sangat subur"], ["Latosol", "Pelapukan batuan di daerah lembap; kemerahan"], ["Podzolik", "Daerah curah hujan tinggi; kurang subur"], ["Organosol (gambut)", "Bahan organik tergenang; asam"]]}}, {"h": "Konservasi", "li": ["Metode mekanik: terasering, guludan, rorak, cek dam.", "Metode vegetatif: penanaman sejajar kontur (contour strip cropping), reboisasi, rotasi tanaman, tanaman penutup tanah."]}]}, {"code": "GEO-03", "title": "Atmosfer dan iklim", "scope": "Lapisan, unsur cuaca, iklim", "src": "Kelas X", "tier": 1, "sum": "Lapisan atmosfer, unsur cuaca dan iklim, angin muson, serta klasifikasi iklim Köppen, Schmidt–Ferguson, dan Oldeman.", "blocks": [{"h": "Lapisan atmosfer", "table": {"cols": ["Lapisan", "Ketinggian kira-kira", "Ciri"], "rows": [["Troposfer", "0–12 km (8 km di kutub, 16–18 km di khatulistiwa)", "Gejala cuaca; suhu turun dengan ketinggian"], ["Stratosfer", "12–50 km", "Lapisan ozon menyerap ultraviolet"], ["Mesosfer", "50–80 km", "Meteor terbakar; suhu terendah"], ["Termosfer", "80–500 km", "Ionosfer memantulkan gelombang radio"], ["Eksosfer", "Di atas 500 km", "Peralihan ke antariksa"]]}}, {"h": "Suhu dan angin", "li": ["Rumus Braak: <b>T = 26,3 °C − 0,6 h<\/b>, h dalam ratusan meter (hektometer); suhu turun sekitar 0,6 °C tiap naik 100 m.", "Contoh: kota pada 1.500 m: T = 26,3 − 0,6 × 15 = 17,3 °C.", "Angin bertiup dari tekanan tinggi ke tekanan rendah; angin muson barat (Oktober–April) membawa hujan, muson timur (April–Oktober) kering di Indonesia."]}, {"h": "Klasifikasi iklim", "table": {"cols": ["Sistem", "Dasar", "Catatan"], "rows": [["Köppen", "Suhu dan curah hujan", "A tropis, B kering, C sedang, D dingin, E kutub"], ["Schmidt–Ferguson", "Q = rata-rata bulan kering : rata-rata bulan basah × 100%", "Bulan kering &lt;60 mm, basah &gt;100 mm; tipe A–H"], ["Oldeman", "Bulan basah berturut-turut", "Bulan basah &gt;200 mm, kering &lt;100 mm; untuk pertanian"], ["Junghuhn", "Ketinggian tempat", "Zona panas, sedang, sejuk, dingin; tanaman khas"]]}}], "traps": ["Lapisan ozon ada di stratosfer, bukan troposfer.", "Batas bulan basah dan kering Schmidt–Ferguson (100 dan 60 mm) berbeda dari Oldeman (200 dan 100 mm)."]}, {"code": "GEO-04", "title": "Hidrosfer", "scope": "Siklus air, DAS, air tanah, laut", "src": "Kelas X", "tier": 1, "sum": "Siklus hidrologi, perairan darat (sungai, DAS, danau, air tanah, rawa), perairan laut, dan pelestariannya.", "blocks": [{"h": "Siklus hidrologi", "li": ["Siklus pendek: penguapan dari laut, kondensasi, hujan langsung di laut.", "Siklus sedang: uap terbawa angin ke darat, hujan di darat, mengalir kembali ke laut.", "Siklus panjang: uap menjadi salju atau es di pegunungan, mencair, lalu mengalir ke laut."]}, {"h": "Perairan darat", "li": ["<b>Daerah aliran sungai (DAS)<\/b>: wilayah yang dibatasi punggung bukit, menampung dan mengalirkan air hujan ke sungai utama; bagian hulu, tengah, hilir.", "Pola aliran: dendritik, radial sentrifugal (gunung), radial sentripetal (cekungan), trellis, rektangular, annular.", "Air tanah: akuifer bebas dan tertekan; sumur artesis memancar karena akuifer tertekan.", "Danau tektonik (Toba, Poso), vulkanik (Kelimutu), tekto-vulkanik, karst, buatan (waduk)."]}, {"h": "Laut", "li": ["Zona laut menurut kedalaman: litoral, neritik (sampai 200 m), batial, abisal.", "Batas wilayah laut menurut UNCLOS 1982: laut teritorial 12 mil, zona tambahan 24 mil, ZEE 200 mil dari garis pangkal.", "Arus laut, pasang surut (dipengaruhi gaya tarik Bulan dan Matahari), salinitas."]}], "traps": ["ZEE 200 mil memberi hak berdaulat atas sumber daya, bukan kedaulatan penuh seperti laut teritorial.", "Pola radial sentrifugal menyebar dari puncak gunung; sentripetal memusat ke cekungan."]}]}, {"id": "IND", "name": "Indonesia: posisi dan sumber daya", "short": "Indonesia", "note": "Posisi strategis, potensi sumber daya alam, dan keragaman hayati Indonesia.", "topics": [{"code": "IND-01", "title": "Posisi strategis Indonesia", "scope": "Astronomis, geografis, geologis", "src": "Kelas XI", "tier": 1, "sum": "Letak astronomis, geografis, dan geologis Indonesia serta pengaruhnya terhadap iklim, kekayaan alam, kerawanan bencana, dan hubungan internasional.", "blocks": [{"h": "Letak", "table": {"cols": ["Letak", "Keterangan", "Pengaruh"], "rows": [["Astronomis", "Sekitar 6° LU–11° LS dan 95° BT–141° BT", "Iklim tropis; tiga zona waktu WIB, WITA, WIT"], ["Geografis", "Antara Benua Asia dan Australia, Samudra Hindia dan Pasifik", "Jalur perdagangan dunia; iklim muson"], ["Geologis", "Pertemuan Lempeng Indo-Australia, Eurasia, dan Pasifik", "Banyak gunung api, tanah subur, rawan gempa dan tsunami"]]}}, {"h": "Wilayah laut", "li": ["Wawasan Nusantara dan Deklarasi Djuanda (13 Desember 1957) menjadikan laut di antara pulau bagian wilayah Indonesia; diakui UNCLOS 1982.", "Tiga <b>Alur Laut Kepulauan Indonesia (ALKI)<\/b> menjadi jalur pelayaran internasional (PP No. 37 Tahun 2002).", "Selat Malaka termasuk jalur pelayaran tersibuk dunia."]}], "traps": ["Letak astronomis menentukan iklim tropis; letak geografis menentukan muson dan jalur perdagangan.", "Zona waktu Indonesia: WIB UTC+7, WITA UTC+8, WIT UTC+9."]}, {"code": "IND-02", "title": "Potensi sumber daya alam", "scope": "Persebaran dan pengelolaan", "src": "Kelas XI", "tier": 1, "sum": "Jenis sumber daya alam, persebarannya di Indonesia, dan prinsip pengelolaan berkelanjutan.", "blocks": [{"h": "Jenis", "li": ["Menurut sifat: dapat diperbarui (hutan, ikan, air), tidak dapat diperbarui (minyak bumi, batu bara, mineral), tidak habis (sinar matahari, angin).", "Menurut asal: hayati dan nonhayati; menurut penggunaan: bahan baku dan energi."]}, {"h": "Persebaran contoh", "table": {"cols": ["Sumber daya", "Contoh daerah"], "rows": [["Batu bara", "Kalimantan Timur, Kalimantan Selatan, Sumatra Selatan"], ["Nikel", "Sulawesi Tenggara, Sulawesi Tengah, Maluku Utara"], ["Timah", "Kepulauan Bangka Belitung"], ["Tembaga dan emas", "Papua (Grasberg), Nusa Tenggara Barat (Batu Hijau)"], ["Panas bumi", "Jalur gunung api: Jawa Barat, Sumatra, Sulawesi Utara"]]}}, {"h": "Pengelolaan", "li": ["Prinsip berkelanjutan: memenuhi kebutuhan kini tanpa mengorbankan generasi mendatang.", "Hilirisasi: mengolah bahan mentah di dalam negeri untuk menambah nilai tambah.", "Pasal 33 ayat (3) UUD 1945: bumi, air, dan kekayaan alam dikuasai negara untuk kemakmuran rakyat."]}], "traps": ["Ikan dan hutan dapat diperbarui, tetapi bisa habis jika dieksploitasi melebihi daya pulihnya."]}, {"code": "IND-03", "title": "Keragaman hayati", "scope": "Flora, fauna, bioma", "src": "Kelas XI", "tier": 2, "sum": "Faktor persebaran flora dan fauna, wilayah fauna Indonesia dengan garis Wallace dan Weber, serta bioma dunia.", "blocks": [{"h": "Faktor persebaran", "li": ["Klimatik (suhu, curah hujan, angin, kelembapan), edafik (tanah), fisiografik (ketinggian, relief), biotik (manusia, hewan)."]}, {"h": "Fauna Indonesia", "table": {"cols": ["Wilayah", "Batas", "Contoh"], "rows": [["Asiatis (barat)", "Di barat garis Wallace", "Harimau, gajah, badak, orang utan"], ["Peralihan (Wallacea)", "Antara garis Wallace dan Weber", "Anoa, babirusa, komodo, maleo"], ["Australis (timur)", "Di timur garis Weber", "Kanguru pohon, kasuari, cenderawasih"]]}}, {"h": "Bioma", "table": {"cols": ["Bioma", "Ciri"], "rows": [["Hutan hujan tropis", "Hujan tinggi sepanjang tahun, keanekaragaman tertinggi"], ["Sabana", "Padang rumput dengan pohon jarang; NTT"], ["Gurun", "Curah hujan sangat rendah"], ["Hutan gugur", "Empat musim, daun gugur di musim dingin"], ["Taiga dan tundra", "Konifer di lintang tinggi; tundra tanpa pohon"]]}}], "traps": ["Garis Wallace memisahkan Kalimantan–Sulawesi dan Bali–Lombok; garis Weber berada di timur Sulawesi dan Nusa Tenggara."]}]}, {"id": "PEN", "name": "Kependudukan dan lingkungan", "short": "Penduduk", "note": "Dinamika dan kualitas penduduk, masalah kependudukan, dan lingkungan hidup.", "topics": [{"code": "PEN-01", "title": "Dinamika penduduk", "scope": "Kelahiran, kematian, migrasi, komposisi", "src": "Kelas XI", "tier": 1, "sum": "Faktor dan rumus pertumbuhan penduduk, ukuran fertilitas dan mortalitas, migrasi, komposisi penduduk, dan piramida penduduk.", "blocks": [{"h": "Rumus", "li": ["Pertumbuhan alami = kelahiran − kematian; pertumbuhan total = (L − M) + (I − E).", "<b>CBR = jumlah kelahiran : jumlah penduduk × 1.000<\/b>; CDR sama dengan jumlah kematian.", "Proyeksi geometrik: P<sub>t<\/sub> = P<sub>0<\/sub>(1 + r)<sup>t<\/sup>.", "Rasio jenis kelamin = laki-laki : perempuan × 100.", "<b>Rasio ketergantungan<\/b> = (penduduk 0–14 tahun + 65 tahun ke atas) : penduduk 15–64 tahun × 100."]}, {"h": "Piramida penduduk", "table": {"cols": ["Bentuk", "Ciri", "Contoh"], "rows": [["Ekspansif (limas)", "Alas lebar, kelahiran tinggi, penduduk muda", "Negara berkembang"], ["Stasioner (granat)", "Kelahiran dan kematian rendah seimbang", "Negara maju"], ["Konstriktif (batu nisan)", "Alas menyempit, kelahiran sangat rendah", "Jepang"]]}}, {"h": "Migrasi dan kepadatan", "li": ["Migrasi: urbanisasi (desa ke kota), transmigrasi (antarpulau dalam negeri), emigrasi, imigrasi; faktor pendorong dan penarik.", "Kepadatan aritmetik = jumlah penduduk : luas wilayah; kepadatan agraris = petani : luas lahan pertanian.", "Bonus demografi: proporsi usia produktif besar sehingga rasio ketergantungan rendah."]}], "traps": ["Rasio ketergantungan membagi usia nonproduktif dengan usia produktif, bukan sebaliknya.", "Transmigrasi berpindah antarpulau di dalam negeri; urbanisasi dari desa ke kota."]}, {"code": "PEN-02", "title": "Kualitas penduduk dan masalahnya", "scope": "IPM, masalah, kebijakan", "src": "Kelas XI", "tier": 2, "sum": "Ukuran kualitas penduduk, masalah kependudukan di Indonesia, dan upaya mengatasinya.", "blocks": [{"h": "Kualitas dan masalah", "li": ["Ukuran kualitas: pendidikan, kesehatan, pendapatan; dirangkum dalam Indeks Pembangunan Manusia (IPM).", "Masalah: persebaran tidak merata (terpusat di Jawa), pertumbuhan tinggi, kualitas rendah, pengangguran, urbanisasi berlebihan.", "Upaya: keluarga berencana, pemerataan pendidikan dan kesehatan, transmigrasi, pembangunan desa."]}, {"h": "Data", "li": ["Data penduduk dihimpun lewat sensus penduduk (terakhir 2020), survei (Susenas, Sakernas), dan registrasi.", "Sebutkan tahun data bila mengutip jumlah atau kepadatan penduduk."]}]}, {"code": "PEN-03", "title": "Lingkungan hidup dan pembangunan berkelanjutan", "scope": "Kerusakan, pelestarian, SDGs", "src": "Kelas XI", "tier": 2, "sum": "Kerusakan lingkungan akibat alam dan manusia, upaya pelestarian, dan konsep pembangunan berkelanjutan.", "blocks": [{"h": "Kerusakan dan pelestarian", "li": ["Penyebab manusia: pembalakan l esiapsiagaan, peringatan dini.", "Saat bencana: tanggap darurat (evakuasi, pencarian, bantuan).", "Pascabencana: rehabilitasi (memulihkan layanan) dan rekonstruksi (membangun kembali)."]}, {"h": "Mitigasi", "li": ["Struktural: bangunan tahan gempa, tanggul, sabo dam, sistem peringatan dini tsunami.", "Nonstruktural: peta rawan bencana, tata ruang, pendidikan dan latihan evakuasi, peraturan.", "Lembaga: BNPB di pusat, BPBD di daerah; BMKG untuk cuaca, iklim, dan gempa; PVMBG untuk gunung api.", "Adaptasi: rumah panggung di daerah banjir, kearifan lokal seperti smong di Simeulue."]}], "traps": ["Membangun kembali rumah termasuk rekonstruksi; memulihkan layanan dasar termasuk rehabilitasi.", "Pelatihan evakuasi termasuk mitigasi nonstruktural."]}]}, {"id": "WIL", "name": "Wilayah dan pembangunan", "short": "Wilayah", "note": "Konsep wilayah, desa dan kota, negara maju dan berkembang, serta globalisasi.", "topics": [{"code": "WIL-01", "title": "Wilayah dan interaksi keruangan", "scope": "Wilayah, pusat pertumbuhan, interaksi", "src": "Kelas XII", "tier": 1, "sum": "Jenis wilayah, teori pusat pertumbuhan, faktor interaksi wilayah, dan cara menghitung kekuatan interaksi serta titik henti.", "blocks": [{"h": "Wilayah dan pusat pertumbuhan", "li": ["Wilayah formal (seragam: wilayah padi) dan fungsional (dihubungkan aktivitas: kota dan daerah sekitarnya).", "Teori tempat sentral Christaller: pusat pelayanan membentuk jaringan heksagonal.", "Teori kutub pertumbuhan Perroux: industri penggerak memicu pertumbuhan sekitarnya."]}, {"h": "Interaksi (Ullman)", "li": ["Saling melengkapi (complementarity), kesempatan berintervensi (intervening opportunity), kemudahan perpindahan (transferability)."]}, {"h": "Rumus", "li": ["<b>Gravitasi: I = k · P<sub>A<\/sub>P<sub>B<\/sub> / d²<\/b>; P jumlah penduduk, d jarak.", "Titik henti (Reilly): D<sub>AB<\/sub> = d<sub>AB<\/sub> / (1 + √(P<sub>B<\/sub>/P<sub>A<\/sub>)), diukur dari kota A.", "Contoh: d = 60 km, P<sub>A<\/sub> = 10.000, P<sub>B<\/sub> = 40.000; D = 60 / (1 + 2) = 20 km dari A.", "Indeks konektivitas β = jumlah jalur (e) : jumlah simpul (v)."]}], "traps": ["Titik henti lebih dekat ke kota yang penduduknya lebih sedikit.", "Kesempatan berintervensi melemahkan interaksi dua wilayah karena ada wilayah ketiga yang memenuhi kebutuhan."]}, {"code": "WIL-02", "title": "Desa dan kota", "scope": "Ciri, struktur kota, interaksi", "src": "Kelas XI–XII", "tier": 1, "sum": "Ciri desa dan kota, potensi desa, teori struktur ruang kota, serta dampak interaksi desa dan kota.", "blocks": [{"h": "Desa", "li": ["Ciri: kepadatan rendah, mata pencaharian agraris, hubungan sosial erat.", "Pola permukiman: memanjang (jalan, sungai, pantai), memusat (mata air, lembah), tersebar."]}, {"h": "Struktur ruang kota", "table": {"cols": ["Teori", "Tokoh", "Bentuk"], "rows": [["Konsentris", "E. W. Burgess", "Lingkaran zona dari pusat (CBD) ke luar"], ["Sektoral", "Homer Hoyt", "Sektor memanjang mengikuti jalur transportasi"], ["Inti ganda", "Harris dan Ullman", "Beberapa pusat kegiatan"]]}}, {"h": "Interaksi", "li": ["Dampak bagi desa: pengetahuan bertambah, tetapi tenaga kerja muda pergi ke kota.", "Dampak bagi kota: pasokan pangan dan tenaga kerja, tetapi kepadatan dan permukiman kumuh."]}], "traps": ["Teori sektoral (Hoyt) berbentuk sektor mengikuti jalur transportasi, bukan cincin seperti Burgess."]}, {"code": "WIL-03", "title": "Negara maju dan berkembang", "scope": "Ciri, interaksi", "src": "Kelas XII", "tier": 2, "sum": "Ciri negara maju dan berkembang menurut ekonomi dan demografi, serta bentuk interaksi dan kerja sama di antara keduanya.", "blocks": [{"h": "Ciri dan interaksi", "li": ["Negara maju: pendapatan per kapita tinggi, sektor industri dan jasa dominan, pertumbuhan penduduk rendah, IPM tinggi.", "Negara berkembang: sektor pertanian masih besar, pertumbuhan penduduk relatif tinggi, ketergantungan pada ekspor bahan mentah.", "Bank Dunia mengelompokkan negara menurut pendapatan nasional bruto per kapita; batasnya diperbarui setiap tahun.", "Interaksi: perdagangan, investasi, bantuan pembangunan, alih teknologi, migrasi tenaga kerja."]}]}, {"code": "WIL-04", "title": "Globalisasi dan kerja sama antarwilayah", "scope": "Dampak, kerja sama", "src": "Kelas XII", "tier": 3, "sum": "Globalisasi dari sudut ruang: arus barang, orang, dan informasi antarwilayah, dampaknya, dan kerja sama yang diikuti Indonesia.", "blocks": [{"h": "Dampak dan kerja sama", "li": ["Pendorong: kemajuan transportasi dan komunikasi, perdagangan bebas.", "Dampak: pertukaran budaya dan teknologi, persaingan produk, ketimpangan antarwilayah.", "Kerja sama: ASEAN, APEC, G20, serta kerja sama perbatasan dan subregional."]}]}]}], "notes": [{"title": "Perlu diperhatikan", "items": ["Kelas X Kurikulum Merdeka membahas geografi di dalam IPS. Dinamika litosfer, pedosfer, atmosfer, dan hidrosfer berasal dari kurikulum sebelumnya tetapi masih muncul di TKA 2025.", "Batas koordinat Indonesia ditulis berbeda antarbuku (misalnya 6° LU atau 6°08′ LU); ikuti buku sekolah.", "Ketinggian lapisan atmosfer adalah perkiraan dan berbeda antarbuku.", "Data penduduk, IPM, dan batas kelompok pendapatan negara berubah tiap tahun; sebutkan tahun data saat mengutip."]}, {"title": "Rujukan", "items": ["Buku teks Geografi Kurikulum Merdeka kelas XI dan XII (Kemendikbudristek). Daftar bab dicocokkan lewat ringkasan Mamikos, Ruangguru, dan Detik karena PDF resmi tidak dapat dibuka dari lingkungan kerja.", "Elemen dan subelemen soal TKA 2025 Geografi (data/tka/tka-geografi-pilihan-2025.json).", "UU No. 24 Tahun 2007 (Penanggulangan Bencana), UU No. 32 Tahun 2009 (Lingkungan Hidup), PP No. 37 Tahun 2002 (ALKI), UNCLOS 1982."]}]};
const TIER = {1:["t1","Inti"],2:["t2","Penting"],3:["t3","Pelengkap"]};
const KEY = "peta-" + MAP.id + "-v1";
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch(e) {} }
const $ = id => document.getElementById(id);
// The text faces lack most Unicode superscript/subscript digits, so turn runs of them into <sup>/<sub>.
const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺", SUB = "₀₁₂₃₄₅₆₇₈₉", PLAIN = "0123456789-+";
function scripts(s){
  return s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g, m => "<sup>" + [...m].map(c => PLAIN[SUP.indexOf(c)]).join("").replace("-", "−") + "</sup>")
          .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, m => "<sub>" + [...m].map(c => PLAIN[SUB.indexOf(c)]).join("") + "</sub>");
}
(function walk(o){ for(const k in o){ if(typeof o[k] === "string") o[k] = scripts(o[k]); else if(o[k] && typeof o[k] === "object") walk(o[k]); } })(MAP);
const byCode = {};
MAP.domains.forEach((d,i) => { d.c = "var(--d" + (i % 7 + 1) + ")"; d.soft = "var(--s" + (i % 7 + 1) + ")"; d.topics.forEach(t => byCode[t.code] = {t, d}); });

function hl(str, re){
  if(!re) return str;
  return str.split(/(<[^>]+>)/g).map(p => p.startsWith("<") ? p : p.replace(re, m => "<mark>" + m + "</mark>")).join("");
}
function plain(t){
  const parts = [t.code, t.title, t.scope, t.src, t.sum];
  t.blocks.forEach(b => { parts.push(b.h); (b.li||[]).forEach(x => parts.push(x)); if(b.table){ parts.push(b.table.cols.join(" ")); b.table.rows.forEach(r => parts.push(r.join(" "))); } });
  (t.traps||[]).forEach(x => parts.push(x));
  return parts.join(" ").replace(/<[^>]+>/g, " ");
}
function bodyHTML(t, re){
  let h = "";
  t.blocks.forEach(b => {
    h += '<div class="blk' + (b.wide || (b.table && b.table.cols.length > 2) ? ' wide' : '') + '"><h4>' + hl(b.h, re) + '</h4>';
    if(b.li) h += "<ul>" + b.li.map(x => "<li>" + hl(x, re) + "</li>").join("") + "</ul>";
    if(b.table) h += '<div class="tbl"><table><thead><tr>' + b.table.cols.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>" +
      b.table.rows.map(r => "<tr>" + r.map(c => "<td>" + hl(c, re) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
    h += "</div>";
  });
  if(t.traps && t.traps.length) h += '<div class="traps"><h4>Jebakan soal</h4><ul>' + t.traps.map(x => "<li>" + hl(x, re) + "</li>").join("") + "</ul></div>";
  return h;
}

function render(){
  const total = Object.keys(byCode).length;
  document.title = MAP.title;
  $("eyebrow").textContent = "Peta materi · " + MAP.subject + " · " + MAP.domains.length + " bidang · " + total + " simpul";
  $("title").textContent = MAP.title;
  $("lead").innerHTML = MAP.lead;
  $("sourceNote").textContent = MAP.source_note || "";
  $("progress").innerHTML = MAP.domains.map(d => '<a class="pg" href="#d-' + d.id + '" style="--c:' + d.c + '"><b>' + d.short + '</b><div class="bar"><i id="bar-' + d.id + '"></i></div><span id="pg-' + d.id + '"></span></a>').join("");
  if(MAP.path && MAP.path.length){
    $("alur").hidden = false;
    $("h-alur").textContent = MAP.path_title || "Alur belajar";
    $("pathNote").textContent = MAP.path_note || "";
    $("path").innerHTML = MAP.path.map(e => '<li><button type="button" data-code="' + e.to + '"><span class="lb">' + e.label + '</span><span class="nm">' + e.title + '</span><span class="an">' + e.note + '</span></button></li>').join("");
  }
  const map = $("map"), host = $("domains");
  MAP.domains.forEach(d => {
    const col = document.createElement("div");
    col.className = "mcol"; col.style.setProperty("--c", d.c); col.style.setProperty("--soft", d.soft);
    col.innerHTML = '<h3><span>' + d.name + '</span><span class="mono">' + d.topics.length + '</span></h3><ul>' +
      d.topics.map(t => '<li><a class="chip" data-code="' + t.code + '" href="#t-' + t.code + '"><span class="mono">' + t.code + '</span><span>' + t.title + ' <span class="tier ' + TIER[t.tier][0] + '">' + TIER[t.tier][1] + '</span></span></a></li>').join("") + "</ul>";
    map.appendChild(col);
    const sec = document.createElement("section");
    sec.id = "d-" + d.id; sec.style.setProperty("--c", d.c); sec.style.setProperty("--soft", d.soft);
    sec.innerHTML = '<div class="domain-head"><h2>' + d.name + '</h2><span class="w">' + d.topics.length + ' simpul</span><p>' + (d.note || "") + '</p></div>';
    d.topics.forEach(t => {
      const a = document.createElement("article");
      a.className = "card"; a.id = "t-" + t.code; a.dataset.code = t.code;
      a.innerHTML = '<div class="card-head"><button class="toggle" type="button" aria-expanded="false" aria-controls="b-' + t.code + '">' +
        '<span class="code">' + t.code + '</span>' +
        '<span class="ttl"><span class="caret" aria-hidden="true">›</span>' + t.title + ' <span class="tier ' + TIER[t.tier][0] + '">' + TIER[t.tier][1] + '</span></span>' +
        '<span class="meta"><span>' + t.scope + '</span><span>' + t.src + '</span></span>' +
        '<span class="sum">' + t.sum + '</span></button>' +
        '<label class="done-box"><input type="checkbox" id="done-' + t.code + '"> Dikuasai</label></div>' +
        '<div class="body" id="b-' + t.code + '" hidden>' + bodyHTML(t, null) + '</div>';
      sec.appendChild(a);
    });
    host.appendChild(sec);
  });
  $("notes").innerHTML = (MAP.notes || []).map(n => '<div class="note"><h3>' + n.title + '</h3><ul>' + n.items.map(i => "<li>" + i + "</li>").join("") + "</ul></div>").join("");
}
function setOpen(card, open){
  card.classList.toggle("open", open);
  card.querySelector(".body").hidden = !open;
  card.querySelector(".toggle").setAttribute("aria-expanded", open ? "true" : "false");
}
function goTo(code){
  const card = $("t-" + code); if(!card) return;
  card.hidden = false; setOpen(card, true);
  card.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
}
function progress(){
  let k = 0, n = 0;
  MAP.domains.forEach(d => {
    const dn = d.topics.filter(t => done.has(t.code)).length;
    k += dn; n += d.topics.length;
    $("bar-" + d.id).style.width = (dn / d.topics.length * 100) + "%";
    $("pg-" + d.id).textContent = dn + " dari " + d.topics.length;
  });
  $("overall").textContent = k + " dari " + n;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("done", done.has(c.dataset.code)));
  document.querySelectorAll(".card").forEach(c => { const on = done.has(c.dataset.code); c.classList.toggle("is-done", on); c.querySelector('input[type="checkbox"]').checked = on; });
}
function search(q){
  q = q.trim();
  const re = q.length >= 2 ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi") : null;
  let hits = 0;
  document.querySelectorAll(".card").forEach(card => {
    const t = byCode[card.dataset.code].t, body = card.querySelector(".body");
    if(!re){ card.hidden = false; body.innerHTML = bodyHTML(t, null); setOpen(card, false); return; }
    const match = new RegExp(re.source, "i").test(plain(t));
    card.hidden = !match; body.innerHTML = bodyHTML(t, match ? re : null); setOpen(card, match);
    if(match) hits++;
  });
  $("hits").textContent = re ? (hits ? hits + " simpul cocok" : "Tidak ada yang cocok. Coba kata lain.") : "";
}

render();
progress();
document.addEventListener("click", e => {
  const tg = e.target.closest(".toggle");
  if(tg){ const card = tg.closest(".card"); setOpen(card, !card.classList.contains("open")); return; }
  const chip = e.target.closest("[data-code]");
  if(chip && (chip.classList.contains("chip") || chip.tagName === "BUTTON")){ e.preventDefault(); goTo(chip.dataset.code); }
});
document.addEventListener("change", e => {
  if(e.target.matches(".done-box input")){
    const code = e.target.closest(".card").dataset.code;
    e.target.checked ? done.add(code) : done.delete(code);
    save(); progress();
  }
});
let timer;
$("q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => search(e.target.value), 150); });
$("openAll").addEventListener("click", () => document.querySelectorAll(".card:not([hidden])").forEach(c => setOpen(c, true)));
$("closeAll").addEventListener("click", () => document.querySelectorAll(".card").forEach(c => setOpen(c, false)));
if(location.hash.startsWith("#t-")) goTo(location.hash.slice(3));
</script>
