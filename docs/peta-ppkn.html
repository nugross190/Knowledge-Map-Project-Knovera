<style>
/* Layout: generic subject map, same catalogue look as the history map. Domain progress → path strip → map overview → catalogue cards per domain. Content comes from data/maps/<subject>.json. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunk:#E9EBF1; --ink:#1A1F33; --muted:#585E73; --line:#D6DAE3;
  --d1:#2B3A78; --d2:#8A5526; --d3:#2C6B63; --d4:#6E3466; --d5:#5A6420; --d6:#9A3B1F; --d7:#3D5A80;
  --s1:#E4E8F6; --s2:#F3E9DF; --s3:#DFEFEC; --s4:#F1E3EE; --s5:#ECEEDC; --s6:#F8E6DF; --s7:#E2E9F2;
  --mark:#F6DE8D; --warn:#9A3B1F; --warn-soft:#F8E6DF; --ok:#2C6B3F;
  --f-label:"Archivo Narrow","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131A; --surface:#191C26; --sunk:#222634; --ink:#E7E9F0; --muted:#A3A9BC; --line:#2E3345;
  --d1:#A3B1F2; --d2:#E0A974; --d3:#76C7B9; --d4:#D9A0CF; --d5:#C3CC7E; --d6:#F0A58A; --d7:#9DBBE0;
  --s1:#232A47; --s2:#33271C; --s3:#1C3330; --s4:#33202F; --s5:#2A2D1A; --s6:#3A221B; --s7:#1F2A3A;
  --mark:#6D5A1C; --warn:#F0A58A; --warn-soft:#3A221B; --ok:#8FD3A2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11131A; --surface:#191C26; --sunk:#222634; --ink:#E7E9F0; --muted:#A3A9BC; --line:#2E3345;
  --d1:#A3B1F2; --d2:#E0A974; --d3:#76C7B9; --d4:#D9A0CF; --d5:#C3CC7E; --d6:#F0A58A; --d7:#9DBBE0;
  --s1:#232A47; --s2:#33271C; --s3:#1C3330; --s4:#33202F; --s5:#2A2D1A; --s6:#3A221B; --s7:#1F2A3A;
  --mark:#6D5A1C; --warn:#F0A58A; --warn-soft:#3A221B; --ok:#8FD3A2; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-label);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.65rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
a{color:inherit}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
sub,sup{line-height:0}
.eyebrow{font-family:var(--f-label);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.82em}
.lead{max-width:66ch;color:var(--muted);font-size:1.05rem;margin-top:12px}
section{margin-top:44px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:16px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.sec-head p{color:var(--muted);font-size:.95rem;max-width:62ch}

.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px;margin-top:22px}
.pg{display:flex;flex-direction:column;gap:5px;text-decoration:none;min-width:0}
.pg b{font-family:var(--f-label);font-size:.92rem;color:var(--c)}
.pg .bar{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden;position:relative}
.pg .bar i{position:absolute;inset:0 auto 0 0;background:var(--c);width:0;transition:width .3s}
.pg .bar::after{content:"";position:absolute;inset:0;border:1.5px solid var(--c);border-radius:2px}
.pg span{font-size:.78rem;color:var(--muted);font-family:var(--f-label)}
.pg:focus-visible{outline:2px solid var(--c);outline-offset:3px}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:0 12px}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:10px 0;outline:none}
.btn{font-family:var(--f-label);font-weight:600;font-size:.92rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#hits{font-size:.9rem;color:var(--muted);font-family:var(--f-label)}
.overall{font-family:var(--f-label);font-size:.95rem;color:var(--muted);margin-top:10px}
.overall b{color:var(--ink);font-variant-numeric:tabular-nums}

.path-wrap{overflow-x:auto;padding-bottom:6px}
.path{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(130px,1fr);min-width:max-content}
.path li{border-top:2px solid var(--ink);padding:0 10px 0 0;position:relative}
.path li::before{content:"";position:absolute;left:0;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.path button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding-top:14px;max-width:16em}
.path button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.path .lb{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.path .nm{font-family:var(--f-label);font-weight:700;font-size:1rem;line-height:1.15}
.path .an{font-size:.8rem;color:var(--muted);line-height:1.35}

.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.mcol{border-top:4px solid var(--c);background:var(--surface);border-radius:0 0 8px 8px;padding:14px;min-width:0}
.mcol h3{color:var(--c);display:flex;justify-content:space-between;gap:8px}
.mcol ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.chip{display:flex;gap:10px;align-items:baseline;text-decoration:none;padding:6px 8px;border-radius:5px;background:var(--soft);font-size:.93rem;line-height:1.35}
.chip:hover{outline:1.5px solid var(--c)}
.chip:focus-visible{outline:2px solid var(--c)}
.chip .mono{color:var(--c);flex:none}
.chip.done{text-decoration:line-through;text-decoration-color:var(--muted);opacity:.72}
.tier{display:inline-block;font-family:var(--f-label);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.t1{background:var(--ink);color:var(--bg)}
.t2{border:1.3px solid var(--ink)}
.t3{border:1.3px dashed var(--muted);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:.88rem;color:var(--muted);align-items:center}

.domain-head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;border-bottom:2px solid var(--c);padding-bottom:8px;margin-bottom:14px}
.domain-head h2{color:var(--c)}
.domain-head .w{font-family:var(--f-mono);font-size:1rem;color:var(--c)}
.domain-head p{color:var(--muted);font-size:.92rem;flex-basis:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0;scroll-margin-top:16px}
.card + .card{margin-top:10px}
.card-head{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.toggle{all:unset;cursor:pointer;flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.toggle:focus-visible{outline:2px solid var(--c);outline-offset:4px;border-radius:4px}
.toggle .code{font-family:var(--f-mono);font-size:.8rem;color:var(--c);padding-top:4px;grid-row:span 3}
.toggle .ttl{font-family:var(--f-label);font-size:1.22rem;font-weight:700;line-height:1.2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.toggle .meta{font-size:.82rem;color:var(--muted);font-family:var(--f-label);display:flex;flex-wrap:wrap;gap:4px 12px}
.toggle .sum{font-size:.95rem;color:var(--muted);max-width:75ch}
.caret{font-family:var(--f-mono);color:var(--muted);transition:transform .2s;display:inline-block}
.card.open .caret{transform:rotate(90deg)}
.done-box{flex:none;display:flex;align-items:center;gap:6px;font-family:var(--f-label);font-size:.85rem;color:var(--muted);cursor:pointer;padding-top:3px;user-select:none}
.done-box input{width:18px;height:18px;accent-color:var(--ok);cursor:pointer}
.card.is-done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.body{padding:2px 16px 18px 16px;border-top:1px dashed var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px 26px}
.blk{min-width:0}
.blk.wide{grid-column:1/-1}
.blk h4{font-family:var(--f-label);font-size:.82rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin:14px 0 6px}
.blk ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}
.blk li{font-size:.95rem;line-height:1.55}
.blk li::marker{color:var(--c)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.4}
th{font-family:var(--f-label);font-weight:700;text-align:left;background:var(--soft);color:var(--ink);padding:7px 10px;white-space:nowrap}
td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
.traps{grid-column:1/-1;background:var(--warn-soft);border-radius:6px;padding:12px 14px}
.traps h4{color:var(--warn);margin-top:0}
.traps li::marker{color:var(--warn)}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.note ul{margin:8px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
footer{margin-top:40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:14px}

@media (max-width:480px){
  .wrap{padding-inline:16px}
  .toggle{grid-template-columns:1fr}
  .toggle .code{grid-row:auto;padding-top:0}
  .card-head{flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.home-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:600;font-size:.9rem;color:var(--muted);text-decoration:none;margin-bottom:14px}
.home-link:hover,.home-link:focus-visible{color:var(--ink);text-decoration:underline;outline:none}
</style>

lu", "note": "Asas dan pemilih pemula", "to": "NKR-05"}], "domains": [{"id": "PAN", "name": "Pancasila", "short": "Pancasila", "note": "Perumusan, kedudukan, makna sila, dan hak asasi manusia dalam perspektif Pancasila.", "topics": [{"code": "PAN-01", "title": "Perumusan dan pengesahan Pancasila", "scope": "BPUPK, Panitia Sembilan, PPKI", "src": "Kelas X", "tier": 1, "sum": "Sidang BPUPK, usulan dasar negara, Piagam Jakarta, perubahan sila pertama, dan pengesahan Pancasila oleh PPKI pada 18 Agustus 1945.", "blocks": [{"h": "Urutan peristiwa (1945)", "table": {"cols": ["Tanggal", "Peristiwa"], "rows": [["29 Mei–1 Juni", "Sidang pertama BPUPK membahas dasar negara"], ["1 Juni", "Soekarno berpidato dan menamai dasar negara Pancasila; diperingati sebagai Hari Lahir Pancasila"], ["22 Juni", "Panitia Sembilan menyusun Piagam Jakarta"], ["10–17 Juli", "Sidang kedua BPUPK membahas rancangan UUD"], ["18 Agustus", "PPKI mengesahkan UUD, termasuk Pembukaan yang memuat Pancasila"]]}}, {"h": "Usulan dan perubahan", "li": ["Pengusul dasar negara pada sidang pertama: Mohammad Yamin (29 Mei), Soepomo (31 Mei), Soekarno (1 Juni).", "Soekarno juga menawarkan Trisila dan Ekasila (gotong royong).", "Sila pertama Piagam Jakarta \"Ketuhanan dengan kewajiban menjalankan syariat Islam bagi pemeluk-pemeluknya\" diubah menjadi <b>Ketuhanan Yang Maha Esa<\/b> pada 18 Agustus 1945.", "Perubahan itu disepakati demi persatuan setelah keberatan wakil dari Indonesia bagian timur, disampaikan lewat Mohammad Hatta."]}], "traps": ["Pancasila disahkan PPKI pada 18 Agustus 1945, bukan pada 1 Juni; 1 Juni adalah Hari Lahir Pancasila.", "Piagam Jakarta disusun Panitia Sembilan, bukan PPKI."]}, {"code": "PAN-02", "title": "Pancasila sebagai dasar negara", "scope": "Sumber hukum, kedudukan", "src": "Kelas X", "tier": 1, "sum": "Kedudukan Pancasila sebagai dasar negara dan sumber segala sumber hukum, serta letaknya dalam Pembukaan UUD NRI Tahun 1945.", "blocks": [{"h": "Kedudukan", "li": ["Pancasila tercantum dalam alinea keempat Pembukaan UUD NRI Tahun 1945.", "Pancasila adalah <b>sumber segala sumber hukum negara<\/b> (UU No. 12 Tahun 2011, Pasal 2).", "Sebagai norma dasar negara (staatsfundamentalnorm), semua peraturan tidak boleh bertentangan dengan Pancasila.", "Fungsi lain: pandangan hidup bangsa, jiwa bangsa, kepribadian bangsa, perjanjian luhur, dan pemersatu bangsa."]}], "traps": ["Pancasila tercantum di Pembukaan alinea keempat, bukan di batang tubuh atau pasal-pasal UUD."]}, {"code": "PAN-03", "title": "Pancasila sebagai ideologi negara", "scope": "Ideologi terbuka, nilai", "src": "Kelas X–XI", "tier": 1, "sum": "Pancasila sebagai ideologi terbuka, tiga tingkat nilainya, dan perbandingannya dengan ideologi lain.", "blocks": [{"h": "Ideologi terbuka", "li": ["Ideologi terbuka: nilai dasarnya tetap, penjabarannya dapat menyesuaikan zaman.", "Tingkat nilai: <b>nilai dasar<\/b> (tetap, sila-sila), nilai instrumental (penjabaran dalam aturan dan kebijakan), nilai praksis (pelaksanaan sehari-hari).", "Dimensi ideologi (Alfian): realitas, idealitas, fleksibilitas."]}, {"h": "Perbandingan ideologi", "table": {"cols": ["Ideologi", "Pusat perhatian"], "rows": [["Liberalisme", "Kebebasan individu"], ["Komunisme", "Kepemilikan kolektif, peniadaan kelas"], ["Pancasila", "Keseimbangan individu dan masyarakat, berketuhanan, kekeluargaan"]]}}], "traps": ["Yang dapat berubah dalam ideologi terbuka adalah nilai instrumental dan praksis, bukan nilai dasarnya."]}, {"code": "PAN-04", "title": "Makna dan penerapan sila-sila Pancasila", "scope": "Hubungan sila, keseharian, global", "src": "Kelas X–XII", "tier": 2, "sum": "Hubungan antarsila yang bulat dan utuh, contoh penerapan tiap sila dalam keseharian, dan Pancasila dalam kehidupan global.", "blocks": [{"h": "Hubungan dan penerapan", "li": ["Sila-sila bersifat hierarkis piramidal (sila pertama mendasari yang lain) dan saling mengisi serta mengualifikasi.", "Contoh: menghormati teman yang beribadah (sila 1), membela korban perundungan (sila 2), memakai produk dalam negeri (sila 3), musyawarah di kelas (sila 4), tidak menyontek demi keadilan (sila 5).", "Dalam kehidupan global: bekerja sama tanpa kehilangan identitas, menyaring budaya asing dengan nilai Pancasila."]}]}, {"code": "PAN-05", "title": "Hak asasi manusia dalam perspektif Pancasila", "scope": "Dasar hukum, lembaga, pelanggaran", "src": "Kelas XI", "tier": 1, "sum": "Konsep HAM dalam Pancasila, dasar hukumnya, hak yang tidak dapat dikurangi, pembatasan HAM, dan lembaga penegak HAM.", "blocks": [{"h": "Dasar hukum", "li": ["UUD NRI Tahun 1945 Pasal 28A–28J; UU No. 39 Tahun 1999 tentang HAM; UU No. 26 Tahun 2000 tentang Pengadilan HAM.", "Pasal 28I ayat (1): hak yang <b>tidak dapat dikurangi<\/b> dalam keadaan apa pun, antara lain hak hidup, tidak disiksa, beragama, tidak diperbudak, tidak dituntut atas hukum yang berlaku surut.", "Pasal 28J: setiap orang wajib menghormati HAM orang lain; HAM dapat dibatasi dengan undang-undang."]}, {"h": "Pelanggaran dan lembaga", "li": ["Pelanggaran HAM berat (UU No. 26 Tahun 2000): genosida dan kejahatan terhadap kemanusiaan.", "Lembaga: Komnas HAM, Pengadilan HAM, Komnas Perempuan, KPAI, LPSK.", "Dalam perspektif Pancasila, hak asasi berjalan bersama kewajiban asasi."]}], "traps": ["Pelanggaran HAM berat menurut UU No. 26 Tahun 2000 hanya genosida dan kejahatan terhadap kemanusiaan.", "HAM boleh dibatasi undang-undang (Pasal 28J), kecuali hak dalam Pasal 28I ayat (1)."]}]}, {"id": "UUD", "name": "Undang-Undang Dasar NRI Tahun 1945", "short": "UUD 1945", "note": "Konstitusi, lembaga negara, pusat dan daerah, hak dan kewajiban, serta penegakan hukum.", "topics": [{"code": "UUD-01", "title": "Konstitusi dan amandemen UUD", "scope": "Kedudukan, sistematika, amandemen", "src": "Kelas X", "tier": 1, "sum": "Kedudukan UUD NRI Tahun 1945 sebagai hukum dasar, empat kali amandemen, kesepakatan dasar perubahannya, dan sistematika sesudah amandemen.", "blocks": [{"h": "Amandemen", "li": ["Diubah MPR empat kali: 1999, 2000, 2001, 2002.", "Kesepakatan dasar: tidak mengubah Pembukaan, tetap NKRI, mempertegas sistem <b>presidensial<\/b>, Penjelasan ditiadakan dan isi normatifnya masuk ke pasal, perubahan dengan cara adendum.", "Sistematika sesudah amandemen: Pembukaan dan Pasal-pasal (Penjelasan tidak ada lagi).", "Pasal 37 ayat (5): khusus bentuk NKRI tidak dapat dilakukan perubahan."]}, {"h": "Kedudukan", "li": ["UUD adalah hukum dasar tertulis dan berada di puncak hierarki peraturan perundang-undangan.", "Konstitusi yang pernah berlaku: UUD 1945 (1945–1949), Konstitusi RIS (1949–1950), UUDS 1950 (1950–1959), UUD 1945 lagi sejak Dekret Presiden 5 Juli 1959."]}], "traps": ["Pembukaan UUD tidak diubah dalam amandemen; yang diubah adalah pasal-pasal.", "Sesudah amandemen tidak ada lagi bagian Penjelasan."]}, {"code": "UUD-02", "title": "Lembaga negara menurut UUD", "scope": "MPR sampai BPK", "src": "Kelas X–XI", "tier": 1, "sum": "Kewenangan lembaga-lembaga negara menurut UUD NRI Tahun 1945 sesudah amandemen.", "blocks": [{"h": "Kewenangan", "table": {"cols": ["Lembaga", "Wewenang utama", "Pasal"], "rows": [["MPR", "Mengubah dan menetapkan UUD; melantik serta dapat memberhentikan presiden/wakil presiden", "3, 7B"], ["DPR", "Fungsi legislasi, anggaran, pengawasan; hak interpelasi, angket, menyatakan pendapat", "20A"], ["DPD", "Mengajukan dan ikut membahas RUU terkait otonomi daerah, hubungan pusat–daerah, sumber daya alam", "22D"], ["Presiden", "Kepala negara dan kepala pemerintahan; menjabat 5 tahun, dapat dipilih sekali lagi", "4, 7"], ["MA", "Mengadili kasasi; menguji peraturan di bawah UU terhadap UU", "24A"], ["MK", "Menguji UU terhadap UUD; sengketa kewenangan lembaga, pembubaran partai, perselisihan hasil pemilu", "24C"], ["KY", "Mengusulkan pengangkatan hakim agung; menjaga kehormatan hakim", "24B"], ["BPK", "Memeriksa pengelolaan dan tanggung jawab keuangan negara", "23E"]]}}, {"h": "Catatan", "li": ["Sesudah amandemen MPR bukan lagi lembaga tertinggi; semua lembaga negara sejajar dan saling mengawasi (checks and balances).", "Hakim konstitusi berjumlah 9 orang: 3 diajukan MA, 3 DPR, 3 Presiden."]}], "traps": ["MK menguji undang-undang terhadap UUD; MA menguji peraturan di bawah undang-undang terhadap undang-undang.", "Komisi Yudisial tidak mengadili perkara; tugasnya mengusulkan hakim agung dan menjaga perilaku hakim."]}, {"code": "UUD-03", "title": "Hubungan pemerintah pusat dan daerah", "scope": "Otonomi, asas, urusan", "src": "Kelas XI", "tier": 1, "sum": "Otonomi daerah menurut Pasal 18 UUD dan UU No. 23 Tahun 2014: asas penyelenggaraan, pembagian urusan, dan daerah khusus atau istimewa.", "blocks": [{"h": "Asas", "li": ["<b>Desentralisasi<\/b>: penyerahan urusan pemerintahan dari pusat kepada daerah otonom.", "Dekonsentrasi: pelimpahan sebagian urusan kepada gubernur sebagai wakil pemerintah pusat.", "Tugas pembantuan: penugasan dari pusat kepada daerah untuk melaksanakan sebagian urusan pusat."]}, {"h": "Urusan pemerintahan", "li": ["Urusan absolut (hanya pusat): politik luar negeri, pertahanan, keamanan, yustisi, moneter dan fiskal nasional, agama.", "Urusan konkuren dibagi antara pusat, provinsi, dan kabupaten/kota: wajib (pelayanan dasar dan nonpelayanan dasar) dan pilihan.", "Pasal 18B: negara mengakui daerah khusus atau istimewa, misalnya Aceh, Papua, dan Daerah Istimewa Yogyakarta."]}], "traps": ["Dekonsentrasi adalah pelimpahan kepada gubernur sebagai wakil pusat, bukan penyerahan urusan kepada daerah.", "Agama termasuk urusan absolut pemerintah pusat, tidak diserahkan kepada daerah."]}, {"code": "UUD-04", "title": "Hak dan kewajiban warga negara", "scope": "Pasal 26–34, kewarganegaraan", "src": "Kelas X–XII", "tier": 1, "sum": "Hak dan kewajiban warga negara dalam UUD, siapa warga negara Indonesia, dan asas kewarganegaraan.", "blocks": [{"h": "Pasal penting", "table": {"cols": ["Pasal", "Isi"], "rows": [["27 ayat (1)", "Persamaan kedudukan dalam hukum dan pemerintahan, wajib menjunjung keduanya"], ["27 ayat (3)", "Hak dan kewajiban ikut serta dalam upaya pembelaan negara"], ["28E", "Kebebasan beragama, berserikat, berkumpul, mengeluarkan pendapat"], ["30 ayat (1)", "Hak dan kewajiban ikut serta dalam pertahanan dan keamanan negara"], ["31", "Hak mendapat pendidikan; wajib mengikuti pendidikan dasar; anggaran pendidikan paling sedikit 20%"], ["33", "Perekonomian sebagai usaha bersama berdasar asas kekeluargaan"], ["34", "Fakir miskin dan anak telantar dipelihara negara"]]}}, {"h": "Kewarganegaraan", "li": ["Pasal 26: warga negara adalah orang Indonesia asli dan bangsa lain yang disahkan undang-undang.", "UU No. 12 Tahun 2006: asas ius sanguinis (keturunan), ius soli terbatas, kewarganegaraan tunggal, dan kewarganegaraan ganda terbatas untuk anak.", "Apatride: tidak berkewarganegaraan; bipatride: berkewarganegaraan ganda."]}], "traps": ["Bela negara adalah hak sekaligus kewajiban (Pasal 27 ayat 3 dan Pasal 30 ayat 1).", "Indonesia pada dasarnya memakai asas ius sanguinis; ius soli hanya terbatas."]}, {"code": "UUD-05", "title": "Pelanggaran hak dan pengingkaran kewajiban", "scope": "Kasus, faktor, penanganan", "src": "Kelas XII", "tier": 2, "sum": "Bentuk pelanggaran hak dan pengingkaran kewajiban warga negara, faktor penyebabnya, dan upaya generasi muda mengatasinya.", "blocks": [{"h": "Bentuk dan faktor", "li": ["Pelanggaran hak: diskriminasi, perundungan, menghalangi orang beribadah, mempekerjakan anak.", "Pengingkaran kewajiban: tidak membayar pajak, melanggar lalu lintas, merusak fasilitas umum, tidak ikut menjaga kebersihan.", "Faktor: sikap egois, rendahnya kesadaran hukum, sikap tidak toleran, lemahnya penegakan hukum, pengaruh teknologi."]}, {"h": "Penanganan", "li": ["Preventif: pendidikan, sosialisasi aturan, keteladanan.", "Represif: penegakan hukum dan sanksi.", "Generasi solutif: menganalisis kasus, menyusun solusi berbasis data, dan melaporkan pelanggaran lewat jalur resmi."]}], "traps": ["Pengingkaran kewajiban berbeda dari pelanggaran hak: yang pertama tidak melakukan yang diwajibkan, yang kedua merampas hak orang lain."]}, {"code": "UUD-06", "title": "Perlindungan dan penegakan hukum", "scope": "Lembaga penegak, hierarki, budaya taat hukum", "src": "Kelas X–XI", "tier": 1, "sum": "Lembaga penegak hukum, empat lingkungan peradilan, hierarki peraturan perundang-undangan, dan budaya taat hukum.", "blocks": [{"h": "Hierarki peraturan (UU No. 12 Tahun 2011, Pasal 7)", "li": ["UUD NRI Tahun 1945 → Ketetapan MPR → UU/Perppu → Peraturan Pemerintah → Peraturan Presiden → Perda Provinsi → Perda Kabupaten/Kota.", "Peraturan yang lebih rendah tidak boleh bertentangan dengan yang lebih tinggi."]}, {"h": "Lembaga dan peradilan", "li": ["Penegak hukum: kepolisian (penyelidikan, penyidikan), kejaksaan (penuntutan), hakim (mengadili), advokat, KPK.", "Empat lingkungan peradilan di bawah MA: umum, agama, militer, tata usaha negara (Pasal 24 ayat 2).", "Indonesia adalah negara hukum (Pasal 1 ayat 3)."]}, {"h": "Budaya taat hukum", "li": ["Penyebab pelanggaran: tidak tahu aturan, sengaja mencari untung, aturan dianggap tidak adil, penegakan lemah.", "Membangun taat hukum: keteladanan, pendidikan hukum, sanksi yang konsisten."]}], "traps": ["Perppu sederajat dengan undang-undang dalam hierarki, bukan dengan Peraturan Pemerintah.", "Penuntutan dilakukan jaksa; polisi melakukan penyelidikan dan penyidikan."]}]}, {"id": "BTI", "name": "Bhinneka Tunggal Ika", "short": "Kebinekaan", "note": "Makna semboyan, kebinekaan sebagai modal sosial, integrasi nasional, dan ancamannya.", "topics": [{"code": "BTI-01", "title": "Makna Bhinneka Tunggal Ika", "scope": "Asal, lambang negara", "src": "Kelas X", "tier": 1, "sum": "Asal semboyan Bhinneka Tunggal Ika, kedudukannya pada lambang negara, dan maknanya bagi bangsa yang majemuk.", "blocks": [{"h": "Asal dan kedudukan", "li": ["Berasal dari <b>Kakawin Sutasoma<\/b> karya Mpu Tantular pada masa Majapahit: \"Bhinneka tunggal ika tan hana dharma mangrwa\".", "Arti: berbeda-beda tetapi tetap satu; tidak ada kebenaran yang mendua.", "Ditulis pada pita yang dicengkeram Garuda Pancasila; diatur dalam UU No. 24 Tahun 2009 (bendera, bahasa, lambang negara, lagu kebangsaan).", "Pasal 36A UUD: lambang negara Garuda Pancasila dengan semboyan Bhinneka Tunggal Ika."]}], "traps": ["Bhinneka Tunggal Ika berasal dari Kakawin Sutasoma (Mpu Tantular), bukan Negarakertagama (Mpu Prapanca)."]}, {"code": "BTI-02", "title": "Kebinekaan sebagai modal sosial", "scope": "Keragaman, pembangunan nasional", "src": "Kelas X", "tier": 2, "sum": "Bentuk keragaman bangsa Indonesia, cara mengelolanya, dan perannya sebagai modal sosial pembangunan nasional.", "blocks": [{"h": "Keragaman dan pengelolaan", "li": ["Keragaman suku, agama, ras, budaya, bahasa daerah, dan golongan.", "Modal sosial: kepercayaan, jaringan, dan norma bersama yang memudahkan kerja sama.", "Mengelola kebinekaan: toleransi, dialog, kerja sama lintas kelompok, adil terhadap semua kelompok.", "Kebinekaan yang dikelola baik menjadi kekuatan ekonomi kreatif, pariwisata, dan diplomasi budaya."]}], "traps": ["Kebinekaan menjadi modal sosial hanya jika dikelola; tanpa pengelolaan dapat memicu konflik."]}, {"code": "BTI-03", "title": "Integrasi nasional", "scope": "Pendorong, penghambat, sejarah", "src": "Kelas X–XI", "tier": 1, "sum": "Pengertian integrasi nasional, faktor pendorong dan penghambatnya, serta tonggak sejarah persatuan bangsa.", "blocks": [{"h": "Faktor", "li": ["Pendorong: sejarah penjajahan yang sama, Sumpah Pemuda, bahasa Indonesia, Pancasila, semboyan Bhinneka Tunggal Ika.", "Penghambat: wilayah luas dan terpisah laut, primordialisme dan etnosentrisme, kesenjangan antardaerah, pengaruh asing."]}, {"h": "Tonggak sejarah", "li": ["Sumpah Pemuda pada Kongres Pemuda II, <b>28 Oktober 1928<\/b>: satu tanah air, satu bangsa, menjunjung bahasa persatuan.", "Proklamasi 17 Agustus 1945; kembali ke negara kesatuan pada 17 Agustus 1950."]}], "traps": ["Sumpah Pemuda menyatakan menjunjung bahasa persatuan, bukan berbahasa satu."]}, {"code": "BTI-04", "title": "Ancaman terhadap kebinekaan", "scope": "SARA, intoleransi, hoaks", "src": "Kelas X–XI", "tier": 2, "sum": "Bentuk ancaman terhadap persatuan dalam keberagaman dan cara menangkalnya.", "blocks": [{"h": "Bentuk dan penangkal", "li": ["Ancaman: konflik SARA, intoleransi, radikalisme dan terorisme, separatisme, hoaks dan ujaran kebencian di media sosial.", "Penangkal: literasi digital, memeriksa sumber sebelum menyebarkan, dialog antarumat, penegakan hukum.", "Ujaran kebencian dan hoaks di ruang digital dapat dijerat UU Informasi dan Transaksi Elektronik."]}]}]}, {"id": "NKR", "name": "Negara Kesatuan Republik Indonesia", "short": "NKRI", "note": "Bentuk negara, Wawasan Nusantara, pertahanan dan keamanan, peran warga negara, dan pemilu.", "topics": [{"code": "NKR-01", "title": "Bentuk negara kesatuan", "scope": "Pasal 1, sejarah, kedaulatan", "src": "Kelas X–XI", "tier": 2, "sum": "Indonesia sebagai negara kesatuan berbentuk republik, sejarah singkat bentuk negara, dan kedaulatan rakyat.", "blocks": [{"h": "Bentuk dan sejarah", "li": ["Pasal 1 ayat (1): negara kesatuan berbentuk republik; ayat (2): kedaulatan di tangan rakyat dan dilaksanakan menurut UUD.", "Bentuk serikat (RIS) berlaku 27 Desember 1949–17 Agustus 1950, lalu kembali ke negara kesatuan.", "Negara kesatuan: satu pemerintah pusat yang berdaulat; daerah diberi otonomi tetapi tidak berdaulat sendiri."]}]}, {"code": "NKR-02", "title": "Wawasan Nusantara", "scope": "Konsep, Djuanda, astagatra", "src": "Kelas X–XII", "tier": 1, "sum": "Wawasan Nusantara sebagai cara pandang bangsa tentang diri dan wilayahnya, dasar hukumnya, dan aspek astagatra.", "blocks": [{"h": "Konsep dan sejarah", "li": ["Cara pandang bangsa Indonesia tentang diri dan lingkungannya yang beragam dan strategis, mengutamakan persatuan wilayah dan bangsa.", "<b>Deklarasi Djuanda<\/b> 13 Desember 1957: laut di antara pulau adalah bagian wilayah Indonesia; diakui UNCLOS 1982 dan diratifikasi lewat UU No. 17 Tahun 1985.", "Perwujudan: kesatuan politik, ekonomi, sosial budaya, dan pertahanan keamanan."]}, {"h": "Astagatra", "table": {"cols": ["Kelompok", "Aspek"], "rows": [["Trigatra (alamiah)", "Letak geografis, kekayaan alam, kependudukan"], ["Pancagatra (sosial)", "Ideologi, politik, ekonomi, sosial budaya, pertahanan keamanan"]]}}], "traps": ["Trigatra adalah aspek alamiah; pancagatra adalah aspek sosial. Ideologi termasuk pancagatra."]}, {"code": "NKR-03", "title": "Sistem pertahanan dan keamanan negara", "scope": "Sishankamrata, TNI, Polri", "src": "Kelas X–XII", "tier": 1, "sum": "Sistem pertahanan dan keamanan rakyat semesta, peran TNI dan Polri, komponen pertahanan, serta bentuk ancaman.", "blocks": [{"h": "Sistem", "li": ["Pasal 30 ayat (2): <b>sistem pertahanan dan keamanan rakyat semesta<\/b> (sishankamrata), TNI dan Polri sebagai kekuatan utama, rakyat sebagai kekuatan pendukung.", "TNI (Angkatan Darat, Laut, Udara) bertugas mempertahankan, melindungi, dan memelihara keutuhan negara.", "Polri menjaga keamanan dan ketertiban masyarakat, melindungi, mengayomi, melayani, dan menegakkan hukum.", "Komponen pertahanan (UU No. 23 Tahun 2019): utama (TNI), cadangan, dan pendukung."]}, {"h": "Ancaman", "li": ["Ancaman militer: agresi, pelanggaran wilayah, pemberontakan bersenjata, terorisme bersenjata.", "Ancaman nonmiliter: ideologi, politik, ekonomi, sosial budaya, teknologi dan informasi, keselamatan umum (bencana, wabah)."]}], "traps": ["Menjaga keamanan dan ketertiban masyarakat adalah tugas Polri; pertahanan negara adalah tugas TNI."]}, {"code": "NKR-04", "title": "Menjaga keutuhan NKRI", "scope": "Bela negara, peran warga negara", "src": "Kelas X–XII", "tier": 2, "sum": "Bentuk bela negara dan peran warga negara, termasuk pelajar, dalam menjaga keutuhan dan kedaulatan NKRI.", "blocks": [{"h": "Bela negara", "li": ["Dasar: Pasal 27 ayat (3) dan Pasal 30 ayat (1) UUD.", "Nilai dasar bela negara: cinta tanah air, sadar berbangsa dan bernegara, setia pada Pancasila, rela berkorban, kemampuan awal bela negara.", "Bentuk bagi pelajar: belajar sungguh-sungguh, menaati aturan, menjaga toleransi, memakai produk dalam negeri, tidak menyebarkan hoaks.", "Bela negara tidak hanya dengan senjata (fisik) tetapi juga nonfisik."]}], "traps": ["Bela negara mencakup bentuk nonfisik; tidak hanya menjadi anggota TNI."]}, {"code": "NKR-05", "title": "Demokrasi dan pemilih pemula", "scope": "Asas pemilu, penyelenggara, partisipasi", "src": "Kelas X–XII", "tier": 1, "sum": "Demokrasi Pancasila, asas dan penyelenggara pemilu, syarat pemilih, dan peran pemilih pemula.", "blocks": [{"h": "Pemilu", "li": ["Asas pemilu (Pasal 22E): <b>langsung, umum, bebas, rahasia, jujur, adil<\/b> (luber jurdil).", "Penyelenggara (UU No. 7 Tahun 2017): KPU, Bawaslu, dan DKPP.", "Pemilih: WNI berusia 17 tahun atau sudah/pernah kawin pada hari pemungutan suara.", "Pemilu serentak terakhir 14 Februari 2024; pilkada serentak 27 November 2024."]}, {"h": "Perkembangan", "li": ["Putusan MK No. 135/PUU-XXII/2024 (dibacakan 26 Juni 2025) memisahkan pemilu nasional dan pemilu daerah mulai 2029; pengaturannya menunggu revisi undang-undang.", "Peran pemilih pemula: mengecek daftar pemilih, mengenali calon dan programnya, menolak politik uang, melawan hoaks."]}], "traps": ["Bawaslu mengawasi pemilu; DKPP memeriksa pelanggaran kode etik penyelenggara.", "Asas rahasia berarti pilihan pemilih tidak diketahui orang lain, bukan bahwa hasil pemilu dirahasiakan."]}]}], "notes": [{"title": "Perlu diperhatikan", "items": ["Buku Kurikulum Merdeka memakai nama BPUPK; buku lain memakai BPUPKI. Keduanya merujuk badan yang sama.", "Penempatan kelas tiap simpul adalah perkiraan; buku kelas X–XII membahas tema yang sama dari sudut berbeda.", "Aturan pemilu sedang berubah setelah Putusan MK No. 135/PUU-XXII/2024; cek undang-undang terbaru.", "Status ibu kota negara (Jakarta dan IKN) bergantung pada keputusan presiden yang belum terbit per 2025; peta ini tidak memuatnya."]}, {"title": "Rujukan", "items": ["Buku teks Pendidikan Pancasila Kurikulum Merdeka kelas X–XII (Kemendikbudristek). Judul bab dicocokkan lewat cuplikan buku, modul ajar, dan program tahunan sekolah karena PDF resmi tidak dapat dibuka dari lingkungan kerja.", "Elemen dan subelemen soal TKA 2025 PPKn (data/tka/tka-ppkn-pilihan-2025.json).", "UUD NRI Tahun 1945; UU No. 12 Tahun 2011; UU No. 23 Tahun 2014; UU No. 39 Tahun 1999; UU No. 26 Tahun 2000; UU No. 12 Tahun 2006; UU No. 7 Tahun 2017; UU No. 24 Tahun 2009; UU No. 23 Tahun 2019; pemberitaan Putusan MK No. 135/PUU-XXII/2024 (Tirto, Metro TV, Juni 2025)."]}], "bank": "bank-ppkn.html"};
const TIER = {1:["t1","Inti"],2:["t2","Penting"],3:["t3","Pelengkap"]};
const KEY = "peta-" + MAP.id + "-v1";
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch(e) {} }
const $ = id => document.getElementById(id);
// The text faces lack most Unicode superscript/subscript digits, so turn runs of them into <sup>/<sub>.
const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺", SUB = "₀₁₂₃₄₅₆₇₈₉", PLAIN = "0123456789-+";
function scripts(s){
  return s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g, m => "<sup>" + [...m].map(c => PLAIN[SUP.indexOf(c)]).join("").replace("-", "−") + "</sup>")
          .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, m => "<sub>" + [...m].map(c => PLAIN[SUB.indexOf(c)]).join("") + "</sub>");
}
(function walk(o){ for(const k in o){ if(typeof o[k] === "string") o[k] = scripts(o[k]); else if(o[k] && typeof o[k] === "object") walk(o[k]); } })(MAP);
const byCode = {};
MAP.domains.forEach((d,i) => { d.c = "var(--d" + (i % 7 + 1) + ")"; d.soft = "var(--s" + (i % 7 + 1) + ")"; d.topics.forEach(t => byCode[t.code] = {t, d}); });

function hl(str, re){
  if(!re) return str;
  return str.split(/(<[^>]+>)/g).map(p => p.startsWith("<") ? p : p.replace(re, m => "<mark>" + m + "</mark>")).join("");
}
function plain(t){
  const parts = [t.code, t.title, t.scope, t.src, t.sum];
  t.blocks.forEach(b => { parts.push(b.h); (b.li||[]).forEach(x => parts.push(x)); if(b.table){ parts.push(b.table.cols.join(" ")); b.table.rows.forEach(r => parts.push(r.join(" "))); } });
  (t.traps||[]).forEach(x => parts.push(x));
  return parts.join(" ").replace(/<[^>]+>/g, " ");
}
function bodyHTML(t, re){
  let h = "";
  t.blocks.forEach(b => {
    h += '<div class="blk' + (b.wide || (b.table && b.table.cols.length > 2) ? ' wide' : '') + '"><h4>' + hl(b.h, re) + '</h4>';
    if(b.li) h += "<ul>" + b.li.map(x => "<li>" + hl(x, re) + "</li>").join("") + "</ul>";
    if(b.table) h += '<div class="tbl"><table><thead><tr>' + b.table.cols.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>" +
      b.table.rows.map(r => "<tr>" + r.map(c => "<td>" + hl(c, re) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
    h += "</div>";
  });
  if(t.traps && t.traps.length) h += '<div class="traps"><h4>Jebakan soal</h4><ul>' + t.traps.map(x => "<li>" + hl(x, re) + "</li>").join("") + "</ul></div>";
  return h;
}

function render(){
  const total = Object.keys(byCode).length;
  document.title = MAP.title;
  $("eyebrow").textContent = "Peta materi · " + MAP.subject + " · " + MAP.domains.length + " bidang · " + total + " simpul";
  $("title").textContent = MAP.title;
  $("lead").innerHTML = MAP.lead + (MAP.bank ? ' <a href="' + MAP.bank + '">Latih dengan bank soal →</a>' : "");
  $("sourceNote").textContent = MAP.source_note || "";
  $("progress").innerHTML = MAP.domains.map(d => '<a class="pg" href="#d-' + d.id + '" style="--c:' + d.c + '"><b>' + d.short + '</b><div class="bar"><i id="bar-' + d.id + '"></i></div><span id="pg-' + d.id + '"></span></a>').join("");
  if(MAP.path && MAP.path.length){
    $("alur").hidden = false;
    $("h-alur").textContent = MAP.path_title || "Alur belajar";
    $("pathNote").textContent = MAP.path_note || "";
    $("path").innerHTML = MAP.path.map(e => '<li><button type="button" data-code="' + e.to + '"><span class="lb">' + e.label + '</span><span class="nm">' + e.title + '</span><span class="an">' + e.note + '</span></button></li>').join("");
  }
  const map = $("map"), host = $("domains");
  MAP.domains.forEach(d => {
    const col = document.createElement("div");
    col.className = "mcol"; col.style.setProperty("--c", d.c); col.style.setProperty("--soft", d.soft);
    col.innerHTML = '<h3><span>' + d.name + '</span><span class="mono">' + d.topics.length + '</span></h3><ul>' +
      d.topics.map(t => '<li><a class="chip" data-code="' + t.code + '" href="#t-' + t.code + '"><span class="mono">' + t.code + '</span><span>' + t.title + ' <span class="tier ' + TIER[t.tier][0] + '">' + TIER[t.tier][1] + '</span></span></a></li>').join("") + "</ul>";
    map.appendChild(col);
    const sec = document.createElement("section");
    sec.id = "d-" + d.id; sec.style.setProperty("--c", d.c); sec.style.setProperty("--soft", d.soft);
    sec.innerHTML = '<div class="domain-head"><h2>' + d.name + '</h2><span class="w">' + d.topics.length + ' simpul</span><p>' + (d.note || "") + '</p></div>';
    d.topics.forEach(t => {
      const a = document.createElement("article");
      a.className = "card"; a.id = "t-" + t.code; a.dataset.code = t.code;
      a.innerHTML = '<div class="card-head"><button class="toggle" type="button" aria-expanded="false" aria-controls="b-' + t.code + '">' +
        '<span class="code">' + t.code + '</span>' +
        '<span class="ttl"><span class="caret" aria-hidden="true">›</span>' + t.title + ' <span class="tier ' + TIER[t.tier][0] + '">' + TIER[t.tier][1] + '</span></span>' +
        '<span class="meta"><span>' + t.scope + '</span><span>' + t.src + '</span></span>' +
        '<span class="sum">' + t.sum + '</span></button>' +
        '<label class="done-box"><input type="checkbox" id="done-' + t.code + '"> Dikuasai</label></div>' +
        '<div class="body" id="b-' + t.code + '" hidden>' + bodyHTML(t, null) + '</div>';
      sec.appendChild(a);
    });
    host.appendChild(sec);
  });
  $("notes").innerHTML = (MAP.notes || []).map(n => '<div class="note"><h3>' + n.title + '</h3><ul>' + n.items.map(i => "<li>" + i + "</li>").join("") + "</ul></div>").join("");
}
function setOpen(card, open){
  card.classList.toggle("open", open);
  card.querySelector(".body").hidden = !open;
  card.querySelector(".toggle").setAttribute("aria-expanded", open ? "true" : "false");
}
function goTo(code){
  const card = $("t-" + code); if(!card) return;
  card.hidden = false; setOpen(card, true);
  card.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
}
function progress(){
  let k = 0, n = 0;
  MAP.domains.forEach(d => {
    const dn = d.topics.filter(t => done.has(t.code)).length;
    k += dn; n += d.topics.length;
    $("bar-" + d.id).style.width = (dn / d.topics.length * 100) + "%";
    $("pg-" + d.id).textContent = dn + " dari " + d.topics.length;
  });
  $("overall").textContent = k + " dari " + n;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("done", done.has(c.dataset.code)));
  document.querySelectorAll(".card").forEach(c => { const on = done.has(c.dataset.code); c.classList.toggle("is-done", on); c.querySelector('input[type="checkbox"]').checked = on; });
}
function search(q){
  q = q.trim();
  const re = q.length >= 2 ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi") : null;
  let hits = 0;
  document.querySelectorAll(".card").forEach(card => {
    const t = byCode[card.dataset.code].t, body = card.querySelector(".body");
    if(!re){ card.hidden = false; body.innerHTML = bodyHTML(t, null); setOpen(card, false); return; }
    const match = new RegExp(re.source, "i").test(plain(t));
    card.hidden = !match; body.innerHTML = bodyHTML(t, match ? re : null); setOpen(card, match);
    if(match) hits++;
  });
  $("hits").textContent = re ? (hits ? hits + " simpul cocok" : "Tidak ada yang cocok. Coba kata lain.") : "";
}

render();
progress();
document.addEventListener("click", e => {
  const tg = e.target.closest(".toggle");
  if(tg){ const card = tg.closest(".card"); setOpen(card, !card.classList.contains("open")); return; }
  const chip = e.target.closest("[data-code]");
  if(chip && (chip.classList.contains("chip") || chip.tagName === "BUTTON")){ e.preventDefault(); goTo(chip.dataset.code); }
});
document.addEventListener("change", e => {
  if(e.target.matches(".done-box input")){
    const code = e.target.closest(".card").dataset.code;
    e.target.checked ? done.add(code) : done.delete(code);
    save(); progress();
  }
});
let timer;
$("q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => search(e.target.value), 150); });
$("openAll").addEventListener("click", () => document.querySelectorAll(".card:not([hidden])").forEach(c => setOpen(c, true)));
$("closeAll").addEventListener("click", () => document.querySelectorAll(".card").forEach(c => setOpen(c, false)));
if(location.hash.startsWith("#t-")) goTo(location.hash.slice(3));
</script>
