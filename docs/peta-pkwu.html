 ide dan perencanaan sampai biaya, pemasaran, laporan, dan legalitas usaha.", "topics": [{"code": "KWU-01", "title": "Wirausaha dan karakternya", "scope": "Pengertian, karakter, risiko", "src": "Kelas X–XII", "tier": 1, "sum": "Wirausaha adalah orang yang menciptakan usaha baru dengan berani mengambil risiko terukur untuk meraih peluang dan keuntungan.", "blocks": [{"h": "Konsep", "li": ["<b>Kewirausahaan<\/b>: kemampuan kreatif dan inovatif untuk menciptakan nilai tambah dari sumber daya yang ada.", "Wirausaha menciptakan dan mengelola usaha sendiri; intrapreneur berinovasi di dalam perusahaan tempatnya bekerja.", "Kreatif berarti menghasilkan ide baru; inovatif berarti menerapkan ide itu menjadi produk atau cara baru."]}, {"h": "Karakter wirausaha", "li": ["Ciri yang sering dikutip dari Meredith: percaya diri, berorientasi tugas dan hasil, berani mengambil risiko, berjiwa kepemimpinan, orisinal, dan berorientasi ke masa depan.", "Risiko yang diambil adalah risiko terukur (moderat): sudah diperhitungkan, bukan nekat.", "Kegagalan dipandang sebagai bahan evaluasi."]}], "traps": ["Kreatif dan inovatif berbeda: kreatif menemukan ide, inovatif mewujudkannya menjadi sesuatu yang dipakai.", "Wirausaha mengambil risiko terukur, bukan risiko setinggi-tingginya."]}, {"code": "KWU-02", "title": "Ide dan peluang usaha", "scope": "Sumber ide, ATM, analisis SWOT", "src": "Kelas X–XII", "tier": 1, "sum": "Ide usaha berasal dari masalah, kebutuhan, hobi, atau potensi daerah, lalu diuji sebagai peluang dengan analisis seperti SWOT.", "blocks": [{"h": "Sumber ide", "li": ["Masalah sehari-hari yang belum terselesaikan, kebutuhan konsumen, hobi dan keahlian, potensi bahan lokal, tren pasar.", "Metode ATM: amati, tiru, modifikasi produk yang sudah ada agar lebih baik atau berbeda.", "Ide menjadi peluang bila ada pasar yang mau membeli dan usaha itu dapat dijalankan."]}, {"h": "Analisis SWOT", "table": {"cols": ["Unsur", "Faktor", "Contoh untuk usaha keripik"], "rows": [["Strengths (kekuatan)", "Internal", "Resep khas keluarga"], ["Weaknesses (kelemahan)", "Internal", "Modal kecil, kemasan sederhana"], ["Opportunities (peluang)", "Eksternal", "Banyak wisatawan mencari oleh-oleh"], ["Threats (ancaman)", "Eksternal", "Harga minyak goreng naik, pesaing banyak"]]}}], "traps": ["Kekuatan dan kelemahan berasal dari dalam usaha; peluang dan ancaman dari luar usaha."]}, {"code": "KWU-03", "title": "Perencanaan usaha", "scope": "Proposal, model bisnis kanvas", "src": "Kelas XI–XII", "tier": 1, "sum": "Rencana usaha menjelaskan produk, pasar, produksi, dan keuangan; model bisnis kanvas meringkasnya dalam sembilan blok.", "blocks": [{"h": "Model bisnis kanvas (9 blok)", "table": {"cols": ["Blok", "Pertanyaan"], "rows": [["Segmen pelanggan", "Untuk siapa produk dibuat?"], ["Proposisi nilai", "Masalah apa yang diselesaikan, apa keunggulannya?"], ["Saluran", "Lewat apa produk sampai ke pelanggan?"], ["Hubungan pelanggan", "Bagaimana menjaga pelanggan?"], ["Arus pendapatan", "Dari mana uang masuk?"], ["Sumber daya utama", "Apa yang paling dibutuhkan?"], ["Aktivitas utama", "Kegiatan pokok apa yang dilakukan?"], ["Kemitraan utama", "Siapa pemasok dan mitra?"], ["Struktur biaya", "Biaya terbesar apa saja?"]]}}, {"h": "Proposal usaha", "li": ["Isi umum: ringkasan, deskripsi usaha, analisis pasar, rencana produksi, rencana pemasaran, rencana keuangan, dan penutup.", "Studi kelayakan menilai apakah usaha layak dari aspek pasar, teknis, keuangan, hukum, dan lingkungan."]}], "traps": ["Proposisi nilai adalah alasan pelanggan memilih produk, bukan harga produk."]}, {"code": "KWU-04", "title": "Biaya, harga jual, dan titik impas", "scope": "Biaya tetap-variabel, HPP, BEP", "src": "Kelas X–XII", "tier": 1, "sum": "Menghitung biaya produksi, menetapkan harga jual, dan menentukan titik impas (BEP), yaitu saat usaha tidak untung dan tidak rugi.", "blocks": [{"h": "Biaya", "li": ["<b>Biaya tetap<\/b> tidak berubah walau jumlah produksi berubah: sewa tempat, penyusutan alat, gaji tetap.", "Biaya variabel naik turun mengikuti jumlah produksi: bahan baku, kemasan, upah per unit.", "Harga pokok produksi (HPP) per unit = total biaya produksi ÷ jumlah produk.", "Harga jual = HPP + keuntungan (markup), misalnya HPP Rp8.000 dengan markup 25% menjadi Rp10.000."]}, {"h": "Titik impas (BEP)", "li": ["<b>BEP unit = biaya tetap ÷ (harga jual per unit − biaya variabel per unit)<\/b>.", "BEP rupiah = BEP unit × harga jual per unit.", "Contoh: biaya tetap Rp600.000, harga jual Rp10.000, biaya variabel Rp6.000 per unit: BEP = 600.000 ÷ 4.000 = 150 unit, atau Rp1.500.000.", "Penjualan di atas BEP menghasilkan laba; di bawahnya rugi."]}], "traps": ["Pembagi BEP adalah selisih harga jual dan biaya variabel per unit (margin kontribusi), bukan harga jual saja.", "Markup 25% dihitung dari HPP; laba 25% dari harga jual menghasilkan angka berbeda."]}, {"code": "KWU-05", "title": "Pemasaran", "scope": "STP, bauran 4P, promosi digital", "src": "Kelas X–XII", "tier": 1, "sum": "Pemasaran menentukan siapa sasaran produk, bagaimana produk diposisikan, dan bagaimana bauran pemasaran disusun.", "blocks": [{"h": "STP", "li": ["Segmentasi: membagi pasar menurut geografis, demografis (usia, pendapatan), psikografis (gaya hidup), dan perilaku.", "Targeting: memilih segmen yang dilayani.", "Positioning: citra produk di benak konsumen, misalnya keripik pedas level untuk anak muda."]}, {"h": "Bauran pemasaran 4P", "table": {"cols": ["Unsur", "Isi"], "rows": [["Product (produk)", "Mutu, desain, merek, kemasan"], ["Price (harga)", "Penetapan harga, diskon"], ["Place (tempat)", "Distribusi, lokasi, toko daring"], ["Promotion (promosi)", "Iklan, promosi penjualan, media sosial"]]}}, {"h": "Promosi", "li": ["Untuk jasa, bauran diperluas menjadi 7P dengan people, process, dan physical evidence.", "Promosi digital: media sosial, lokapasar (marketplace), konten video, ulasan pelanggan."]}], "traps": ["Place dalam 4P berarti saluran distribusi, bukan hanya lokasi toko."]}, {"code": "KWU-06", "title": "Laporan keuangan sederhana", "scope": "Laba rugi, arus kas", "src": "Kelas XI–XII", "tier": 2, "sum": "Usaha kecil mencatat pemasukan dan pengeluaran, lalu menyusun laporan laba rugi dan arus kas untuk menilai hasil usaha.", "blocks": [{"h": "Laporan", "li": ["<b>Laba rugi<\/b>: pendapatan − beban; hasil positif laba, negatif rugi.", "Arus kas mencatat uang masuk dan keluar; usaha bisa untung tetapi kekurangan kas bila pembeli banyak berutang.", "Pisahkan uang usaha dan uang pribadi agar keuntungan sebenarnya terlihat."]}, {"h": "Evaluasi", "li": ["Bandingkan target dan hasil penjualan, cari penyebab selisih, lalu perbaiki produk, harga, atau promosi."]}]}, {"code": "KWU-07", "title": "Legalitas usaha dan HKI", "scope": "NIB, izin pangan, halal, merek", "src": "Kelas XI–XII", "tier": 2, "sum": "Usaha resmi membutuhkan izin berusaha; produk pangan perlu izin edar dan sertifikat halal; merek dilindungi dengan pendaftaran.", "blocks": [{"h": "Izin", "li": ["Nomor Induk Berusaha (NIB) diurus daring melalui sistem OSS (Online Single Submission).", "Pangan olahan industri rumah tangga memakai SPP-IRT (PIRT) dari pemerintah kabupaten/kota; pangan olahan berisiko lebih tinggi memakai izin edar BPOM.", "Sertifikat halal diterbitkan BPJPH berdasarkan UU No. 33 Tahun 2014 tentang Jaminan Produk Halal."]}, {"h": "Hak kekayaan intelektual", "li": ["<b>Merek<\/b> dilindungi setelah didaftarkan ke DJKI, berlaku 10 tahun dan dapat diperpanjang (UU No. 20 Tahun 2016).", "Hak cipta melindungi karya seni dan desain secara otomatis; paten melindungi invensi teknologi; desain industri melindungi bentuk produk."]}], "traps": ["Merek harus didaftarkan agar dilindungi; hak cipta berlaku otomatis tanpa pendaftaran."]}, {"code": "KWU-08", "title": "Usaha digital", "scope": "Lokapasar, media sosial, pembayaran digital", "src": "Kelas XI–XII", "tier": 2, "sum": "Teknologi digital dipakai untuk menjual, mempromosikan, dan menerima pembayaran, dengan peluang dan risikonya.", "blocks": [{"h": "Bentuk", "li": ["Toko di lokapasar, penjualan lewat media sosial, layanan pesan-antar, dan dropship (menjual tanpa menyimpan stok).", "Pembayaran nontunai: transfer bank, dompet digital, dan QRIS (standar kode QR pembayaran Bank Indonesia)."]}, {"h": "Hal yang diperhatikan", "li": ["Foto dan deskripsi produk yang jujur, respons cepat, ulasan pelanggan, biaya layanan platform, dan keamanan akun."]}]}]}, {"id": "KRJ", "name": "Kerajinan", "short": "Kerajinan", "note": "Bahan, teknik, desain, dan pemanfaatan limbah untuk produk kerajinan.", "topics": [{"code": "KRJ-01", "title": "Bahan dan teknik kerajinan", "scope": "Bahan alam dan buatan, teknik", "src": "Kelas X", "tier": 1, "sum": "Kerajinan dibuat dari bahan alam atau buatan dengan teknik tertentu, untuk fungsi pakai maupun fungsi hias.", "blocks": [{"h": "Bahan", "table": {"cols": ["Jenis", "Contoh"], "rows": [["Alam nabati", "Bambu, rotan, pandan, eceng gondok, kayu"], ["Alam hewani", "Kulit, tulang, tanduk, cangkang kerang"], ["Alam mineral", "Tanah liat, batu, logam"], ["Buatan", "Plastik, resin, fiber, kain sintetis"]]}}, {"h": "Teknik", "li": ["Anyam: menyilangkan bahan lungsin dan pakan; tenun memakai alat tenun.", "<b>Batik<\/b>: menghias kain dengan malam (lilin) sebagai perintang warna; batik tulis memakai canting, batik cap memakai cap tembaga.", "Ukir, pahat, cetak (gips, resin), makrame (simpul tali), sulam, jahit, dan teknik butsir pada tanah liat.", "Kerajinan fungsi pakai dipakai sehari-hari (tas, piring); fungsi hias untuk keindahan (hiasan dinding)."]}], "traps": ["Kain bermotif batik hasil mesin cetak (printing) tidak memakai malam, sehingga secara teknik bukan batik."]}, {"code": "KRJ-02", "title": "Desain produk kerajinan", "scope": "Unsur dan prinsip desain", "src": "Kelas X–XII", "tier": 2, "sum": "Desain kerajinan memadukan unsur dan prinsip rupa dengan fungsi, kenyamanan pemakaian, dan selera pasar.", "blocks": [{"h": "Unsur dan prinsip", "li": ["Unsur: garis, bidang, bentuk, warna, tekstur, ruang.", "Prinsip: kesatuan, keseimbangan, irama, proporsi, kontras atau aksen.", "Ergonomis berarti nyaman dan aman dipakai sesuai ukuran tubuh manusia."]}, {"h": "Proses", "li": ["Riset kebutuhan pasar, sketsa beberapa alternatif, pilih desain, buat purwarupa, uji, lalu produksi.", "Inspirasi dapat diambil dari budaya lokal, misalnya motif daerah, dan dikembangkan untuk pasar global."]}]}, {"code": "KRJ-03", "title": "Kerajinan dari limbah", "scope": "Limbah organik-anorganik, 3R", "src": "Kelas X–XII", "tier": 2, "sum": "Limbah organik dan anorganik dapat diolah menjadi produk bernilai jual, sekaligus mengurangi sampah.", "blocks": [{"h": "Jenis limbah", "li": ["Organik: mudah terurai, misalnya kulit jagung, sabut kelapa, pelepah pisang, serbuk kayu.", "Anorganik: sulit terurai, misalnya plastik, kaleng, kaca, kain perca.", "Limbah lunak (kertas, plastik kemasan) dan keras (kaca, kaleng, tempurung) memerlukan teknik berbeda."]}, {"h": "Prinsip", "li": ["<b>3R<\/b>: reduce (mengurangi), reuse (memakai ulang), recycle (mendaur ulang).", "Pilih limbah bersih dan aman; bersihkan dan keringkan sebelum diolah."]}]}]}, {"id": "RKY", "name": "Rekayasa", "short": "Rekayasa", "note": "Teknologi tepat guna, elektronika dasar, energi terbarukan, dan pembuatan purwarupa.", "topics": [{"code": "RKY-01", "title": "Rekayasa dan teknologi tepat guna", "scope": "Ciri TTG, contoh", "src": "Kelas X", "tier": 1, "sum": "Rekayasa menerapkan ilmu dan teknologi untuk menyelesaikan masalah; teknologi tepat guna sesuai dengan kebutuhan dan kemampuan masyarakat setempat.", "blocks": [{"h": "Teknologi tepat guna (TTG)", "li": ["<b>Ciri TTG<\/b>: sesuai kebutuhan masyarakat, mudah dibuat dan dirawat, murah, memakai bahan atau tenaga lokal, dan ramah lingkungan.", "Contoh: alat perontok padi, penyaring air sederhana, pompa hidram (tanpa listrik), kompor biomassa hemat.", "Rekayasa juga mencakup jasa profesi, misalnya servis perangkat elektronik dan instalasi listrik."]}, {"h": "Tahap merancang", "li": ["Identifikasi masalah, cari ide, buat gambar kerja, siapkan bahan dan alat, buat, uji, lalu perbaiki."]}], "traps": ["Teknologi tepat guna tidak harus canggih; yang penting sesuai masalah dan kemampuan pemakainya."]}, {"code": "RKY-02", "title": "Elektronika dasar", "scope": "Komponen, kode warna resistor", "src": "Kelas X–XI", "tier": 2, "sum": "Komponen elektronika dasar dan fungsinya, serta cara membaca nilai resistor dari gelang warnanya.", "blocks": [{"h": "Komponen", "table": {"cols": ["Komponen", "Fungsi"], "rows": [["Resistor", "Menghambat arus listrik (satuan ohm, Ω)"], ["Kapasitor", "Menyimpan muatan listrik sementara (farad)"], ["Dioda", "Mengalirkan arus satu arah"], ["LED", "Dioda yang memancarkan cahaya; kaki panjang adalah anoda (+)"], ["Transistor", "Saklar elektronik dan penguat"], ["Sakelar", "Memutus dan menyambung rangkaian"]]}}, {"h": "Kode warna resistor (4 gelang)", "li": ["Hitam 0, cokelat 1, merah 2, jingga 3, kuning 4, hijau 5, biru 6, ungu 7, abu-abu 8, putih 9.", "Gelang 1 dan 2 angka, gelang 3 pengali (×10ⁿ), gelang 4 toleransi: emas 5%, perak 10%.", "<b>Cokelat-hitam-merah-emas<\/b> = 10 × 10² = 1.000 Ω (1 kΩ) ±5%."]}]}, {"code": "RKY-03", "title": "Energi terbarukan", "scope": "Surya, angin, air, biogas", "src": "Kelas X–XII", "tier": 2, "sum": "Sumber energi yang dapat diperbarui dimanfaatkan dalam produk rekayasa sederhana untuk rumah dan desa.", "blocks": [{"h": "Sumber", "table": {"cols": ["Sumber", "Pemanfaatan"], "rows": [["Matahari", "Panel surya (fotovoltaik) mengubah cahaya menjadi listrik; pemanas air tenaga surya"], ["Angin", "Kincir angin memutar generator (PLTB)"], ["Air", "Pembangkit listrik mikrohidro (PLTMH) di aliran sungai"], ["Biomassa", "Biogas dari kotoran ternak yang difermentasi tanpa oksigen menghasilkan metana"]]}}, {"h": "Catatan", "li": ["Energi terbarukan tidak habis dalam waktu singkat; bahan bakar fosil tidak terbarukan.", "Listrik dari panel surya disimpan di aki atau baterai lewat pengatur pengisian."]}]}, {"code": "RKY-04", "title": "Gambar kerja dan purwarupa", "scope": "Sketsa, gambar teknik, prototipe", "src": "Kelas XI–XII", "tier": 3, "sum": "Gambar kerja dan purwarupa menerjemahkan ide rekayasa menjadi produk yang dapat dibuat dan diuji.", "blocks": [{"h": "Gambar dan purwarupa", "li": ["Sketsa untuk menuangkan ide; gambar kerja memuat ukuran, bahan, dan pandangan (depan, samping, atas).", "<b>Purwarupa<\/b> (prototipe) adalah model awal untuk diuji fungsi dan tampilannya sebelum diproduksi.", "Keselamatan kerja: pakai alat pelindung diri, periksa alat, dan matikan sumber listrik sebelum merangkai."]}]}]}, {"id": "BUD", "name": "Budi daya", "short": "Budi daya", "note": "Budi daya tanaman dan hewan, termasuk perbanyakan tanaman dan hidroponik.", "topics": [{"code": "BUD-01", "title": "Budi daya tanaman", "scope": "Pangan, sayuran, hidroponik", "src": "Kelas X", "tier": 1, "sum": "Budi daya tanaman mencakup penyiapan media, penanaman, pemeliharaan, panen, dan pascapanen, termasuk sistem hidroponik.", "blocks": [{"h": "Tahapan", "li": ["Persiapan bahan dan media, penyemaian, penanaman, pemeliharaan (penyiraman, pemupukan, penyiangan, pengendalian hama), panen, pascapanen.", "Pengendalian hama terpadu mengutamakan cara alami dan memakai pestisida kimia sebagai pilihan terakhir."]}, {"h": "Sistem hidroponik", "table": {"cols": ["Sistem", "Cara kerja"], "rows": [["Sumbu (wick)", "Larutan nutrisi naik ke akar lewat sumbu kain"], ["Rakit apung", "Tanaman di atas styrofoam yang mengapung pada larutan nutrisi"], ["NFT", "Lapisan tipis larutan nutrisi mengalir terus di talang"], ["DFT", "Larutan nutrisi tergenang lebih dalam di talang atau pipa"], ["Irigasi tetes", "Nutrisi diteteskan ke media tanam secara berkala"]]}}, {"h": "Hidroponik", "li": ["<b>Hidroponik<\/b> menanam tanpa tanah dengan larutan nutrisi; nutrisi umum disebut AB mix."]}], "traps": ["Hidroponik tetap butuh media tanam penopang (rockwool, sekam bakar, kerikil); yang ditiadakan adalah tanah."]}, {"code": "BUD-02", "title": "Perbanyakan tanaman", "scope": "Generatif dan vegetatif", "src": "Kelas X", "tier": 1, "sum": "Tanaman diperbanyak secara generatif dengan biji atau secara vegetatif dengan bagian tubuh tanaman.", "blocks": [{"h": "Cara", "li": ["Generatif: dengan biji hasil penyerbukan; sifat anak bisa berbeda dari induknya.", "Vegetatif alami: umbi, rimpang, geragih (stolon), tunas.", "Vegetatif buatan: <b>stek<\/b> (potongan batang), cangkok (akar ditumbuhkan pada cabang yang masih di pohon), okulasi (menempel mata tunas), sambung (grafting), merunduk.", "Kultur jaringan menumbuhkan potongan kecil jaringan di media steril, menghasilkan banyak bibit seragam."]}, {"h": "Kelebihan vegetatif", "li": ["Sifat bibit sama dengan induk dan lebih cepat berbuah; kelemahannya akar cangkok tidak sekuat akar tunggang."]}], "traps": ["Cangkok dilakukan saat cabang masih menempel pada pohon induk; stek memotong cabang lebih dulu."]}, {"code": "BUD-03", "title": "Budi daya hewan", "scope": "Unggas, ikan konsumsi", "src": "Kelas X–XII", "tier": 2, "sum": "Budi daya hewan meliputi pemilihan bibit, kandang atau kolam, pakan, kesehatan, panen, dan pemasaran.", "blocks": [{"h": "Unggas", "li": ["Ayam petelur (layer) dipelihara untuk telur, ayam pedaging (broiler) dipanen umur muda.", "Kandang bersih, sirkulasi udara baik, vaksinasi untuk mencegah penyakit seperti tetelo (ND)."]}, {"h": "Ikan", "li": ["Lele, nila, dan gurami umum dibudidayakan; kolam terpal atau kolam tanah.", "Kualitas air (suhu, pH, oksigen) dan pakan menentukan pertumbuhan.", "Budikdamber: budi daya ikan dalam ember sekaligus menanam sayuran di atasnya."]}]}]}, {"id": "PGL", "name": "Pengolahan", "short": "Pengolahan", "note": "Teknik mengolah dan mengawetkan bahan pangan, keamanan pangan, dan kemasan.", "topics": [{"code": "PGL-01", "title": "Teknik pengolahan pangan", "scope": "Teknik panas basah-kering, fermentasi", "src": "Kelas X", "tier": 1, "sum": "Bahan pangan diolah dengan teknik panas basah, panas kering, atau fermentasi menjadi makanan dan minuman bernilai jual.", "blocks": [{"h": "Teknik", "table": {"cols": ["Teknik", "Contoh"], "rows": [["Panas basah", "Merebus, mengukus, menyetup, mengetim"], ["Panas kering", "Menggoreng, memanggang, menyangrai"], ["Fermentasi", "Tempe, tapai, yoghurt, kecap"]]}}, {"h": "Fermentasi", "li": ["<b>Tempe<\/b> dibuat dengan kapang Rhizopus; tapai dengan ragi (Saccharomyces cerevisiae bersama kapang).", "Yoghurt dibuat dengan bakteri Lactobacillus bulgaricus dan Streptococcus thermophilus.", "Makanan khas daerah dapat dimodifikasi bentuk, rasa, atau kemasannya agar lebih menarik."]}], "traps": ["Tempe dibuat dengan kapang (jamur) Rhizopus, bukan bakteri."]}, {"code": "PGL-02", "title": "Pengawetan pangan", "scope": "Fisik, kimia, biologis", "src": "Kelas X", "tier": 1, "sum": "Pengawetan menghambat kerusakan pangan oleh mikroba dan enzim dengan cara fisik, kimia, atau biologis.", "blocks": [{"h": "Cara pengawetan", "table": {"cols": ["Cara", "Contoh"], "rows": [["Suhu tinggi", "Pasteurisasi (suhu di bawah 100 °C), sterilisasi (sekitar 121 °C), UHT"], ["Suhu rendah", "Pendinginan dan pembekuan"], ["Pengeringan", "Penjemuran, pengasapan, ikan asin, keripik"], ["Bahan alami", "Gula (manisan, selai), garam (asinan), cuka"], ["Biologis", "Fermentasi (asinan sayur, tempe)"]]}}, {"h": "Bahan berbahaya", "li": ["<b>Formalin dan boraks<\/b> dilarang dipakai pada pangan; pewarna tekstil (rhodamin B, kuning metanil) juga dilarang."]}], "traps": ["Pasteurisasi tidak membunuh semua mikroba, sehingga produknya tetap perlu disimpan dingin; sterilisasi membunuh hampir semuanya."]}, {"code": "PGL-03", "title": "Keamanan pangan dan kemasan", "scope": "Higiene, label, kemasan", "src": "Kelas X–XII", "tier": 1, "sum": "Produk pangan yang dijual harus higienis, dikemas dengan baik, dan diberi label yang lengkap dan jujur.", "blocks": [{"h": "Higiene dan sanitasi", "li": ["Cuci tangan, pakai penutup kepala dan celemek, alat bersih, bahan segar, dan tempat produksi terpisah dari kotoran.", "Pisahkan bahan mentah dan matang untuk mencegah kontaminasi silang."]}, {"h": "Label pangan", "li": ["Isi pokok: nama produk, daftar bahan, berat atau isi bersih, nama dan alamat produsen, tanggal kedaluwarsa, nomor izin edar (PIRT atau BPOM), dan logo halal bila ada.", "Kemasan primer bersentuhan langsung dengan pangan; sekunder melindungi kemasan primer; tersier untuk distribusi."]}, {"h": "Bahan kemasan", "li": ["Plastik food grade, kertas, kaca, kaleng, daun (pisang, jati); pilih sesuai jenis pangan dan lama simpan."]}], "traps": ["Kemasan primer adalah yang menyentuh pangan langsung, bukan kemasan terluar."]}]}], "notes": [{"title": "Perlu diperhatikan", "items": ["Sekolah memilih bidang Prakarya yang berbeda (budi daya, kerajinan, rekayasa, atau pengolahan); pelajari domain kewirausahaan dan bidang yang diambil sekolah.", "Banyak buku yang beredar masih edisi Kurikulum 2013 dengan judul bab berbeda; konsep inti kewirausahaan dan hitungan BEP sama.", "Aturan perizinan (NIB, PIRT, sertifikasi halal) sering diperbarui; peta ini memakai keadaan umum 2024 dan tidak mencantumkan tenggat kewajiban halal.", "Ciri wirausaha menurut Meredith adalah kutipan yang umum di buku sekolah; buku lain memakai daftar ciri yang berbeda."]}, {"title": "Rujukan", "items": ["Buku Prakarya dan Kewirausahaan SMA kelas X–XII (Kemendikbud, Kurikulum 2013 edisi revisi) dan buku Prakarya Kurikulum Merdeka: daftar bab.", "Capaian Pembelajaran Prakarya (Budi Daya, Kerajinan, Rekayasa, Pengolahan) Fase E–F, dari ringkasan sekunder; teks resminya tidak dapat dibuka dari lingkungan kerja ini.", "UU No. 20 Tahun 2016 (Merek dan Indikasi Geografis); UU No. 33 Tahun 2014 (Jaminan Produk Halal)."]}]};
const TIER = {1:["t1","Inti"],2:["t2","Penting"],3:["t3","Pelengkap"]};
const tags = t => '<span class="tier ' + TIER[t.tier][0] + '">' + TIER[t.tier][1] + '</span>' + (t.lanjut ? ' <span class="tier lj">Lanjut</span>' : '');
let onlyLanjut = false;
const KEY = "peta-" + MAP.id + "-v1";
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch(e) {} }
const $ = id => document.getElementById(id);
// The text faces lack most Unicode superscript/subscript digits, so turn runs of them into <sup>/<sub>.
const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺", SUB = "₀₁₂₃₄₅₆₇₈₉", PLAIN = "0123456789-+";
function scripts(s){
  return s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g, m => "<sup>" + [...m].map(c => PLAIN[SUP.indexOf(c)]).join("").replace("-", "−") + "</sup>")
          .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, m => "<sub>" + [...m].map(c => PLAIN[SUB.indexOf(c)]).join("") + "</sub>");
}
(function walk(o){ for(const k in o){ if(typeof o[k] === "string") o[k] = scripts(o[k]); else if(o[k] && typeof o[k] === "object") walk(o[k]); } })(MAP);
const byCode = {};
MAP.domains.forEach((d,i) => { d.c = "var(--d" + (i % 7 + 1) + ")"; d.soft = "var(--s" + (i % 7 + 1) + ")"; d.topics.forEach(t => byCode[t.code] = {t, d}); });

function hl(str, re){
  if(!re) return str;
  return str.split(/(<[^>]+>)/g).map(p => p.startsWith("<") ? p : p.replace(re, m => "<mark>" + m + "</mark>")).join("");
}
function plain(t){
  const parts = [t.code, t.title, t.scope, t.src, t.sum, t.lanjut ? "Tingkat Lanjut" : ""];
  t.blocks.forEach(b => { parts.push(b.h); (b.li||[]).forEach(x => parts.push(x)); if(b.table){ parts.push(b.table.cols.join(" ")); b.table.rows.forEach(r => parts.push(r.join(" "))); } });
  (t.traps||[]).forEach(x => parts.push(x));
  return parts.join(" ").replace(/<[^>]+>/g, " ");
}
function bodyHTML(t, re){
  let h = "";
  t.blocks.forEach(b => {
    h += '<div class="blk' + (b.wide || (b.table && b.table.cols.length > 2) ? ' wide' : '') + '"><h4>' + hl(b.h, re) + '</h4>';
    if(b.li) h += "<ul>" + b.li.map(x => "<li>" + hl(x, re) + "</li>").join("") + "</ul>";
    if(b.table) h += '<div class="tbl"><table><thead><tr>' + b.table.cols.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>" +
      b.table.rows.map(r => "<tr>" + r.map(c => "<td>" + hl(c, re) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
    h += "</div>";
  });
  if(t.traps && t.traps.length) h += '<div class="traps"><h4>Jebakan soal</h4><ul>' + t.traps.map(x => "<li>" + hl(x, re) + "</li>").join("") + "</ul></div>";
  return h;
}

function render(){
  const total = Object.keys(byCode).length;
  document.title = MAP.title;
  $("eyebrow").textContent = "Peta materi · " + MAP.subject + " · " + MAP.domains.length + " bidang · " + total + " simpul";
  $("title").textContent = MAP.title;
  $("lead").innerHTML = MAP.lead + (MAP.bank ? ' <a href="' + MAP.bank + '">Latih dengan bank soal →</a>' : "");
  $("sourceNote").textContent = MAP.source_note || "";
  $("progress").innerHTML = MAP.domains.map(d => '<a class="pg" href="#d-' + d.id + '" style="--c:' + d.c + '"><b>' + d.short + '</b><div class="bar"><i id="bar-' + d.id + '"></i></div><span id="pg-' + d.id + '"></span></a>').join("");
  if(MAP.path && MAP.path.length){
    $("alur").hidden = false;
    $("h-alur").textContent = MAP.path_title || "Alur belajar";
    $("pathNote").textContent = MAP.path_note || "";
    $("path").innerHTML = MAP.path.map(e => '<li><button type="button" data-code="' + e.to + '"><span class="lb">' + e.label + '</span><span class="nm">' + e.title + '</span><span class="an">' + e.note + '</span></button></li>').join("");
  }
  const map = $("map"), host = $("domains");
  MAP.domains.forEach(d => {
    const col = document.createElement("div");
    col.className = "mcol"; col.style.setProperty("--c", d.c); col.style.setProperty("--soft", d.soft);
    col.innerHTML = '<h3><span>' + d.name + '</span><span class="mono">' + d.topics.length + '</span></h3><ul>' +
      d.topics.map(t => '<li><a class="chip" data-code="' + t.code + '" href="#t-' + t.code + '"><span class="mono">' + t.code + '</span><span>' + t.title + ' ' + tags(t) + '</span></a></li>').join("") + "</ul>";
    map.appendChild(col);
    const sec = document.createElement("section");
    sec.id = "d-" + d.id; sec.style.setProperty("--c", d.c); sec.style.setProperty("--soft", d.soft);
    sec.innerHTML = '<div class="domain-head"><h2>' + d.name + '</h2><span class="w">' + d.topics.length + ' simpul</span><p>' + (d.note || "") + '</p></div>';
    d.topics.forEach(t => {
      const a = document.createElement("article");
      a.className = "card"; a.id = "t-" + t.code; a.dataset.code = t.code;
      a.innerHTML = '<div class="card-head"><button class="toggle" type="button" aria-expanded="false" aria-controls="b-' + t.code + '">' +
        '<span class="code">' + t.code + '</span>' +
        '<span class="ttl"><span class="caret" aria-hidden="true">›</span>' + t.title + ' ' + tags(t) + '</span>' +
        '<span class="meta"><span>' + t.scope + '</span><span>' + t.src + '</span></span>' +
        '<span class="sum">' + t.sum + '</span></button>' +
        '<label class="done-box"><input type="checkbox" id="done-' + t.code + '"> Dikuasai</label></div>' +
        '<div class="body" id="b-' + t.code + '" hidden>' + bodyHTML(t, null) + '</div>';
      sec.appendChild(a);
    });
    host.appendChild(sec);
  });
  if(Object.values(byCode).some(x => x.t.lanjut)){
    $("lanjutKey").hidden = false; $("onlyLanjut").hidden = false;
    if(MAP.lanjut_note){ $("lanjutNote").hidden = false; $("lanjutNote").textContent = MAP.lanjut_note; }
  }
  $("notes").innerHTML = (MAP.notes || []).map(n => '<div class="note"><h3>' + n.title + '</h3><ul>' + n.items.map(i => "<li>" + i + "</li>").join("") + "</ul></div>").join("");
}
function setOpen(card, open){
  card.classList.toggle("open", open);
  card.querySelector(".body").hidden = !open;
  card.querySelector(".toggle").setAttribute("aria-expanded", open ? "true" : "false");
}
function goTo(code){
  const card = $("t-" + code); if(!card) return;
  card.hidden = false; setOpen(card, true);
  card.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
}
function progress(){
  let k = 0, n = 0;
  MAP.domains.forEach(d => {
    const dn = d.topics.filter(t => done.has(t.code)).length;
    k += dn; n += d.topics.length;
    $("bar-" + d.id).style.width = (dn / d.topics.length * 100) + "%";
    $("pg-" + d.id).textContent = dn + " dari " + d.topics.length;
  });
  $("overall").textContent = k + " dari " + n;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("done", done.has(c.dataset.code)));
  document.querySelectorAll(".card").forEach(c => { const on = done.has(c.dataset.code); c.classList.toggle("is-done", on); c.querySelector('input[type="checkbox"]').checked = on; });
}
function search(q){
  q = q.trim();
  const re = q.length >= 2 ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi") : null;
  let hits = 0;
  document.querySelectorAll(".card").forEach(card => {
    const t = byCode[card.dataset.code].t, body = card.querySelector(".body");
    const keep = !onlyLanjut || t.lanjut;
    if(!re){ card.hidden = !keep; body.innerHTML = bodyHTML(t, null); setOpen(card, false); return; }
    const match = keep && new RegExp(re.source, "i").test(plain(t));
    card.hidden = !match; body.innerHTML = bodyHTML(t, match ? re : null); setOpen(card, match);
    if(match) hits++;
  });
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("off", onlyLanjut && !byCode[c.dataset.code].t.lanjut));
  $("hits").textContent = re ? (hits ? hits + " simpul cocok" : "Tidak ada yang cocok. Coba kata lain.") : "";
}

render();
progress();
document.addEventListener("click", e => {
  const tg = e.target.closest(".toggle");
  if(tg){ const card = tg.closest(".card"); setOpen(card, !card.classList.contains("open")); return; }
  const chip = e.target.closest("[data-code]");
  if(chip && (chip.classList.contains("chip") || chip.tagName === "BUTTON")){ e.preventDefault(); goTo(chip.dataset.code); }
});
document.addEventListener("change", e => {
  if(e.target.matches(".done-box input")){
    const code = e.target.closest(".card").dataset.code;
    e.target.checked ? done.add(code) : done.delete(code);
    save(); progress();
  }
});
let timer;
$("q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => search(e.target.value), 150); });
$("openAll").addEventListener("click", () => document.querySelectorAll(".card:not([hidden])").forEach(c => setOpen(c, true)));
$("onlyLanjut").addEventListener("click", e => { onlyLanjut = !onlyLanjut; e.target.setAttribute("aria-pressed", String(onlyLanjut)); search($("q").value); });
$("closeAll").addEventListener("click", () => document.querySelectorAll(".card").forEach(c => setOpen(c, false)));
if(location.hash.startsWith("#t-")) goTo(location.hash.slice(3));
</script>
