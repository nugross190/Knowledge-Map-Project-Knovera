:root{

  --mark:#6D5A1C; --warn:#F0A58A; --warn-soft:#3A221B; --ok:#8FD3A2; color-scheme:dark}}
:root[data-theme="dark"]{

  --d1:#A3B1F2; --d2:#E0A974; --d3:#76C7B9; --d4:#D9A0CF; --d5:#C3CC7E; --d6:#F0A58A; --d7:#9DBBE0;

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:28px 64px}
h1,h2,h3{font-family:var(--f-label);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.65rem;font-weight:700}
h3{font-size:1.15rem;font-weight:600}
p{margin:0}
a{color:inherit}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
sub,sup{line-height:0}
.eyebrow{font-family:var(--f-label);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.82em}
.lead{max-width:66ch;color:var(--muted);font-size:1.05rem;margin-top:12px}
section{margin-top:44px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:16px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.sec-head p{color:var(--muted);font-size:.95rem;max-width:62ch}

.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px;margin-top:22px}
.pg{display:flex;flex-direction:column;gap:5px;text-decoration:none;min-width:0}
.pg b{font-family:var(--f-label);font-size:.92rem;color:var(--c)}
.pg .bar{height:10px;background:var(--sunk);border-radius:2px;overflow:hidden;position:relative}
.pg .bar i{position:absolute;inset:0 auto 0 0;background:var(--c);width:0;transition:width .3s}
.pg .bar::after{content:"";position:absolute;inset:0;border:1.5px solid var(--c);border-radius:2px}
.pg span{font-size:.78rem;color:var(--muted);font-family:var(--f-label)}
.pg:focus-visible{outline:2px solid var(--c);outline-offset:3px}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:0 12px}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:10px 0;outline:none}
.btn{font-family:var(--f-label);font-weight:600;font-size:.92rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#hits{font-size:.9rem;color:var(--muted);font-family:var(--f-label)}
.overall{font-family:var(--f-label);font-size:.95rem;color:var(--muted);margin-top:10px}
.overall b{color:var(--ink);font-variant-numeric:tabular-nums}

.path-wrap{overflow-x:auto;padding-bottom:6px}
.path{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(130px,1fr);min-width:max-content}
.path li{border-top:2px solid var(--ink);padding:0 10px 0 0;position:relative}
.path li::before{content:"";position:absolute;left:0;top:-7px;width:12px;height:12px;border-radius:50%;background:var(--ink)}
.path button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;padding-top:14px;max-width:16em}
.path button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.path .lb{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.path .nm{font-family:var(--f-label);font-weight:700;font-size:1rem;line-height:1.15}
.path .an{font-size:.8rem;color:var(--muted);line-height:1.35}

.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.mcol{border-top:4px solid var(--c);background:var(--surface);border-radius:0 0 8px 8px;padding:14px;min-width:0}
.mcol h3{color:var(--c);display:flex;justify-content:space-between;gap:8px}
.mcol ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.chip{display:flex;gap:10px;align-items:baseline;text-decoration:none;padding:6px 8px;border-radius:5px;background:var(--soft);font-size:.93rem;line-height:1.35}
.chip:hover{outline:1.5px solid var(--c)}
.chip:focus-visible{outline:2px solid var(--c)}
.chip .mono{color:var(--c);flex:none}
.chip.done{text-decoration:line-through;text-decoration-color:var(--muted);opacity:.72}
.tier{display:inline-block;font-family:var(--f-label);font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap}
.t1{background:var(--ink);color:var(--bg)}
.t2{border:1.3px solid var(--ink)}
.t3{border:1.3px dashed var(--muted);color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:.88rem;color:var(--muted);align-items:center}

.domain-head{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;border-bottom:2px solid var(--c);padding-bottom:8px;margin-bottom:14px}
.domain-head h2{color:var(--c)}
.domain-head .w{font-family:var(--f-mono);font-size:1rem;color:var(--c)}
.domain-head p{color:var(--muted);font-size:.92rem;flex-basis:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0;scroll-margin-top:16px}
.card + .card{margin-top:10px}
.card-head{display:flex;gap:12px;align-items:flex-start;padding:14px 16px}
.toggle{all:unset;cursor:pointer;flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:2px 14px}
.toggle:focus-visible{outline:2px solid var(--c);outline-offset:4px;border-radius:4px}
.toggle .code{font-family:var(--f-mono);font-size:.8rem;color:var(--c);padding-top:4px;grid-row:span 3}
.toggle .ttl{font-family:var(--f-label);font-size:1.22rem;font-weight:700;line-height:1.2;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.toggle .meta{font-size:.82rem;color:var(--muted);font-family:var(--f-label);display:flex;flex-wrap:wrap;gap:4px 12px}
.toggle .sum{font-size:.95rem;color:var(--muted);max-width:75ch}
.caret{font-family:var(--f-mono);color:var(--muted);transition:transform .2s;display:inline-block}
.card.open .caret{transform:rotate(90deg)}
.done-box{flex:none;display:flex;align-items:center;gap:6px;font-family:var(--f-label);font-size:.85rem;color:var(--muted);cursor:pointer;padding-top:3px;user-select:none}
.done-box input{width:18px;height:18px;accent-color:var(--ok);cursor:pointer}
.card.is-done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.body{padding:2px 16px 18px 16px;border-top:1px dashed var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:18px 26px}
.blk{min-width:0}
.blk.wide{grid-column:1/-1}
.blk h4{font-family:var(--f-label);font-size:.82rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin:14px 0 6px}
.blk ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:5px}
.blk li{font-size:.95rem;line-height:1.55}
.blk li::marker{color:var(--c)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.4}
th{font-family:var(--f-label);font-weight:700;text-align:left;background:var(--soft);color:var(--ink);padding:7px 10px;white-space:nowrap}
td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
.traps{grid-column:1/-1;background:var(--warn-soft);border-radius:6px;padding:12px 14px}
.traps h4{color:var(--warn);margin-top:0}
.traps li::marker{color:var(--warn)}

.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.note ul{margin:8px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
footer{margin-top:40px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line);padding-top:14px}

@media (max-width:480px){
  .wrap{padding-inline:16px}
  .toggle{grid-template-columns:1fr}
  .toggle .code{grid-row:auto;padding-top:0}
  .card-head{flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.home-link{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:600;font-size:.9rem;color:var(--muted);text-decoration:none;margin-bottom:14px}
.home-link:hover,.home-link:focus-visible{color:var(--ink);text-decoration:underline;outline:none}
</style>

nsi", "note": "Persamaan dasar, siklus", "to": "AKT-01"}], "domains": [{"id": "DAS", "name": "Konsep dasar ilmu ekonomi", "short": "Konsep dasar", "note": "Kelangkaan, pilihan, sistem ekonomi, dan hubungan antarpelaku ekonomi.", "topics": [{"code": "DAS-01", "title": "Ilmu ekonomi dan kelangkaan", "scope": "Kebutuhan, kelangkaan, biaya peluang", "src": "Kelas X", "tier": 1, "sum": "Ilmu ekonomi mempelajari cara manusia memilih karena kebutuhan tidak terbatas sedangkan alat pemuasnya terbatas; setiap pilihan punya biaya peluang.", "blocks": [{"h": "Konsep pokok", "li": ["<b>Kelangkaan<\/b>: alat pemuas kebutuhan terbatas dibanding kebutuhan yang tidak terbatas; kelangkaan memaksa manusia memilih.", "Kebutuhan menurut intensitas: primer, sekunder, tersier; menurut waktu: sekarang dan masa depan; menurut sifat: jasmani dan rohani.", "Barang ekonomi langka dan perlu pengorbanan; barang bebas tersedia melimpah (udara); barang ilegal merugikan.", "Skala prioritas: menyusun kebutuhan dari yang paling mendesak."]}, {"h": "Biaya peluang", "li": ["<b>Biaya peluang<\/b> adalah nilai alternatif terbaik yang dikorbankan karena memilih satu pilihan.", "Contoh: memilih kuliah dan melepas pekerjaan bergaji Rp3.000.000,00 atau usaha beromzet bersih Rp2.000.000,00 per bulan; biaya peluangnya Rp3.000.000,00.", "Kurva kemungkinan produksi (KKP): titik di kurva efisien, di dalam kurva tidak efisien, di luar kurva belum terjangkau."]}, {"h": "Prinsip dan motif", "li": ["Prinsip ekonomi: dengan pengorbanan tertentu mendapat hasil maksimal, atau untuk hasil tertentu pengorbanan minimal.", "Motif ekonomi: dorongan melakukan kegiatan ekonomi (memenuhi kebutuhan, memperoleh laba, kekuasaan ekonomi, sosial).", "Ilmu ekonomi mikro mempelajari pelaku individual (rumah tangga, perusahaan, pasar satu barang); makro mempelajari perekonomian secara agregat."]}], "traps": ["Biaya peluang hanya nilai satu alternatif terbaik yang dilepas, bukan jumlah semua alternatif yang tidak dipilih.", "Kelangkaan bukan berarti barang sulit dicari; barang yang banyak pun langka jika tidak cukup untuk semua kebutuhan."]}, {"code": "DAS-02", "title": "Masalah pokok dan sistem ekonomi", "scope": "Apa, bagaimana, untuk siapa; sistem", "src": "Kelas X", "tier": 1, "sum": "Tiga masalah pokok ekonomi modern dan cara empat sistem ekonomi menjawabnya, termasuk sistem ekonomi Indonesia menurut Pasal 33 UUD 1945.", "blocks": [{"h": "Masalah pokok", "li": ["Ekonomi klasik: produksi, distribusi, konsumsi; kebutuhan pokok sandang, pangan, papan.", "Ekonomi modern: <b>apa, bagaimana, untuk siapa<\/b>: apa dan berapa yang diproduksi, bagaimana cara memproduksi, untuk siapa barang diproduksi."]}, {"h": "Sistem ekonomi", "table": {"cols": ["Sistem", "Siapa yang memutuskan", "Ciri"], "rows": [["Tradisional", "Adat dan kebiasaan", "Teknologi sederhana, barter, gotong royong"], ["Komando (terpusat)", "Pemerintah", "Faktor produksi dikuasai negara, harga ditetapkan"], ["Pasar (liberal)", "Mekanisme harga di pasar", "Hak milik pribadi, persaingan bebas, peran negara kecil"], ["Campuran", "Pasar dan pemerintah", "Swasta berperan, negara mengatur sektor strategis"]]}}, {"h": "Sistem ekonomi Indonesia", "li": ["Demokrasi ekonomi berlandaskan <b>Pasal 33 UUD 1945<\/b>: usaha bersama berdasar asas kekeluargaan.", "Cabang produksi penting yang menguasai hajat hidup orang banyak dikuasai negara; bumi, air, dan kekayaan alam dipergunakan untuk sebesar-besar kemakmuran rakyat.", "Tiga pelaku utama: BUMN/BUMD, swasta (BUMS), dan koperasi.", "Dihindari: free fight liberalism, etatisme (negara terlalu dominan), dan monopoli yang merugikan masyarakat."]}], "traps": ["Sistem ekonomi Indonesia bukan sistem pasar murni maupun komando: negara menguasai cabang produksi penting, tetapi swasta dan koperasi tetap berperan."]}, {"code": "DAS-03", "title": "Kegiatan dan pelaku ekonomi", "scope": "Produksi, distribusi, konsumsi; arus melingkar", "src": "Kelas X", "tier": 2, "sum": "Tiga kegiatan ekonomi, faktor produksi, dan hubungan rumah tangga konsumen, produsen, pemerintah, dan luar negeri dalam diagram arus melingkar.", "blocks": [{"h": "Kegiatan ekonomi", "li": ["Produksi: menghasilkan atau menambah nilai guna barang; bidang ekstraktif, agraris, industri, perdagangan, jasa.", "Faktor produksi: alam, tenaga kerja, modal, dan <b>kewirausahaan<\/b>; balas jasanya sewa, upah, bunga, dan laba.", "Distribusi: menyalurkan barang dari produsen ke konsumen, langsung, semi-langsung, atau tidak langsung.", "Konsumsi: menghabiskan atau mengurangi nilai guna barang untuk memenuhi kebutuhan."]}, {"h": "Nilai guna", "li": ["Form utility (bentuk), place utility (tempat), time utility (waktu), possession utility (kepemilikan), service utility (jasa).", "Contoh: menyimpan beras untuk dijual saat paceklik menambah nilai guna waktu."]}, {"h": "Arus melingkar", "table": {"cols": ["Model", "Pelaku", "Tambahan aliran"], "rows": [["Dua sektor", "Rumah tangga konsumen (RTK) dan produsen (RTP)", "Faktor produksi dan balas jasa; barang dan pengeluaran"], ["Tiga sektor", "+ pemerintah", "Pajak dan belanja pemerintah"], ["Empat sektor", "+ masyarakat luar negeri", "Ekspor dan impor"]]}}], "traps": ["Laba adalah balas jasa kewirausahaan, sedangkan bunga adalah balas jasa modal."]}]}, {"id": "PAS", "name": "Pasar dan harga", "short": "Pasar", "note": "Permintaan, penawaran, keseimbangan, elastisitas, dan bentuk pasar.", "topics": [{"code": "PAS-01", "title": "Permintaan dan penawaran", "scope": "Hukum, faktor, pergeseran kurva", "src": "Kelas X", "tier": 1, "sum": "Hukum permintaan dan penawaran, faktor yang memengaruhinya, serta bedanya pergerakan sepanjang kurva dan pergeseran kurva.", "blocks": [{"h": "Hukum", "li": ["<b>Hukum permintaan<\/b>: jika harga naik, jumlah yang diminta turun, dan sebaliknya, ceteris paribus.", "Hukum penawaran: jika harga naik, jumlah yang ditawarkan naik, dan sebaliknya, ceteris paribus.", "Fungsi linear: Qd = a − bP (kemiringan negatif), Qs = −c + dP (kemiringan positif)."]}, {"h": "Faktor yang menggeser kurva", "li": ["Permintaan: pendapatan, harga barang lain (substitusi, komplementer), selera, jumlah penduduk, perkiraan harga.", "Penawaran: biaya produksi, teknologi, harga barang lain, pajak dan subsidi, perkiraan harga, jumlah produsen.", "Barang substitusi: harga teh naik, permintaan kopi naik. Barang komplementer: harga bensin naik, permintaan mobil turun."]}, {"h": "Bergerak atau bergeser", "li": ["Perubahan harga barang itu sendiri: titik <b>bergerak sepanjang kurva<\/b>.", "Perubahan faktor selain harga: <b>kurva bergeser<\/b>, ke kanan jika naik, ke kiri jika turun."]}], "traps": ["Harga barang itu sendiri tidak menggeser kurva permintaannya; yang menggeser kurva adalah faktor selain harga.", "Kenaikan biaya produksi menggeser kurva penawaran ke kiri, bukan ke kanan."]}, {"code": "PAS-02", "title": "Keseimbangan pasar", "scope": "Harga keseimbangan, pajak, subsidi", "src": "Kelas X", "tier": 1, "sum": "Harga keseimbangan terjadi saat Qd = Qs; pajak per unit menaikkan harga dan menurunkan jumlah, subsidi sebaliknya.", "blocks": [{"h": "Keseimbangan", "li": ["Keseimbangan: <b>Qd = Qs<\/b>. Di atas harga keseimbangan terjadi kelebihan penawaran (surplus); di bawahnya kelebihan permintaan (shortage).", "Contoh: Qd = 100 − 2P dan Qs = −20 + 4P, maka 100 − 2P = −20 + 4P, P = 20 dan Q = 60."]}, {"h": "Pajak per unit", "li": ["Pajak t per unit menggeser penawaran ke kiri: harga di fungsi penawaran diganti (P − t).", "Contoh: t = 3, Qs' = −20 + 4(P − 3) = −32 + 4P; keseimbangan baru P = 22, Q = 56.", "Beban pajak konsumen per unit = harga baru − harga lama = 2; beban produsen = t − 2 = 1.", "Penerimaan pajak pemerintah = t × Q baru = 3 × 56 = 168."]}, {"h": "Subsidi per unit", "li": ["Subsidi s per unit menggeser penawaran ke kanan: harga di fungsi penawaran diganti (P + s).", "Harga keseimbangan turun dan jumlah naik; subsidi yang dinikmati konsumen = harga lama − harga baru.", "Pengeluaran subsidi pemerintah = s × Q baru."]}], "traps": ["Pajak per unit tidak seluruhnya ditanggung konsumen: sebagian ditanggung produsen, kecuali permintaan inelastis sempurna.", "Hitung pajak dari jumlah keseimbangan baru, bukan jumlah sebelum pajak."]}, {"code": "PAS-03", "title": "Elastisitas", "scope": "Permintaan dan penawaran", "src": "Kelas X", "tier": 2, "sum": "Elastisitas mengukur kepekaan jumlah terhadap perubahan harga; lima jenis elastisitas dan contoh barangnya.", "blocks": [{"h": "Rumus", "li": ["<b>E = (ΔQ/Q) : (ΔP/P)<\/b>, memakai nilai mutlak untuk permintaan.", "Contoh: harga naik dari 10 ke 12 (20%), jumlah diminta turun dari 100 ke 90 (10%); Ed = 10% : 20% = 0,5."]}, {"h": "Jenis elastisitas", "table": {"cols": ["Jenis", "Nilai E", "Contoh"], "rows": [["Elastis", "E &gt; 1", "Barang mewah, barang yang banyak substitusinya"], ["Inelastis", "E &lt; 1", "Beras, bensin, obat"], ["Uniter", "E = 1", "Perubahan jumlah sama dengan perubahan harga"], ["Inelastis sempurna", "E = 0", "Kurva tegak lurus; contoh: garam"], ["Elastis sempurna", "E = ∞", "Kurva mendatar"]]}}]}, {"code": "PAS-04", "title": "Bentuk pasar", "scope": "Persaingan sempurna sampai monopsoni", "src": "Kelas X", "tier": 2, "sum": "Pasar menurut jumlah penjual dan pembeli, jenis barang, dan kekuatan menentukan harga; aturan larangan monopoli di Indonesia.", "blocks": [{"h": "Struktur pasar output", "table": {"cols": ["Bentuk", "Penjual", "Barang", "Kuasa atas harga"], "rows": [["Persaingan sempurna", "Sangat banyak", "Homogen", "Tidak ada (price taker)"], ["Monopolistik", "Banyak", "Terdiferensiasi (merek)", "Sedikit"], ["Oligopoli", "Sedikit", "Homogen atau berbeda", "Besar, saling bergantung"], ["Monopoli", "Satu", "Tanpa substitusi dekat", "Penentu harga (price maker)"]]}}, {"h": "Pasar input dan aturan", "li": ["Monopsoni: satu pembeli (pabrik gula tunggal yang membeli tebu petani); oligopsoni: sedikit pembeli.", "Pasar faktor produksi: pasar tenaga kerja, pasar modal, pasar sumber daya alam.", "UU No. 5 Tahun 1999 melarang praktik monopoli dan persaingan usaha tidak sehat; pengawasnya <b>KPPU<\/b>."]}]}]}, {"id": "KEU", "name": "Uang dan lembaga keuangan", "short": "Keuangan", "note": "Uang, sistem pembayaran, bank sentral, OJK, bank, lembaga keuangan bukan bank, dan pasar modal.", "topics": [{"code": "KEU-01", "title": "Uang dan sistem pembayaran", "scope": "Fungsi, jenis, alat pembayaran", "src": "Kelas X", "tier": 1, "sum": "Fungsi dan syarat uang, jenis uang dan jumlah uang beredar, serta alat pembayaran tunai dan nontunai di Indonesia.", "blocks": [{"h": "Fungsi dan syarat", "li": ["Fungsi asli: alat tukar dan satuan hitung. Fungsi turunan: alat pembayaran, penimbun kekayaan, pemindah kekayaan, standar pembayaran tertunda.", "Syarat: diterima umum, tahan lama, mudah dibawa, mudah dibagi, nilainya stabil, tidak mudah dipalsukan."]}, {"h": "Jenis dan jumlah uang", "li": ["Uang kartal: uang kertas dan logam yang diedarkan Bank Indonesia. Uang giral: simpanan giro yang dapat ditarik dengan cek atau bilyet giro.", "<b>M1<\/b> = uang kartal + uang giral; M2 = M1 + uang kuasi (deposito berjangka, tabungan).", "Nilai intrinsik: nilai bahan pembuatnya; nilai nominal: nilai yang tertulis."]}, {"h": "Sistem pembayaran", "li": ["Tunai memakai uang kartal; nontunai memakai kartu debit, kartu kredit, uang elektronik, transfer, dan QR.", "QRIS adalah standar kode QR pembayaran nasional dari Bank Indonesia, wajib dipakai penyedia pembayaran berbasis QR sejak 1 Januari 2020.", "Bank Indonesia mengatur dan menjaga kelancaran sistem pembayaran."]}], "traps": ["Tabungan dan deposito termasuk uang kuasi (M2), bukan uang giral (M1)."]}, {"code": "KEU-02", "title": "Bank Indonesia dan OJK", "scope": "Bank sentral, pengawasan keuangan", "src": "Kelas X–XI", "tier": 1, "sum": "Bank Indonesia sebagai bank sentral dengan tujuan dan tugasnya, serta pembagian pengawasan dengan Otoritas Jasa Keuangan dan LPS.", "blocks": [{"h": "Bank Indonesia", "li": ["Bank sentral yang independen; dasar hukumnya UU No. 23 Tahun 1999 yang diubah beberapa kali, terakhir lewat UU P2SK (UU No. 4 Tahun 2023).", "Tujuan menurut UU P2SK (2023): stabilitas <b>nilai rupiah<\/b>, stabilitas sistem pembayaran, dan turut menjaga stabilitas sistem keuangan, untuk mendukung pertumbuhan berkelanjutan.", "Tugas: menetapkan dan melaksanakan kebijakan moneter, mengatur dan menjaga sistem pembayaran, kebijakan makroprudensial.", "Satu-satunya lembaga yang berwenang mengeluarkan dan mengedarkan rupiah."]}, {"h": "OJK dan LPS", "li": ["Otoritas Jasa Keuangan (UU No. 21 Tahun 2011) mengatur dan mengawasi <b>perbankan, pasar modal, dan IKNB<\/b>.", "Pengawasan bank berpindah dari BI ke OJK sejak 31 Desember 2013.", "Lembaga Penjamin Simpanan (LPS) menjamin simpanan nasabah bank; batas penjaminan Rp2 miliar per nasabah per bank (berlaku sejak 2008, masih berlaku 2025)."]}], "traps": ["Pengawas bank secara individual adalah OJK; Bank Indonesia mengatur kebijakan moneter dan makroprudensial.", "Mandat BI dalam UU P2SK sedang direvisi pada 2025–2026; cek rumusan terbaru sebelum dikutip."]}, {"code": "KEU-03", "title": "Bank dan lembaga keuangan bukan bank", "scope": "Bank umum, BPR, syariah, IKNB", "src": "Kelas X", "tier": 2, "sum": "Fungsi bank sebagai perantara keuangan, jenis bank, prinsip konvensional dan syariah, serta lembaga keuangan bukan bank.", "blocks": [{"h": "Bank", "li": ["Fungsi utama: menghimpun dana masyarakat dan menyalurkannya sebagai kredit (financial intermediary).", "Bank umum melayani lalu lintas pembayaran; <b>BPR<\/b> (Bank Perekonomian Rakyat sejak UU P2SK 2023) tidak ikut lalu lintas pembayaran.", "Produk: giro, tabungan, deposito; kredit investasi, modal kerja, konsumsi."]}, {"h": "Akad bank syariah", "table": {"cols": ["Akad", "Prinsip"], "rows": [["Mudharabah", "Bagi hasil; satu pihak modal, satu pihak pengelola"], ["Musyarakah", "Bagi hasil; modal dari kedua pihak"], ["Murabahah", "Jual beli dengan margin yang disepakati"], ["Wadiah", "Titipan"], ["Ijarah", "Sewa"]]}}, {"h": "Lembaga keuangan bukan bank (IKNB)", "li": ["Asuransi, dana pensiun, pegadaian, perusahaan pembiayaan (leasing), modal ventura, dan fintech pendanaan.", "Pegadaian memberi pinjaman dengan jaminan barang bergerak; leasing menyediakan barang modal secara sewa guna usaha."]}], "traps": ["BPR kini berarti Bank Perekonomian Rakyat (UU P2SK 2023), bukan lagi Bank Perkreditan Rakyat.", "Bank syariah tidak memakai bunga; keuntungannya dari bagi hasil, margin jual beli, atau sewa."]}, {"code": "KEU-04", "title": "Pasar modal", "scope": "Saham, obligasi, reksa dana", "src": "Kelas X", "tier": 2, "sum": "Pasar modal mempertemukan pihak yang butuh dana jangka panjang dengan investor; instrumen dan keuntungannya.", "blocks": [{"h": "Instrumen", "table": {"cols": ["Instrumen", "Sifat", "Keuntungan"], "rows": [["Saham", "Bukti kepemilikan perusahaan", "Dividen dan capital gain"], ["Obligasi", "Surat utang jangka panjang", "Bunga (kupon)"], ["Reksa dana", "Dana kolektif dikelola manajer investasi", "Kenaikan nilai aktiva bersih"]]}}, {"h": "Pelaku dan pasar", "li": ["Bursa Efek Indonesia (BEI) menyelenggarakan perdagangan efek; OJK mengawasi.", "Pasar perdana: efek dijual pertama kali (IPO); pasar sekunder: efek diperjualbelikan antarinvestor.", "Pasar modal untuk dana jangka panjang (lebih dari satu tahun); pasar uang untuk dana jangka pendek."]}]}]}, {"id": "PEL", "name": "Badan usaha dan koperasi", "short": "Badan usaha", "note": "Bentuk badan usaha dalam perekonomian Indonesia dan koperasi.", "topics": [{"code": "PEL-01", "title": "Badan usaha", "scope": "BUMN, BUMD, BUMS", "src": "Kelas XI", "tier": 1, "sum": "Bentuk badan usaha milik negara, daerah, dan swasta, dengan ciri kepemilikan, tanggung jawab, dan tujuannya.", "blocks": [{"h": "BUMN dan BUMD", "table": {"cols": ["Bentuk", "Modal", "Tujuan"], "rows": [["Persero", "Berbentuk saham, paling sedikit 51% milik negara", "Mengejar keuntungan"], ["Perum", "Seluruhnya milik negara, tidak terbagi atas saham", "Pelayanan umum sekaligus laba"], ["BUMD", "Milik pemerintah daerah", "PDAM, bank pembangunan daerah"]]}}, {"h": "Badan usaha swasta", "table": {"cols": ["Bentuk", "Ciri utama"], "rows": [["Perseorangan", "Satu pemilik, tanggung jawab tidak terbatas"], ["Firma", "Dua orang atau lebih, semua sekutu bertanggung jawab tidak terbatas"], ["CV", "Sekutu aktif (tidak terbatas) dan sekutu pasif/komanditer (terbatas pada modal)"], ["Perseroan terbatas (PT)", "Modal dari saham, tanggung jawab pemegang saham terbatas pada modal"]]}}, {"h": "Catatan", "li": ["UU No. 1 Tahun 2025 mengubah UU BUMN dan membentuk BPI Danantara sebagai pengelola investasi BUMN (2025).", "Peran BUMN: menyediakan barang dan jasa yang menguasai hajat hidup orang banyak, sumber penerimaan negara, perintis usaha."]}], "traps": ["Sekutu komanditer dalam CV hanya bertanggung jawab sebatas modalnya; sekutu aktif bertanggung jawab tidak terbatas.", "Persero mengejar laba; Perum mengutamakan pelayanan umum."]}, {"code": "PEL-02", "title": "Koperasi", "scope": "Asas, simpanan, SHU", "src": "Kelas XI", "tier": 1, "sum": "Koperasi sebagai badan usaha berasas kekeluargaan: landasan, prinsip, jenis simpanan, perangkat, dan cara membagi sisa hasil usaha.", "blocks": [{"h": "Landasan", "li": ["Dasar hukum UU No. 25 Tahun 1992; asas <b>kekeluargaan<\/b>; landasan Pancasila dan UUD 1945.", "Mohammad Hatta disebut Bapak Koperasi Indonesia; Hari Koperasi 12 Juli.", "Perangkat: rapat anggota (kekuasaan tertinggi), pengurus, pengawas."]}, {"h": "Simpanan", "li": ["Simpanan pokok: dibayar sekali saat masuk menjadi anggota.", "Simpanan wajib: dibayar berkala dalam jumlah tertentu.", "Simpanan sukarela: jumlah dan waktunya bebas."]}, {"h": "Sisa hasil usaha (SHU)", "li": ["SHU dibagi menurut persentase yang ditetapkan rapat anggota, antara lain jasa modal dan jasa usaha (jasa anggota).", "<b>Jasa modal<\/b> anggota = (simpanan anggota : total simpanan) × bagian SHU untuk jasa modal.", "Jasa usaha anggota = (transaksi anggota : total transaksi) × bagian SHU untuk jasa usaha.", "Contoh: simpanan Rp500.000,00 dari total Rp50.000.000,00, jasa modal 30% dari SHU Rp20.000.000,00: 0,01 × Rp6.000.000,00 = Rp60.000,00."]}], "traps": ["Jasa modal dihitung dari simpanan, jasa usaha dari transaksi (pembelian atau penjualan) anggota.", "Kekuasaan tertinggi koperasi ada pada rapat anggota, bukan pada pengurus."]}]}, {"id": "MAK", "name": "Ekonomi makro", "short": "Makro", "note": "Pendapatan nasional, kesenjangan, ketenagakerjaan, inflasi, pertumbuhan, dan ekonomi digital.", "topics": [{"code": "MAK-01", "title": "Pendapatan nasional", "scope": "PDB, PNB, tiga pendekatan", "src": "Kelas XI", "tier": 1, "sum": "Konsep dan cara menghitung pendapatan nasional, hubungan PDB sampai pendapatan disposabel, serta PDB riil dan per kapita.", "blocks": [{"h": "Tiga pendekatan", "li": ["Produksi: jumlah nilai tambah semua sektor produksi.", "Pendapatan: Y = sewa + upah + bunga + laba.", "<b>Pengeluaran: Y = C + I + G + (X − M)<\/b>; C konsumsi rumah tangga, I investasi, G belanja pemerintah, X ekspor, M impor."]}, {"h": "Dari PDB ke pendapatan disposabel", "li": ["PDB: nilai barang dan jasa akhir yang dihasilkan di wilayah negara, oleh warga negara maupun asing.", "<b>PNB = PDB + pendapatan neto faktor luar negeri<\/b> (pendapatan WNI di luar negeri − pendapatan WNA di dalam negeri).", "PNN = PNB − penyusutan; PN = PNN − pajak tidak langsung + subsidi.", "PP (pendapatan perseorangan) = PN − laba ditahan − iuran jaminan sosial − pajak perseroan + transfer payment.", "PD (disposable income) = PP − pajak langsung; PD dipakai untuk konsumsi dan tabungan."]}, {"h": "PDB riil dan per kapita", "li": ["PDB nominal memakai harga berlaku; <b>PDB riil<\/b> memakai harga konstan tahun dasar.", "PDB riil = PDB nominal : deflator × 100.", "Pendapatan per kapita = pendapatan nasional : jumlah penduduk."]}], "traps": ["PDB dihitung menurut wilayah, PNB menurut kewarganegaraan pemilik faktor produksi.", "Barang setengah jadi tidak dihitung dalam pendekatan produksi kecuali sebagai nilai tambah, agar tidak terjadi hitung ganda."]}, {"code": "MAK-02", "title": "Kesenjangan ekonomi", "scope": "Gini, kurva Lorenz, kemiskinan", "src": "Kelas XI", "tier": 2, "sum": "Ukuran ketimpangan pendapatan dengan rasio Gini, kurva Lorenz, dan kriteria Bank Dunia, serta penyebab dan upaya mengurangi kesenjangan.", "blocks": [{"h": "Ukuran", "li": ["<b>Rasio Gini<\/b> 0 berarti merata sempurna, 1 berarti timpang sempurna.", "Kategori umum: kurang dari 0,4 rendah; 0,4–0,5 sedang; lebih dari 0,5 tinggi.", "Kurva Lorenz: makin jauh dari garis kemerataan sempurna, makin timpang.", "Kriteria Bank Dunia (bagian pendapatan 40% penduduk termiskin): lebih dari 17% rendah, 12–17% sedang, kurang dari 12% tinggi."]}, {"h": "Penyebab dan upaya", "li": ["Penyebab: perbedaan pendidikan dan keterampilan, akses modal, infrastruktur antarwilayah, kepemilikan aset.", "Upaya: pajak progresif, bantuan sosial, pemerataan pendidikan dan kesehatan, pembangunan infrastruktur daerah.", "Data Gini dan kemiskinan Indonesia diterbitkan BPS dua kali setahun (Maret dan September); sebutkan tahunnya bila dikutip."]}], "traps": ["Rasio Gini yang naik berarti ketimpangan bertambah, bukan berkurang."]}, {"code": "MAK-03", "title": "Ketenagakerjaan", "scope": "Angkatan kerja, pengangguran, upah", "src": "Kelas XI", "tier": 1, "sum": "Klasifikasi penduduk menurut kegiatan, ukuran ketenagakerjaan, jenis pengangguran beserta penyebabnya, dan sistem upah.", "blocks": [{"h": "Klasifikasi BPS", "li": ["Penduduk usia kerja: 15 tahun ke atas. Angkatan kerja: bekerja dan pengangguran; bukan angkatan kerja: sekolah, mengurus rumah tangga, lainnya.", "<b>TPAK<\/b> = angkatan kerja : penduduk usia kerja × 100%.", "<b>TPT<\/b> (tingkat pengangguran terbuka) = pengangguran : angkatan kerja × 100%."]}, {"h": "Jenis pengangguran", "table": {"cols": ["Jenis", "Penyebab"], "rows": [["Friksional", "Masa pindah kerja atau mencari kerja yang lebih cocok"], ["Struktural", "Perubahan struktur ekonomi, keterampilan tidak sesuai"], ["Siklis (konjungtur)", "Resesi atau penurunan permintaan agregat"], ["Musiman", "Pergantian musim, misalnya selesai panen"], ["Teknologi", "Tenaga kerja diganti mesin"]]}}, {"h": "Menurut jam kerja dan upah", "li": ["Pengangguran terbuka, setengah menganggur (kurang dari 35 jam seminggu dan masih mencari kerja), terselubung (produktivitas rendah).", "Upah minimum provinsi ditetapkan gubernur setiap tahun; sebutkan tahun bila mengutip besarnya."]}], "traps": ["Ibu rumah tangga dan pelajar termasuk bukan angkatan kerja, bukan pengangguran.", "TPT dibagi dengan angkatan kerja, bukan dengan seluruh penduduk usia kerja."]}, {"code": "MAK-04", "title": "Indeks harga dan inflasi", "scope": "IHK, laju inflasi, penyebab", "src": "Kelas XI", "tier": 1, "sum": "Cara mengukur perubahan harga dengan angka indeks, menghitung laju inflasi, jenis inflasi menurut penyebab dan tingkatnya, serta dampaknya.", "blocks": [{"h": "Angka indeks dan laju", "li": ["Indeks harga sederhana = P<sub>n<\/sub> : P<sub>0<\/sub> × 100.", "Laspeyres = ΣP<sub>n<\/sub>Q<sub>0<\/sub> : ΣP<sub>0<\/sub>Q<sub>0<\/sub> × 100 (bobot tahun dasar); Paasche = ΣP<sub>n<\/sub>Q<sub>n<\/sub> : ΣP<sub>0<\/sub>Q<sub>n<\/sub> × 100 (bobot tahun berjalan).", "<b>Laju inflasi = (IHK<sub>t<\/sub> − IHK<sub>t−1<\/sub>) : IHK<sub>t−1<\/sub> × 100%<\/b>.", "Contoh: IHK naik dari 120 ke 126, laju inflasi = 6 : 120 × 100% = 5%."]}, {"h": "Jenis inflasi", "table": {"cols": ["Dasar", "Jenis"], "rows": [["Penyebab", "Demand-pull (permintaan naik), cost-push (biaya produksi naik)"], ["Asal", "Domestik dan impor (imported inflation)"], ["Tingkat", "Ringan &lt;10%, sedang 10–30%, berat 30–100%, hiperinflasi &gt;100% per tahun"]]}}, {"h": "Dampak dan pengendalian", "li": ["Merugikan penerima pendapatan tetap dan penabung; menguntungkan debitur dan pemilik aset riil.", "Pengendalian: kebijakan moneter (kontraktif), fiskal (mengurangi belanja, menaikkan pajak), dan nonmoneter (meningkatkan produksi, kelancaran distribusi).", "Deflasi: penurunan harga umum secara terus-menerus."]}], "traps": ["Laju inflasi dibagi dengan IHK periode sebelumnya, bukan IHK periode sekarang.", "Kenaikan harga satu barang saja bukan inflasi; inflasi adalah kenaikan harga umum secara terus-menerus."]}, {"code": "MAK-05", "title": "Pertumbuhan dan pembangunan ekonomi", "scope": "Laju PDB, IPM, teori", "src": "Kelas XI", "tier": 1, "sum": "Beda pertumbuhan dan pembangunan ekonomi, cara menghitung laju pertumbuhan, indikator pembangunan seperti IPM, dan teori pertumbuhan.", "blocks": [{"h": "Konsep", "li": ["Pertumbuhan: kenaikan PDB riil; pembangunan: pertumbuhan disertai perubahan struktur ekonomi dan kesejahteraan.", "<b>Laju pertumbuhan = (PDB riil<sub>t<\/sub> − PDB riil<sub>t−1<\/sub>) : PDB riil<sub>t−1<\/sub> × 100%<\/b>.", "Faktor: sumber daya alam, sumber daya manusia, modal, teknologi, kewirausahaan, kelembagaan."]}, {"h": "Indeks Pembangunan Manusia", "li": ["Tiga dimensi: umur panjang dan hidup sehat (angka harapan hidup), pengetahuan (harapan lama sekolah dan rata-rata lama sekolah), standar hidup layak (pengeluaran per kapita).", "IPM disusun UNDP dan dihitung di Indonesia oleh BPS."]}, {"h": "Teori pertumbuhan", "table": {"cols": ["Tokoh", "Gagasan"], "rows": [["Adam Smith", "Pembagian kerja dan spesialisasi"], ["W. W. Rostow", "Lima tahap: tradisional, prasyarat lepas landas, lepas landas, menuju kedewasaan, konsumsi massa tinggi"], ["Harrod–Domar", "Investasi menambah kapasitas produksi; pertumbuhan dipengaruhi tabungan dan ICOR"], ["Schumpeter", "Inovasi para wirausaha mendorong pertumbuhan"], ["Solow–Swan", "Modal, tenaga kerja, dan kemajuan teknologi"]]}}], "traps": ["Pertumbuhan dihitung dengan PDB riil, bukan PDB nominal, agar kenaikan harga tidak terhitung sebagai pertumbuhan."]}, {"code": "MAK-06", "title": "Ekonomi digital", "scope": "E-commerce, fintech, dampak", "src": "Kelas XI", "tier": 3, "sum": "Bentuk ekonomi digital, perannya dalam pembangunan, dan dampak positif serta tantangannya bagi tenaga kerja dan UMKM.", "blocks": [{"h": "Bentuk", "li": ["Perdagangan elektronik (e-commerce dan marketplace), teknologi finansial (pembayaran digital, pinjaman daring), ekonomi berbagi dan gig economy.", "Pinjaman daring yang legal terdaftar dan diawasi OJK."]}, {"h": "Dampak", "li": ["Positif: pasar lebih luas bagi UMKM, biaya transaksi turun, inklusi keuangan naik, lapangan kerja baru.", "Tantangan: kesenjangan akses internet, keamanan data, persaingan dengan produk impor, pekerja tanpa jaminan sosial."]}]}]}, {"id": "KEB", "name": "Kebijakan ekonomi pemerintah", "short": "Kebijakan", "note": "Kebijakan moneter, kebijakan fiskal dan APBN, serta perpajakan.", "topics": [{"code": "KEB-01", "title": "Kebijakan moneter", "scope": "Instrumen, ekspansif, kontraktif", "src": "Kelas XI", "tier": 1, "sum": "Kebijakan Bank Indonesia mengatur jumlah uang beredar dan suku bunga, instrumennya, dan arah kebijakan saat inflasi atau resesi.", "blocks": [{"h": "Instrumen", "table": {"cols": ["Instrumen", "Saat inflasi (kontraktif)", "Saat lesu (ekspansif)"], "rows": [["Operasi pasar terbuka", "Menjual surat berharga BI", "Membeli surat berharga"], ["Suku bunga kebijakan dan fasilitas diskonto", "Menaikkan", "Menurunkan"], ["Giro wajib minimum (cadangan wajib)", "Menaikkan rasio", "Menurunkan rasio"], ["Imbauan moral", "Imbauan menahan kredit", "Imbauan menyalurkan kredit"]]}}, {"h": "Logika", "li": ["Kontraktif mengurangi jumlah uang beredar untuk menekan inflasi; ekspansif menambahnya untuk mendorong kegiatan ekonomi.", "Kebijakan selektif mengatur kredit untuk sektor tertentu; kebijakan kuantitatif mengatur jumlah uang secara umum."]}], "traps": ["Menjual surat berharga menarik uang dari masyarakat (kontraktif); membeli surat berharga menambah uang beredar.", "Kebijakan moneter dijalankan Bank Indonesia, bukan Kementerian Keuangan."]}, {"code": "KEB-02", "title": "Kebijakan fiskal dan APBN", "scope": "APBN, APBD, defisit", "src": "Kelas XI–XII", "tier": 1, "sum": "Kebijakan pemerintah lewat penerimaan dan belanja negara, struktur APBN dan APBD, serta kebijakan fiskal ekspansif dan kontraktif.", "blocks": [{"h": "Struktur APBN", "li": ["Pendapatan negara: penerimaan perpajakan, penerimaan negara bukan pajak (PNBP), dan hibah.", "Belanja negara: belanja pemerintah pusat dan transfer ke daerah.", "Pembiayaan menutup defisit, misalnya dari surat berharga negara dan pinjaman.", "Penjelasan UU No. 17 Tahun 2003 membatasi defisit paling tinggi <b>3% dari PDB<\/b>."]}, {"h": "Arah kebijakan", "li": ["Ekspansif: menambah belanja atau menurunkan pajak saat ekonomi lesu; anggaran cenderung defisit.", "Kontraktif: mengurangi belanja atau menaikkan pajak saat inflasi tinggi.", "Fungsi APBN: otorisasi, perencanaan, pengawasan, alokasi, distribusi, stabilisasi."]}, {"h": "APBD", "li": ["Pendapatan daerah: pendapatan asli daerah (pajak daerah, retribusi), pendapatan transfer, dan lain-lain pendapatan yang sah.", "APBN disahkan dengan undang-undang; APBD dengan peraturan daerah."]}], "traps": ["Kebijakan fiskal dijalankan pemerintah lewat APBN, sedangkan kebijakan moneter oleh Bank Indonesia.", "Defisit anggaran berarti belanja lebih besar daripada pendapatan, bukan utang negara secara keseluruhan."]}, {"code": "KEB-03", "title": "Perpajakan", "scope": "Fungsi, jenis, tarif", "src": "Kelas XI–XII", "tier": 1, "sum": "Fungsi pajak, penggolongan pajak menurut pemungut dan sifat, jenis tarif, serta tarif PPh orang pribadi dan PPN.", "blocks": [{"h": "Fungsi pajak", "li": ["<b>Budgeter<\/b>: sumber penerimaan negara.", "Regulerend (mengatur): misalnya cukai rokok tinggi untuk menekan konsumsi.", "Redistribusi pendapatan dan stabilisasi."]}, {"h": "Penggolongan", "table": {"cols": ["Dasar", "Jenis", "Contoh"], "rows": [["Pemungut", "Pajak pusat", "PPh, PPN, PPnBM, bea meterai"], ["Pemungut", "Pajak daerah", "PBB perdesaan dan perkotaan, pajak kendaraan bermotor, pajak restoran"], ["Sifat", "Langsung (ditanggung sendiri)", "PPh, PBB"], ["Sifat", "Tidak langsung (dapat dialihkan)", "PPN, cukai"]]}}, {"h": "Tarif", "li": ["Proporsional (persentase tetap), progresif (persentase naik seiring dasar pajak), degresif (persentase turun), regresif.", "Tarif PPh orang pribadi (UU HPP 2021): 5% sampai Rp60 juta, 15%, 25%, 30%, dan 35% di atas Rp5 miliar setahun.", "PPN (PMK 131/2024): tarif 12% penuh untuk barang mewah; barang lain memakai dasar 11/12 sehingga efektif 11% (berlaku 2025)."]}], "traps": ["PPh termasuk pajak langsung, PPN pajak tidak langsung; yang menanggung PPN adalah konsumen akhir.", "Retribusi berbeda dari pajak: retribusi memberi imbalan langsung (misalnya karcis parkir)."]}]}, {"id": "INT", "name": "Ekonomi internasional", "short": "Internasional", "note": "Perdagangan internasional, kurs dan neraca pembayaran, kerja sama ekonomi.", "topics": [{"code": "INT-01", "title": "Perdagangan internasional", "scope": "Teori, kebijakan, proteksi", "src": "Kelas XII", "tier": 1, "sum": "Alasan negara berdagang, teori keunggulan, kebijakan perdagangan dan proteksi, serta manfaat dan dampaknya.", "blocks": [{"h": "Teori", "table": {"cols": ["Teori", "Tokoh", "Isi"], "rows": [["Keunggulan absolut", "Adam Smith", "Mengekspor barang yang dapat diproduksi lebih efisien daripada negara lain"], ["Keunggulan komparatif", "David Ricardo", "Berspesialisasi pada barang dengan biaya peluang paling rendah"], ["Proporsi faktor", "Heckscher–Ohlin", "Mengekspor barang yang memakai faktor produksi yang melimpah"]]}}, {"h": "Kebijakan", "li": ["Proteksi: tarif bea masuk, kuota impor, larangan impor, subsidi ekspor, standar mutu.", "<b>Dumping<\/b>: menjual barang di luar negeri lebih murah daripada di dalam negeri; dibalas dengan bea masuk antidumping.", "Perdagangan bebas: hambatan dikurangi lewat perjanjian (FTA)."]}, {"h": "Dampak", "li": ["Positif: barang lebih beragam, spesialisasi, devisa, alih teknologi.", "Negatif: ketergantungan pada negara lain, persaingan bagi produsen lokal, defisit neraca perdagangan."]}], "traps": ["Keunggulan komparatif tetap memberi alasan berdagang meskipun satu negara unggul absolut di semua barang.", "Dumping adalah harga ekspor lebih rendah daripada harga di pasar dalam negeri, bukan sekadar harga murah."]}, {"code": "INT-02", "title": "Kurs dan neraca pembayaran", "scope": "Sistem kurs, neraca", "src": "Kelas XII", "tier": 1, "sum": "Sistem kurs, cara menghitung dengan kurs beli dan kurs jual, faktor yang memengaruhi kurs, serta komponen neraca pembayaran.", "blocks": [{"h": "Kurs", "li": ["Sistem kurs: tetap, mengambang bebas, mengambang terkendali; Indonesia memakai kurs mengambang bebas sejak 14 Agustus 1997.", "<b>Kurs beli<\/b> dipakai bank saat membeli valas dari nasabah; kurs jual dipakai saat bank menjual valas ke nasabah.", "Kurs tengah = (kurs jual + kurs beli) : 2.", "Rupiah terdepresiasi jika butuh lebih banyak rupiah untuk satu dolar."]}, {"h": "Neraca pembayaran", "li": ["Transaksi berjalan: barang, jasa, pendapatan primer, pendapatan sekunder.", "Transaksi modal dan finansial: investasi langsung, investasi portofolio, investasi lainnya.", "Neraca perdagangan hanya mencatat ekspor dan impor barang; surplus jika ekspor &gt; impor.", "Selisih neraca pembayaran dicerminkan oleh perubahan cadangan devisa."]}], "traps": ["Nasabah yang menukar dolar menjadi rupiah dihitung dengan kurs beli bank, bukan kurs jual.", "Neraca perdagangan bukan neraca pembayaran; neraca perdagangan hanya bagian dari transaksi berjalan."]}, {"code": "INT-03", "title": "Kerja sama ekonomi internasional", "scope": "Bilateral, regional, multilateral", "src": "Kelas XII", "tier": 2, "sum": "Bentuk kerja sama ekonomi internasional, organisasi yang diikuti Indonesia, dan manfaat serta tantangannya.", "blocks": [{"h": "Bentuk", "table": {"cols": ["Bentuk", "Contoh"], "rows": [["Bilateral", "Indonesia–Jepang (IJEPA)"], ["Regional", "ASEAN, Masyarakat Ekonomi ASEAN (2015), APEC, RCEP"], ["Multilateral", "WTO (berdiri 1995), G20"]]}}, {"h": "Catatan", "li": ["Indonesia menjadi anggota penuh BRICS pada Januari 2025.", "Manfaat: pasar ekspor lebih luas, investasi masuk, alih teknologi; tantangan: persaingan produk dan tenaga kerja."]}]}]}, {"id": "AKT", "name": "Akuntansi dasar", "short": "Akuntansi", "note": "Persamaan dasar akuntansi, siklus akuntansi, dan laporan keuangan perusahaan jasa.", "topics": [{"code": "AKT-01", "title": "Persamaan dasar akuntansi", "scope": "Harta, utang, modal", "src": "Kelas XII", "tier": 1, "sum": "Persamaan Harta = Utang + Modal dan pengaruh setiap transaksi terhadap unsur-unsurnya, termasuk pendapatan, beban, dan prive.", "blocks": [{"h": "Persamaan", "li": ["<b>Harta = Utang + Modal<\/b>; setiap transaksi menjaga kedua sisi tetap seimbang.", "Pendapatan menambah modal; beban dan <b>prive<\/b> mengurangi modal.", "Prive: pengambilan harta perusahaan oleh pemilik untuk keperluan pribadi."]}, {"h": "Contoh transaksi", "table": {"cols": ["Transaksi", "Harta", "Utang", "Modal"], "rows": [["Pemilik menyetor kas Rp10 juta", "Kas +10 juta", "–", "+10 juta"], ["Membeli peralatan secara kredit Rp4 juta", "Peralatan +4 juta", "+4 juta", "–"], ["Menerima pendapatan jasa tunai Rp2 juta", "Kas +2 juta", "–", "+2 juta (pendapatan)"], ["Membayar gaji Rp1 juta", "Kas −1 juta", "–", "−1 juta (beban)"], ["Pemilik mengambil kas Rp500 ribu", "Kas −0,5 juta", "–", "−0,5 juta (prive)"]]}}], "traps": ["Prive mengurangi modal tetapi bukan beban; prive tidak masuk laporan laba rugi.", "Membeli aset secara tunai hanya menukar satu harta dengan harta lain; modal tidak berubah."]}, {"code": "AKT-02", "title": "Siklus akuntansi perusahaan jasa", "scope": "Jurnal, buku besar, penyesuaian", "src": "Kelas XII", "tier": 1, "sum": "Tahap pencatatan, pengikhtisaran, dan pelaporan; aturan debit-kredit; serta jurnal penyesuaian dan penutup.", "blocks": [{"h": "Tahap", "li": ["Pencatatan: bukti transaksi, jurnal umum, posting ke buku besar.", "Pengikhtisaran: neraca saldo, jurnal penyesuaian, neraca lajur.", "Pelaporan: laporan laba rugi, perubahan modal, posisi keuangan (neraca), arus kas.", "Penutupan: jurnal penutup dan neraca saldo setelah penutupan."]}, {"h": "Saldo normal", "table": {"cols": ["Akun", "Bertambah di", "Saldo normal"], "rows": [["Harta", "Debit", "Debit"], ["Utang", "Kredit", "Kredit"], ["Modal", "Kredit", "Kredit"], ["Pendapatan", "Kredit", "Kredit"], ["Beban dan prive", "Debit", "Debit"]]}}, {"h": "Penyesuaian", "li": ["Perlengkapan yang terpakai, penyusutan aset tetap, beban dibayar di muka, pendapatan diterima di muka, beban terutang, pendapatan yang masih harus diterima.", "Contoh: perlengkapan awal Rp3 juta, sisa akhir periode Rp1 juta; jurnal: beban perlengkapan (D) Rp2 juta, perlengkapan (K) Rp2 juta."]}], "traps": ["Prive bersaldo normal debit, sama seperti beban.", "Jurnal penyesuaian perlengkapan mencatat bagian yang terpakai, bukan sisa yang ada di gudang."]}, {"code": "AKT-03", "title": "Laporan keuangan", "scope": "Laba rugi, perubahan modal, neraca", "src": "Kelas XII", "tier": 2, "sum": "Urutan dan isi laporan keuangan perusahaan jasa serta hubungan antarlaporan.", "blocks": [{"h": "Isi dan urutan", "li": ["Laba rugi: pendapatan − beban = laba (atau rugi) bersih.", "<b>Modal akhir = modal awal + laba bersih − prive<\/b> (atau + tambahan investasi).", "Neraca (laporan posisi keuangan): harta di satu sisi, utang dan modal akhir di sisi lain.", "Laporan arus kas: kegiatan operasi, investasi, dan pendanaan."]}, {"h": "Standar", "li": ["Standar akuntansi di Indonesia disusun Ikatan Akuntan Indonesia (SAK); entitas mikro, kecil, dan menengah dapat memakai SAK EMKM."]}]}]}], "notes": [{"title": "Perlu diperhatikan", "items": ["Penempatan kelas mengikuti ringkasan umum Kurikulum Merdeka; APBN, pajak, dan ekonomi internasional ditempatkan berbeda oleh sumber yang berbeda.", "Mandat Bank Indonesia di UU P2SK sedang direvisi (2025–2026). Peta ini memakai rumusan UU No. 4 Tahun 2023; cek teks terbaru.", "Tarif pajak, batas penjaminan LPS, dan keanggotaan organisasi internasional dapat berubah; tahun tiap fakta dicantumkan.", "Istilah mengikuti buku sekolah: biaya peluang, pengangguran friksional/struktural/siklis, fungsi budgeter/regulerend, jasa modal, jasa usaha, prive."]}, {"title": "Rujukan", "items": ["Buku teks Ekonomi Kurikulum Merdeka kelas XI dan XII (Kemendikbudristek). Daftar bab dicocokkan lewat ringkasan Ruangguru, Mamikos, dan pemetaan materi sekolah karena PDF resmi tidak dapat dibuka dari lingkungan kerja.", "Elemen dan subelemen soal TKA 2025 Ekonomi (data/tka/tka-ekonomi-pilihan-2025.json).", "UU No. 4 Tahun 2023 (P2SK), UU No. 21 Tahun 2011 (OJK), UU No. 25 Tahun 1992 (Perkoperasian), UU No. 5 Tahun 1999, UU No. 17 Tahun 2003, UU HPP 2021, PMK 131/2024 (diberitakan pajak.go.id dan Kontan, Januari 2025)."]}]};
const TIER = {1:["t1","Inti"],2:["t2","Penting"],3:["t3","Pelengkap"]};
const KEY = "peta-" + MAP.id + "-v1";
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch(e) {} }
const $ = id => document.getElementById(id);
// The text faces lack most Unicode superscript/subscript digits, so turn runs of them into <sup>/<sub>.
const SUP = "⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺", SUB = "₀₁₂₃₄₅₆₇₈₉", PLAIN = "0123456789-+";
function scripts(s){
  return s.replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]+/g, m => "<sup>" + [...m].map(c => PLAIN[SUP.indexOf(c)]).join("").replace("-", "−") + "</sup>")
          .replace(/[₀₁₂₃₄₅₆₇₈₉]+/g, m => "<sub>" + [...m].map(c => PLAIN[SUB.indexOf(c)]).join("") + "</sub>");
}
(function walk(o){ for(const k in o){ if(typeof o[k] === "string") o[k] = scripts(o[k]); else if(o[k] && typeof o[k] === "object") walk(o[k]); } })(MAP);
const byCode = {};
MAP.domains.forEach((d,i) => { d.c = "var(--d" + (i % 7 + 1) + ")"; d.soft = "var(--s" + (i % 7 + 1) + ")"; d.topics.forEach(t => byCode[t.code] = {t, d}); });

function hl(str, re){
  if(!re) return str;
  return str.split(/(<[^>]+>)/g).map(p => p.startsWith("<") ? p : p.replace(re, m => "<mark>" + m + "</mark>")).join("");
}
function plain(t){
  const parts = [t.code, t.title, t.scope, t.src, t.sum];
  t.blocks.forEach(b => { parts.push(b.h); (b.li||[]).forEach(x => parts.push(x)); if(b.table){ parts.push(b.table.cols.join(" ")); b.table.rows.forEach(r => parts.push(r.join(" "))); } });
  (t.traps||[]).forEach(x => parts.push(x));
  return parts.join(" ").replace(/<[^>]+>/g, " ");
}
function bodyHTML(t, re){
  let h = "";
  t.blocks.forEach(b => {
    h += '<div class="blk' + (b.wide || (b.table && b.table.cols.length > 2) ? ' wide' : '') + '"><h4>' + hl(b.h, re) + '</h4>';
    if(b.li) h += "<ul>" + b.li.map(x => "<li>" + hl(x, re) + "</li>").join("") + "</ul>";
    if(b.table) h += '<div class="tbl"><table><thead><tr>' + b.table.cols.map(c => "<th>" + c + "</th>").join("") + "</tr></thead><tbody>" +
      b.table.rows.map(r => "<tr>" + r.map(c => "<td>" + hl(c, re) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
    h += "</div>";
  });
  if(t.traps && t.traps.length) h += '<div class="traps"><h4>Jebakan soal</h4><ul>' + t.traps.map(x => "<li>" + hl(x, re) + "</li>").join("") + "</ul></div>";
  return h;
}

function render(){
  const total = Object.keys(byCode).length;
  document.title = MAP.title;
  $("eyebrow").textContent = "Peta materi · " + MAP.subject + " · " + MAP.domains.length + " bidang · " + total + " simpul";
  $("title").textContent = MAP.title;
  $("lead").innerHTML = MAP.lead;
  $("sourceNote").textContent = MAP.source_note || "";
  $("progress").innerHTML = MAP.domains.map(d => '<a class="pg" href="#d-' + d.id + '" style="--c:' + d.c + '"><b>' + d.short + '</b><div class="bar"><i id="bar-' + d.id + '"></i></div><span id="pg-' + d.id + '"></span></a>').join("");
  if(MAP.path && MAP.path.length){
    $("alur").hidden = false;
    $("h-alur").textContent = MAP.path_title || "Alur belajar";
    $("pathNote").textContent = MAP.path_note || "";
    $("path").innerHTML = MAP.path.map(e => '<li><button type="button" data-code="' + e.to + '"><span class="lb">' + e.label + '</span><span class="nm">' + e.title + '</span><span class="an">' + e.note + '</span></button></li>').join("");
  }
  const map = $("map"), host = $("domains");
  MAP.domains.forEach(d => {
    const col = document.createElement("div");
    col.className = "mcol"; col.style.setProperty("--c", d.c); col.style.setProperty("--soft", d.soft);
    col.innerHTML = '<h3><span>' + d.name + '</span><span class="mono">' + d.topics.length + '</span></h3><ul>' +
      d.topics.map(t => '<li><a class="chip" data-code="' + t.code + '" href="#t-' + t.code + '"><span class="mono">' + t.code + '</span><span>' + t.title + ' <span class="tier ' + TIER[t.tier][0] + '">' + TIER[t.tier][1] + '</span></span></a></li>').join("") + "</ul>";
    map.appendChild(col);
    const sec = document.createElement("section");
    sec.id = "d-" + d.id; sec.style.setProperty("--c", d.c); sec.style.setProperty("--soft", d.soft);
    sec.innerHTML = '<div class="domain-head"><h2>' + d.name + '</h2><span class="w">' + d.topics.length + ' simpul</span><p>' + (d.note || "") + '</p></div>';
    d.topics.forEach(t => {
      const a = document.createElement("article");
      a.className = "card"; a.id = "t-" + t.code; a.dataset.code = t.code;
      a.innerHTML = '<div class="card-head"><button class="toggle" type="button" aria-expanded="false" aria-controls="b-' + t.code + '">' +
        '<span class="code">' + t.code + '</span>' +
        '<span class="ttl"><span class="caret" aria-hidden="true">›</span>' + t.title + ' <span class="tier ' + TIER[t.tier][0] + '">' + TIER[t.tier][1] + '</span></span>' +
        '<span class="meta"><span>' + t.scope + '</span><span>' + t.src + '</span></span>' +
        '<span class="sum">' + t.sum + '</span></button>' +
        '<label class="done-box"><input type="checkbox" id="done-' + t.code + '"> Dikuasai</label></div>' +
        '<div class="body" id="b-' + t.code + '" hidden>' + bodyHTML(t, null) + '</div>';
      sec.appendChild(a);
    });
    host.appendChild(sec);
  });
  $("notes").innerHTML = (MAP.notes || []).map(n => '<div class="note"><h3>' + n.title + '</h3><ul>' + n.items.map(i => "<li>" + i + "</li>").join("") + "</ul></div>").join("");
}
function setOpen(card, open){
  card.classList.toggle("open", open);
  card.querySelector(".body").hidden = !open;
  card.querySelector(".toggle").setAttribute("aria-expanded", open ? "true" : "false");
}
function goTo(code){
  const card = $("t-" + code); if(!card) return;
  card.hidden = false; setOpen(card, true);
  card.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
}
function progress(){
  let k = 0, n = 0;
  MAP.domains.forEach(d => {
    const dn = d.topics.filter(t => done.has(t.code)).length;
    k += dn; n += d.topics.length;
    $("bar-" + d.id).style.width = (dn / d.topics.length * 100) + "%";
    $("pg-" + d.id).textContent = dn + " dari " + d.topics.length;
  });
  $("overall").textContent = k + " dari " + n;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("done", done.has(c.dataset.code)));
  document.querySelectorAll(".card").forEach(c => { const on = done.has(c.dataset.code); c.classList.toggle("is-done", on); c.querySelector('input[type="checkbox"]').checked = on; });
}
function search(q){
  q = q.trim();
  const re = q.length >= 2 ? new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi") : null;
  let hits = 0;
  document.querySelectorAll(".card").forEach(card => {
    const t = byCode[card.dataset.code].t, body = card.querySelector(".body");
    if(!re){ card.hidden = false; body.innerHTML = bodyHTML(t, null); setOpen(card, false); return; }
    const match = new RegExp(re.source, "i").test(plain(t));
    card.hidden = !match; body.innerHTML = bodyHTML(t, match ? re : null); setOpen(card, match);
    if(match) hits++;
  });
  $("hits").textContent = re ? (hits ? hits + " simpul cocok" : "Tidak ada yang cocok. Coba kata lain.") : "";
}

render();
progress();
document.addEventListener("click", e => {
  const tg = e.target.closest(".toggle");
  if(tg){ const card = tg.closest(".card"); setOpen(card, !card.classList.contains("open")); return; }
  const chip = e.target.closest("[data-code]");
  if(chip && (chip.classList.contains("chip") || chip.tagName === "BUTTON")){ e.preventDefault(); goTo(chip.dataset.code); }
});
document.addEventListener("change", e => {
  if(e.target.matches(".done-box input")){
    const code = e.target.closest(".card").dataset.code;
    e.target.checked ? done.add(code) : done.delete(code);
    save(); progress();
  }
});
let timer;
$("q").addEventListener("input", e => { clearTimeout(timer); timer = setTimeout(() => search(e.target.value), 150); });
$("openAll").addEventListener("click", () => document.querySelectorAll(".card:not([hidden])").forEach(c => setOpen(c, true)));
$("closeAll").addEventListener("click", () => document.querySelectorAll(".card").forEach(c => setOpen(c, false)));
if(location.hash.startsWith("#t-")) goTo(location.hash.slice(3));
</script>
